<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Scuola · Paolo Rubinacci</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nola School"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"NolaMardiGras";src:url("fonts/NolaMardiGras.ttf") format("truetype");font-display:swap}
:root{--bg:#ffffff;--surf:#f3f7fc;--surf2:#e8f0fb;--ink:#0f1b2d;--muted:#5d6b80;--line:#dfe7f2;
--blue:#2f7bf6;--blue2:#e7f0ff;--sky:#8cc2ff;--coral:#ff6a4d;--coral2:#fff0ec;--green:#17a673;--red:#e2483a;
--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:600 14px var(--font);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:700 15px var(--font)}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font:800 20px var(--font);letter-spacing:-.02em;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--sky));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.streak{font:700 13px var(--font);background:var(--coral2);color:var(--coral);border-radius:999px;padding:6px 10px;white-space:nowrap}
/* home */
.hero{padding:34px 0 8px}
.hero h1{font:800 clamp(32px,8vw,48px)/1.08 var(--font);letter-spacing:-.03em;margin:6px 0 8px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 6px}
.stat{background:var(--surf);border-radius:var(--r);padding:14px}
.stat b{display:block;font:800 24px/1.1 var(--font);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.goal{background:linear-gradient(135deg,var(--blue),#5aa8ff);color:#fff}.stat.goal span{color:rgba(255,255,255,.85)}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:#fff}
.sec-t{font:800 20px var(--font);letter-spacing:-.02em;margin:28px 0 12px}
.grid{display:grid;gap:14px;margin:0 0 40px}
/* course cards: each course keeps its own palette */
.course{border-radius:22px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:#fff;box-shadow:0 8px 24px rgba(15,27,45,.06);transition:transform .15s}
.course:active{transform:scale(.99)}
.course .band{padding:22px 20px 18px}
.course .body{padding:14px 20px 18px}
.course .meta{font-size:14px;color:var(--muted)}
.course .bar{height:8px;border-radius:9px;background:var(--surf2);margin-top:12px;overflow:hidden}
.course .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.course .next{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:600 13px var(--font)}
.course .next b{color:var(--blue)}
.course.soon{cursor:default;border-style:dashed;box-shadow:none;padding:18px 20px;background:var(--surf)}
.course.soon h2{font:700 18px var(--font);margin:6px 0 2px;color:var(--muted)}
.course.nola .band{background:#1b2440;color:#faf6ec;border-bottom:3px solid #b8893a}
.course.nola .band .eyebrow{color:#d9b36a}
.course.nola .band h2{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 0}
.course.nola .body{background:#faf6ec}.course.nola .bar{background:#e6dcc6}.course.nola .bar i{background:#b8893a}.course.nola .next b{color:#6b2737}
/* ===== New Orleans theme (course + lessons), like the PDF manual ===== */
.t-nola{--paper:#fffdf8;--cream:#faf6ec;--cream2:#f3ead6;--nink:#24211c;--nmuted:#7c7466;--nline:#e6dcc6;--navy:#1b2440;--gold:#b8893a;--gold2:#d9b36a;--wine:#6b2737;
 background:var(--paper);color:var(--nink);font-family:"Tinos","Liberation Serif","Times New Roman",serif;font-size:17px;min-height:100vh}
.t-nola .eyebrow{color:var(--gold);font-family:var(--font)}
.t-nola .nt{font-family:"NolaMardiGras",Georgia,serif;font-weight:400}
.t-nola .chero{background:var(--navy);color:var(--cream);border-bottom:3px solid var(--gold);padding:30px 0 22px}
.t-nola .chero h1{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:clamp(32px,9vw,52px);line-height:1.08;margin:6px 0 6px}
.t-nola .chero .eyebrow{color:var(--gold2)}
.t-nola .chero p{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;color:rgba(250,246,236,.82)}
.lessons{list-style:none;margin:18px 0 40px;padding:0;border-top:1px solid var(--nline)}
.lessons li{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--nline);padding:14px 4px;cursor:pointer}
.lessons .num{font-family:"NolaMardiGras",Georgia,serif;font-size:30px;color:var(--gold);width:34px;text-align:center}
.lessons .t{font:700 18px/1.3 "Playfair Display",Georgia,serif;color:var(--navy)}.lessons .d{font:500 12px var(--font);color:var(--nmuted)}
.lessons .chk{margin-left:auto;font:600 12px var(--font);color:var(--nmuted);white-space:nowrap}.lessons .chk.done{color:#2f7a5b}
.brief{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--gold);padding:16px 18px 6px;margin:22px 0 26px}
.brief h3{color:var(--navy);margin:0 0 8px;font-size:21px}
.brief ol.steps{margin:4px 0 8px;padding:0;list-style:none;counter-reset:st}.brief ol.steps li{counter-increment:st;display:flex;align-items:baseline;gap:6px;padding:7px 0;border-bottom:1px dotted var(--nline);cursor:pointer;font-size:15.5px;line-height:1.35}.brief ol.steps li:last-child{border-bottom:0}.brief ol.steps li::before{content:counter(st);font:700 13px/1 var(--font);color:var(--paper);background:var(--navy);border-radius:50%;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;align-self:center}.brief ol.steps li .ts{margin-right:2px}
h2.passo{scroll-margin-top:70px;border-top:2px solid var(--gold);padding-top:14px;margin-top:30px}
/* concetti chiave: un tema per fascia (icona e nome sopra, filo sottile tra un tema e l'altro).
   Su schermo largo le voci scorrono in due colonne di testo bilanciate, come in un giornale; un tema con una sola voce va a tutta larghezza.
   Su telefono una colonna, con interlinee strette, per non allungare la pagina. */
.kc{margin:18px 0 10px;border-top:2px solid var(--navy)}
.kc .kch{font:700 11px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--navy);padding:10px 0 10px}
.kcg{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.kct{border:1px solid var(--nline);border-top:3px solid var(--navy);background:var(--paper);padding:0 0 4px}
.kct .kk{display:flex;align-items:center;gap:8px;font:700 11px/1.2 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);padding:10px 14px 8px;border-bottom:1px solid var(--nline)}
.kct .kk i{color:var(--gold);line-height:0}.kct .kk i svg{width:20px;height:20px}
.kct ul{list-style:none;margin:0;padding:0}
.kct li{padding:9px 14px 10px;border-top:1px solid var(--nline)}.kct li:first-child{border-top:0}
.kct li b{display:block;font:700 15.5px/1.25 "Playfair Display",Georgia,serif;color:var(--wine);margin-bottom:3px}
.kct li span{display:block;font:500 13.5px/1.4 var(--font);color:var(--ink)}
@media (max-width:640px){.kcg{grid-template-columns:1fr}.kct li{padding:8px 12px}.kct li b{font-size:15px}.kct li span{font-size:13px}}
.flow h2{font-size:24px;color:var(--navy);margin:34px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--nline);padding-bottom:6px;font-weight:400}
.flow p{margin:0 0 14px}
.ts{display:inline-block;white-space:nowrap;font:700 11px/1 var(--font);color:var(--gold);border:1px solid var(--gold2);border-radius:3px;padding:3px 5px;margin-right:7px;vertical-align:2px;background:var(--paper)}
.quote{border-left:3px solid var(--gold);background:var(--cream);padding:14px 16px;margin:16px 0;font-size:16px}
.quote .src{display:block;font:700 10px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
figure{margin:18px 0}figure img{width:100%;background:#fff;border:1px solid var(--nline)}figcaption{font:500 12px var(--font);color:var(--nmuted);margin-top:6px}
.pending{border:1px dashed var(--gold2);background:var(--cream);padding:16px;color:var(--nmuted);font-style:italic;margin:16px 0}
.clip{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--wine);margin:16px 0 20px}
.clip .vh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.clip .vh b{font:700 15px "Playfair Display",Georgia,serif;color:var(--wine)}.clip .vh .ts{margin-left:auto}
.clip video{display:block;width:100%;background:#000;max-height:60vh}
.film{background:var(--paper);border:1px solid var(--nline);border-top:3px solid var(--navy);margin:18px 0 26px;max-width:100%;min-width:0;overflow:hidden}
.film .fhd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 14px;font-family:var(--font)}
.film .fhd span:first-child{font:700 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.film .fhd b{font:600 13px var(--font);color:var(--nmuted)}.film .fhd .ts{margin-left:auto}
.film .fv{position:relative;background:#000}
.film video{display:block;width:100%;background:#000;max-height:62vh;aspect-ratio:16/10}
.film .fbar{position:relative;height:34px;background:var(--cream2);cursor:pointer;border-bottom:1px solid var(--nline);touch-action:manipulation}
.film .fbar .fs{position:absolute;top:0;bottom:0;background:rgba(27,36,64,.05);border-left:2px solid rgba(27,36,64,.35)}.film .fbar .fs.b{background:rgba(27,36,64,.12)}.film .fbar .fs:first-child{border-left:0}
.film .fbar .fs b{position:absolute;left:3px;top:2px;font:700 10px/1 var(--font);color:var(--navy);opacity:.75}.film .fbar .fs.cur{background:rgba(122,31,43,.16)}
.film .fbar .fm{position:absolute;top:15px;height:13px;background:var(--gold);min-width:6px}.film .fbar .fm.on{background:var(--wine)}
.film .fbar .fm.sc::after{content:'';position:absolute;left:50%;top:-5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--navy)}
.film .fbar .fp{position:absolute;top:0;bottom:0;width:2px;background:var(--wine);left:0;pointer-events:none}
.film .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--nline);font-family:var(--font)}
.film .ctl .btn{min-height:40px;min-width:44px}
.film .ctl .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.film .ctl .btn.off{opacity:.38}
.film .ctl .btn.sco{border-color:var(--gold);color:var(--navy);font-weight:700}
.film .fnow{font:600 13px var(--font);color:var(--nmuted);margin-left:auto}
.film .fnw{padding:12px 14px 10px;background:var(--cream);font-family:var(--font)}
.film .fst{display:flex;align-items:center;gap:10px}
.film .fst>div{flex:1;min-width:0}
.film .fst small{display:block;font:700 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.film .fst b{display:block;font:400 19px/1.25 "Playfair Display",Georgia,serif;color:var(--navy)}
.film .fst>button{all:unset;cursor:pointer;width:44px;height:44px;flex:none;text-align:center;line-height:44px;font:700 22px var(--font);color:var(--navy);border:1px solid var(--gold2);background:var(--paper)}
.film .fst>button:disabled{opacity:.3;cursor:default}
.film .fch{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.film .fch button{all:unset;cursor:pointer;flex:none;font:700 13px var(--font);color:var(--navy);border:1px solid var(--gold2);background:var(--paper);padding:0 12px;height:40px;line-height:40px;white-space:nowrap}
.film .fch button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.film .fch .none{font:500 13px var(--font);color:var(--nmuted);font-style:italic;padding:8px 0}
.film .fln{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:6px}
.film .fln button{all:unset;cursor:pointer;font:600 14px var(--font);color:var(--wine);padding:8px 0}
/* partitura in sovrimpressione: in alto, lontano dalle mani e dalla tastiera */
.film .fsc{position:absolute;z-index:3;top:8px;left:8px;width:var(--scw,70%);max-height:var(--sch,50%);display:none;flex-direction:column;background:rgba(255,253,246,.96);border:1px solid var(--gold2);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.film.sco .fsc{display:flex}.film .fsc.r{left:auto;right:8px}
.film .fsc .sh{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 6px;background:var(--navy);color:#fff;font:600 12px var(--font)}
.film .fsc .sh span{flex:1;min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.film .fsc .sh button{all:unset;cursor:pointer;min-width:34px;height:32px;line-height:32px;text-align:center;border:1px solid rgba(255,255,255,.4);padding:0 7px;font:700 13px var(--font)}
.film .fsc .sh button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.film .fsc .sb{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.film .fsc img{display:block;width:100%;background:#fff}
.film .fsc.fit img{width:auto;max-width:100%;max-height:var(--imh,200px);margin:0 auto}
.film .fsc .tx{padding:8px 10px;font-size:14px;line-height:1.45;border-top:1px solid var(--nline)}.film .fsc .tx p{margin:0}
/* abbinare le partiture del PDF ai momenti suonati */
.film .fabb{display:none;border-top:1px solid var(--nline);padding:12px 14px 14px;font-family:var(--font);background:var(--paper)}
.film.abb .fabb{display:block}
.film .fabb .ah{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 14px var(--font);color:var(--navy)}
.film .fabb select{font:600 15px var(--font);padding:8px;border:1px solid var(--gold2);background:#fff;color:var(--navy);flex:1 1 240px;width:100%;min-width:0;max-width:100%}
.film .fabb .ah .btn{margin-left:auto}
.film .fabb h4{font:700 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.film .fabb .ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:8px}
.film .fabb .ag button{all:unset;cursor:pointer;position:relative;border:2px solid var(--nline);background:#fff;padding:4px 4px 6px}
.film .fabb .ag button img{display:block;width:100%;height:84px;object-fit:contain;object-position:left top}
.film .fabb .ag button i{display:block;font:600 12px/1.3 var(--font);font-style:normal;color:var(--nmuted);margin-top:4px}
.film .fabb .ag button.on{border-color:var(--wine);background:var(--cream)}
.film .fabb .ag button.on::after{content:'✓';position:absolute;top:4px;right:4px;width:26px;height:26px;line-height:26px;text-align:center;background:var(--wine);color:#fff;font:700 15px var(--font)}
.film .fabb .an{font:500 13px var(--font);color:var(--nmuted);margin-top:10px}
/* schermo grande, con la partitura sopra (lo schermo intero del sistema la nasconderebbe) */
.film.big{position:fixed;inset:0;z-index:60;margin:0;overflow:auto;border:0;max-width:none}
.film.big video{max-height:calc(100vh - 170px);aspect-ratio:auto}
html.filmbig{overflow:hidden}
@media (max-width:640px){.film .fsc{left:0;top:0;width:100%!important}.film .fsc.r{right:0}.film .fsc .sh{flex-wrap:nowrap}.film .fsc .sh button{min-width:30px;height:30px;line-height:30px;padding:0 6px}.film .fsc .sh [data-spos]{display:none}}
.flow p > .ts.go{cursor:pointer}
/* indice delle sezioni del video: un colpo d'occhio su come è organizzato il discorso */
.film .fix{padding:12px 14px 12px;border-top:1px solid var(--nline);font-family:var(--font)}
.film .fix .k{font:700 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.film .fix ol{list-style:none;margin:0;padding:0;columns:2;column-gap:22px}.film .fix li{break-inside:avoid}
.film .fix li button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:9px;width:100%;box-sizing:border-box;padding:8px 6px;border-bottom:1px solid var(--nline);min-height:24px}
.film .fix li button em{font:700 12px var(--font);font-style:normal;color:var(--navy);min-width:20px;height:20px;line-height:20px;text-align:center;background:rgba(27,36,64,.08);flex:none}
.film .fix li button span{flex:1;font:500 14px/1.35 var(--font);color:var(--ink)}
.film .fix li button small{font:600 12px var(--font);color:var(--nmuted);flex:none}
.film .fix li.on button{background:var(--cream)}.film .fix li.on button em{background:var(--wine);color:#fff}.film .fix li.on button span{font-weight:700;color:var(--wine)}
@media (max-width:640px){.film .fix ol{columns:1}}
/* trascrizione: chiusa, si apre solo se serve */
details.trascr{margin:6px 0 10px}
details.trascr>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:14px 16px;border:1px solid var(--navy);background:var(--paper)}
details.trascr>summary::-webkit-details-marker{display:none}
details.trascr>summary span{font:700 15px var(--font);color:var(--navy)}details.trascr>summary span::after{content:' ›';color:var(--gold)}
details.trascr[open]>summary span::after{content:' ⌄'}
details.trascr>summary small{font:500 13px var(--font);color:var(--nmuted)}
details.trascr .tb{padding:4px 2px 10px}
.flow h2.th{font:700 17px/1.3 var(--font)!important;color:var(--navy);border-top:0;border-bottom:1px solid var(--nline);margin:24px 0 6px;padding:0 0 6px}
/* PDF: titoli sobri numerati e un indice iniziale */
.flow h2.ph{scroll-margin-top:70px;font:400 22px/1.25 "Playfair Display",Georgia,serif!important;color:var(--navy);border-top:1px solid var(--gold2);border-bottom:0;margin:34px 0 8px;padding:12px 0 0;align-items:baseline}
.flow h2.ph em{font:700 11px var(--font);font-style:normal;letter-spacing:.12em;color:var(--gold);flex:none}
.ptoc{columns:2;column-gap:22px;margin:10px 0 6px;font-family:var(--font)}
.ptoc button{all:unset;cursor:pointer;break-inside:avoid;box-sizing:border-box;width:100%;display:flex;align-items:baseline;gap:9px;padding:9px 4px;border-bottom:1px solid var(--nline)}
.ptoc button em{font:700 11px var(--font);font-style:normal;color:var(--gold);min-width:16px}

.vp video{width:100%;max-height:70vh;background:#000;display:block}
.vpc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px;background:var(--cream)}.vpc .note{margin:0}
.vc.on{outline:3px solid var(--wine);outline-offset:-3px}.vc.on .pb{background:var(--gold)}
.yt{position:relative;aspect-ratio:16/9;background:#000}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.drop{display:grid!important;place-items:center;text-align:center;gap:4px!important;border:2px dashed var(--gold2);background:var(--paper);padding:26px 14px;cursor:pointer}
.drop input{position:absolute;opacity:0;width:1px;height:1px}.drop b{font:800 17px var(--font);color:var(--wine)}.drop small{font:500 13px var(--font);color:var(--nmuted)}
.two2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ui{border:1px solid var(--nline);border-left:3px solid var(--wine);background:#fff;padding:12px;display:grid;gap:10px}
.af select{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font:16px var(--font)}
.modal{position:fixed;inset:0;z-index:300;background:rgba(15,27,45,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .box{background:var(--cream,#faf6ec);width:100%;max-width:520px;padding:18px;margin:0;max-height:90vh;overflow:auto;border-top:3px solid var(--gold)}
.btn.del{color:#a3352a;border-color:#e2a49c}
.t-nola .af .go{background:var(--wine);box-shadow:none;border-radius:0}
@media(max-width:520px){.af .opts{grid-template-columns:1fr}}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(90% 60% at 100% 0%,#dbe9ff,transparent 60%),radial-gradient(70% 50% at 0% 100%,#ffe3dc,transparent 60%),#fff}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate h1{font:800 54px var(--font);letter-spacing:-.04em;margin:4px 0 0}
#gate form{display:flex;gap:8px;margin-top:22px}
#gate .err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
.foot{padding:30px 0 120px;font:500 12px var(--font);color:var(--muted);text-align:center}
@media (max-width:600px){
 .stats{gap:8px}.stat{padding:12px 10px}.stat b{font-size:22px}.stat b small{font-size:12px}.stat span{display:block;font-size:12px;line-height:1.3;margin-top:4px}.stat .wk{display:none}
 .prac{display:block;padding:14px}.prac .pt{display:flex;align-items:baseline;gap:10px;font-size:34px;margin-bottom:10px}.prac .pt small{display:inline}
 .prac .pb{display:grid!important;grid-template-columns:1fr 1fr;gap:8px}.prac .pb button{width:100%;padding:12px 6px;font-size:14px;white-space:nowrap}.prac .pb button:last-child:nth-child(even){grid-column:1/-1}.prac .pb .pbig{grid-column:1/-1;padding:14px}
 #app{padding-bottom:96px}}
.lessons li.lsec{display:block;cursor:default;background:none;border:0;box-shadow:none;padding:18px 4px 6px;font:800 13px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.lessons li.lsec:first-child{padding-top:4px}
</style>
</head>

<script>
"use strict";
/* ================= data (filled after decrypt) ================= */
let DATA={courses:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('scuola-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('scuola-'+k,JSON.stringify(v))}catch(e){}}};

/* ================= crypto gate ================= */
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function kdf(pw,salt){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt'])}
const keyCache={};
async function decBytes(raw,pw){const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),h=salt.join(',');const key=await (keyCache[h]=keyCache[h]||kdf(pw,salt));
 return {pt:new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)),key}}
let PW=null;
async function unlock(pw,silent){
 const enc=$('#enc').textContent.trim();
 if(!enc||enc==='__ENC__'){DATA=window.DEMO_DATA||DATA;return boot()}
 try{const {pt}=await decBytes(b2u(enc),pw);DATA=JSON.parse(new TextDecoder().decode(pt));PW=pw;LS.set('pw',pw);boot()}
 catch(e){if(!silent)$('#ge').textContent='Password non corretta.';LS.set('pw',null)}}
/* encrypted media: fetch .enc, decrypt with same password, make blob URL */
const blobCache={};
function mediaURL(src,type){
 if(!/\.enc$/.test(src))return Promise.resolve(src);
 return blobCache[src]=blobCache[src]||(async()=>{const r=await fetch(src);const raw=new Uint8Array(await r.arrayBuffer());
  const {pt}=await decBytes(raw,PW);return URL.createObjectURL(new Blob([pt],{type}))})().catch(e=>{delete blobCache[src];throw e})}
/* background prefetch: clips of the open lesson load one after another, so a tap plays at once */
let pfToken=0;
async function prefetch(list){const tok=++pfToken;for(const [src,type] of list){if(tok!==pfToken)return;try{await mediaURL(src,type)}catch(e){}}}
$('#gf').addEventListener('submit',e=>{e.preventDefault();unlock($('#gp').value)});

/* ================= router ================= */
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go==='home'?'':g.dataset.go)}});
const MG=new Set('EFHJLNOQSTWZ');
function nolaText(s){let out='',st=true;for(const ch of s.toUpperCase()){out+=(st&&MG.has(ch))?ch.toLowerCase():ch;st=!/\p{L}/u.test(ch)}return out}
let NOLA=false;
function applyNola(root){root.querySelectorAll('.t-nola .nt, .course.nola .nt').forEach(e=>{if(!e.dataset.o)e.dataset.o=e.textContent;e.textContent=NOLA?nolaText(e.dataset.o):e.dataset.o})}
if(document.fonts){document.fonts.load('20px NolaMardiGras').then(f=>{NOLA=f.length>0&&document.fonts.check('20px NolaMardiGras');document.body.classList.toggle('nola-on',NOLA);applyNola(document)}).catch(()=>{})}
new MutationObserver(()=>applyNola(document)).observe(document.getElementById('app'),{childList:true});
function boot(){$('#gate').remove();
 try{const app=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  if(app&&!location.hash&&!sessionStorage.getItem('aperta')){const c=nolaCourse();if(c)history.replaceState(null,'','#'+c.id)}sessionStorage.setItem('aperta','1')}catch(e){}
 render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}progBoot().finally(()=>syncProg().catch(()=>{}))}
function progress(){return LS.get('done',{})}
/* lezioni fatte: ora si salva il momento (conta nei giorni di fila); le vecchie spunte senza data valgono da oggi */
(()=>{const p=LS.get('done',{});let ch=false;for(const k in p)if(p[k]===true){p[k]=Date.now();ch=true}if(ch)LS.set('done',p)})();
function render(){
 ascStop();
 LESSON=null;if(location.hash==='#diario')return renderDiario();
 const h=location.hash.slice(1),am=h.match(/^(.+?)-ascolti(?:-([a-z0-9]+)(?:-(modifica|carica|v_[a-z0-9_]+))?)?$/);
 if(am){const ac_=DATA.courses.find(x=>x.id===am[1]);if(ac_)return renderAscolti(ac_,am[2],am[3])}
 const [cid,lid]=h.split('-l');const c=DATA.courses.find(x=>x.id===cid);
 if(c&&lid)return renderLesson(c,c.lessons.find(l=>String(l.n)===lid));
 if(c)return renderCourse(c);
 renderHome()}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
/* attività: sessioni salvate (questo dispositivo + diario sincronizzato), minuti registrati in automatico, lezioni segnate come fatte */
function sessions(){const loc=LS.get('log',[]),ids=new Set(loc.map(e=>e.id).filter(Boolean));
 return loc.concat(((DIARIO&&DIARIO.voci)||[]).filter(v=>!ids.has(v.id)))}
/* i minuti contano SOLO dalle sessioni salvate (timer o metronomo): niente più conteggio automatico di video, brani, tastiera */
function autoMs(){return {}}
function activeDays(){const days=new Set(sessions().filter(e=>e.ms>0).map(e=>dayKey(e.at)));
 Object.entries(autoMs()).forEach(([k,ms])=>{if(ms>=60000)days.add(k)});
 Object.values(progress()).forEach(v=>{if(typeof v==='number')days.add(dayKey(v))});return days}
function streakDays(){const days=activeDays();let n=0,d=new Date();if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekMin(){const w0=weekStart();let ms=sessions().filter(e=>e.at>=w0).reduce((a,e)=>a+(e.ms||0),0);
 Object.entries(autoMs()).forEach(([k,v])=>{const [y,m,d]=k.split('-').map(Number);if(new Date(y,m-1,d).getTime()>=w0)ms+=v});return Math.round(ms/60000)}
function todayMin(){const k=dayKey(Date.now());return Math.round((sessions().filter(e=>dayKey(e.at)===k).reduce((a,e)=>a+(e.ms||0),0)+(autoMs()[k]||0))/60000)}
function updStreak(){const s=streakDays(),el=$('#streak');el.hidden=!s;el.textContent='🔥 '+s+(s===1?' giorno':' giorni')}
function theme(n){$('#app').className=n||''}
function nextLesson(c){const done=progress();return c.lessons.find(l=>!done[c.id+'-'+l.n])}
function renderHome(){
 pfToken++;theme('');$('#crumb').textContent='';updStreak();
 const done=progress(),goal=LS.get('goal',150),wm=weekMin(),tot=DATA.courses.reduce((a,c)=>a+c.lessons.filter(l=>done[c.id+'-'+l.n]).length,0);
 $('#app').innerHTML=`<div class="wrap"><section class="hero"><div class="eyebrow">Ciao Paolo</div><h1>La tua <em>scuola</em> di musica</h1><p>Videocorsi, esercizi e strumenti per fare pratica ogni giorno.</p></section>
 <div class="stats"><div class="stat goal" id="goalStat"><b>${wm}<small style="font-size:13px;font-weight:600"> / ${goal} min</small></b><span>pratica questa settimana<span class="wk"> · da lunedì</span></span><div class="meter"><i style="width:${Math.min(100,wm/goal*100)}%"></i></div></div>
 <div class="stat"><b>${streakDays()} 🔥</b><span>giorni di fila</span></div><div class="stat"><b>${tot}</b><span>lezioni completate</span></div></div>
 <div class="prac" id="homePrac"></div>
 <div class="sec-t">I miei corsi</div>
 <div class="grid">${DATA.courses.map(c=>{const n=c.lessons.length,d=c.lessons.filter(l=>done[c.id+'-'+l.n]).length,nx=nextLesson(c);
  return`<div class="course ${esc(c.theme||'')}" data-go="${c.id}"><div class="band"><div class="eyebrow">${esc(c.kind||'Videocorso')}</div><h2 class="nt">${esc(c.title)}</h2></div><div class="body"><div class="meta">${esc(c.sub)}</div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><div class="next"><span>${d} / ${n} lezioni</span>${nx?`<b>Continua · Lezione ${nx.n} ›</b>`:'<b>Completato ✓</b>'}</div></div></div>`}).join('')}

/* tempi solidi anche con la Scuola in secondo piano (altra scheda, YouTube, altra app):
   · il «tic» del programmatore viene da un Web Worker, che il browser non rallenta come i timer della pagina;
   · in secondo piano si programmano le note con più anticipo (1,2 s invece di 0,15 s), così i rallentamenti non si sentono;
   · ogni strumento suona su un «bus»: allo stop il bus si spegne e le note già programmate in anticipo non suonano. */
const TICK=(()=>{const fns=new Map(),ivs=new Map();let id=0,w=null,ok=false;
 const run=()=>fns.forEach(f=>{try{f()}catch(e){console.error(e)}});
 const fallback=()=>{if(!w)return;try{w.terminate()}catch(e){}w=null;fns.forEach((f,k)=>ivs.set(k,setInterval(f,25)))};   // worker muto: timer normali
 try{w=new Worker(URL.createObjectURL(new Blob(['let t=null;onmessage=e=>{if(e.data&&!t)t=setInterval(()=>postMessage(0),25);else if(!e.data&&t){clearInterval(t);t=null}}'],{type:'text/javascript'})));
  w.onmessage=()=>{ok=true;run()};w.onerror=fallback}catch(e){w=null}
 return{add(f){const k=++id;fns.set(k,f);
   if(w){if(fns.size===1)w.postMessage(1);if(!ok)setTimeout(()=>{if(!ok)fallback()},300)}else ivs.set(k,setInterval(f,25));return k},
  del(k){if(!fns.has(k))return;fns.delete(k);if(ivs.has(k)){clearInterval(ivs.get(k));ivs.delete(k)}if(w&&!fns.size)w.postMessage(0)}}})();

function cutBus(){if(!BUSN||!AC)return;const b=BUSN;BUSN=null;try{b.gain.cancelScheduledValues(AC.currentTime);b.gain.setValueAtTime(b.gain.value,AC.currentTime);b.gain.linearRampToValueAtTime(0,AC.currentTime+.02)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},200)}

const PSMP={},PNAMES={0:'C',3:'Ds',6:'Fs',9:'A'};let pianoLoading=null;
function sampleFor(m){let best=null;for(const k in PSMP){const d=Math.abs(m-k);if(best==null||d<Math.abs(m-best))best=+k}return best}
function loadPiano(lo,hi){ac();const want=[];for(let m=Math.max(24,lo-3);m<=Math.min(105,hi+3);m++){if(PNAMES[m%12]!=null&&!PSMP[m])want.push(m)}
 return Promise.all(want.map(m=>fetch('piano/'+PNAMES[m%12]+(Math.floor(m/12)-1)+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,ko)=>AC.decodeAudioData(b,ok,ko))).then(buf=>{PSMP[m]=buf}).catch(()=>{})))}
function pianoNote(t,dur,m,v){const k=sampleFor(m);if(k==null)return synthNote(t,dur,m,v);
 const s=AC.createBufferSource(),g=AC.createGain();s.buffer=PSMP[k];s.playbackRate.value=Math.pow(2,(m-k)/12);
 s.connect(g);g.connect(bus());const end=t+Math.max(.12,dur);const lvl=.9*v;
 g.gain.setValueAtTime(lvl,t);g.gain.setValueAtTime(lvl,end);g.gain.exponentialRampToValueAtTime(.001,end+.35);
 s.start(t);s.stop(end+.4)}
function synthNote(t,dur,m,v){const f=440*Math.pow(2,(m-69)/12),g=AC.createGain(),o=AC.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(bus());
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25*v,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+Math.max(.2,dur)+.2);o.start(t);o.stop(t+Math.max(.2,dur)+.25)}

/* ================= pratica e diario =================
   · Timer di pratica (D): parte dalla home, dalla barra della lezione o da Strumenti › Diario. Alla fine si salva la sessione.
   · Minuti automatici: mentre suonano metronomo, ritmi, tastiera, lettore dei brani o video della lezione (e il timer è fermo).
   · «＋ Aggiungi a mano»: per la pratica fatta senza timer.
   · Ogni sessione salvata va nel diario sincronizzato su GitHub (cifrato): diario/voci/<id>.json.enc (+ messaggio vocale).
     GitHub Actions (tools/diario.py) trascrive i vocali e, con la chiave Anthropic, mette in ordine le note e scrive il
     «diario di viaggio» della settimana: solo riassunti di quello che Paolo ha scritto o detto, mai consigli. */
const D=Object.assign({start:null,acc:0,what:'',lez:null},LS.get('timer',{}));let dInt=null,LESSON=null;
function tNow(){return D.acc+(D.start?Date.now()-D.start:0)}
function hms(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function dStore(){LS.set('timer',D)}
function timerStart(o){if(!D.start){if(!D.acc||!D.sid)D.sid=Date.now();D.start=Date.now();if(o){if(o.what&&!D.what)D.what=o.what;if(o.lez)D.lez=o.lez}}dStore();pracChanged()}
function timerPause(){if(D.start){D.acc=tNow();D.start=null}dStore();pracChanged()}
function timerReset(){D.start=null;D.acc=0;D.what='';D.lez=null;D.tempi=[];D.sid=null;dStore();pracChanged()}
/* col metronomo (o un ritmo) parte anche la pratica, se non è già in corso; si può spegnere dal metronomo */
function autoPrac(){if(D.start||!LS.get('autoPrac',true))return;timerStart({what:lessonWhat(),lez:LESSON&&LESSON.l.n});toast('⏱ Pratica avviata insieme al metronomo')}
/* percorso del tempo durante la sessione: [{s:'♩'|nome ritmo, bpm, sec}] */
function tempiTick(){if(!D.start||!(M.playing||R.playing))return;const k=M.playing?'Metronomo':RHY[R.id].name,b=M.playing?M.bpm:R.bpm;D.tempi=D.tempi||[];
 const l=D.tempi[D.tempi.length-1];if(l&&l.s===k&&l.bpm===b)l.sec++;else D.tempi.push({s:k,bpm:b,sec:1});if(Date.now()%5000<1000)dStore()}
function tempiCompact(t){const o=[];(t||[]).filter(x=>x.sec>=10).forEach(x=>{const l=o[o.length-1];if(l&&l.s===x.s&&l.bpm===x.bpm)l.sec+=x.sec;else o.push(Object.assign({},x))});return o}
function tempiTxt(t){const c=tempiCompact(t);if(!c.length)return'';const by={};c.forEach(x=>(by[x.s]=by[x.s]||[]).push(x));
 return Object.entries(by).map(([k,l])=>`${k}: ${l.map(x=>x.bpm+' bpm'+(x.sec>=60?' ('+Math.round(x.sec/60)+' min)':'')).join(' → ')}`).join(' · ')}
function tempiMax(t){return Math.max(0,...tempiCompact(t).map(x=>x.bpm))||null}
/* tempo raggiunto in QUESTA sessione: il più alto tenuto almeno 20 s in tutto (prima il metronomo, poi i ritmi); se nessuno, quello a cui ti sei fermato */
function tempiReached(t){t=t||[];for(const met of [true,false]){const l=t.filter(x=>(x.s==='Metronomo')===met);if(!l.length)continue;const tot={};l.forEach(x=>tot[x.bpm]=(tot[x.bpm]||0)+x.sec);
 const ok=Object.keys(tot).filter(b=>tot[b]>=20).map(Number);return ok.length?Math.max(...ok):l[l.length-1].bpm}return null}
function timerFinish(){timerPause();dStore();const tp=tempiCompact(D.tempi);sessionModal({ms:tNow(),what:D.what||lessonWhat()||(tp.length?[...new Set(tp.map(x=>x.s))].join(' + '):''),lez:D.lez||(LESSON&&LESSON.l.n),tempi:tp,raw:D.tempi||[],fromTimer:true})}

 const hp=$('#homePrac');if(hp){hp.innerHTML=`<div class="pt"><span data-tnow>${hms(tNow())}</span><small>${run?'pratica in corso':has?'in pausa':`oggi: ${todayMin()} min`}</small></div>

 const lp=$('#lesPrac');if(lp&&LESSON){const mine=D.lez===LESSON.l.n||!D.what;lp.innerHTML=`<b>${run?`⏱ <span data-tnow>${hms(tNow())}</span> · pratica in corso${D.what&&!mine?' ('+esc(D.what)+')':''}`:has?`⏱ <span data-tnow>${hms(tNow())}</span> · pratica in pausa`:'Fai pratica mentre segui la lezione: il tempo va nel diario'}</b>
  ${run?`<button class="on" data-pr="pause">❚❚ Pausa</button><button class="sec" data-pr="fine">■ Fine e salva</button>`:`<button data-pr="startL">▶ ${has?'Riprendi':'Avvia la pratica'}</button>${has?'<button class="sec" data-pr="fine">■ Fine e salva</button>':''}`}<button class="sec" data-pr="met">${M.playing?'■ Metronomo':'♩ Metronomo'}</button>`}
 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const k=b.dataset.pr;
  if(k==='start')timerStart();else if(k==='startL')timerStart({what:lessonWhat(),lez:LESSON&&LESSON.l.n});else if(k==='pause')timerPause();else if(k==='fine')timerFinish();else if(k==='met'){if(M.playing)stopMetro();else{openTools('metro',true);startMetro()}drawPrac()}else if(k==='add')sessionModal({ms:0,what:lessonWhat(),lez:LESSON&&LESSON.l.n,manual:true})})}

async function rawGet(path,bin){const t=ghTok();
 if(t&&navigator.onLine!==false){try{const r=await fetch(GHR+'/contents/'+path+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github.raw+json'}});if(r.status===404)return null;if(r.ok)return bin?new Uint8Array(await r.arrayBuffer()):await r.json()}catch(e){}}
 try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return bin?new Uint8Array(await r.arrayBuffer()):await r.json()}catch(e){return null}}
async function decJSON(u8){const {pt}=await decBytes(u8,PW);return JSON.parse(new TextDecoder().decode(pt))}
const encJSON=o=>encBytes(new TextEncoder().encode(JSON.stringify(o)));
function settimanaDi(at){const d=new Date(at);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);
 return d.getFullYear()+'-W'+String(1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)).padStart(2,'0')}
function loadDiario(force){if(force)diarioLoading=null;return diarioLoading=diarioLoading||(async()=>{
 const cache=LS.get('diario-cache',{voci:[],elab:{},sett:{}});const idx=await rawGet('diario/indice.json');
 if(!idx){DIARIO=cache.voci.length?Object.assign({giorni:{},compiti:[]},cache):{voci:[],elab:{},sett:{},giorni:{},compiti:[]};return DIARIO}
 const old=Object.fromEntries(cache.voci.map(v=>[v.id,v]));const voci=[];
 await Promise.all(idx.voci.map(async x=>{let v=old[x.id];if(!v||force){const u=await rawGet('diario/voci/'+x.id+'.json.enc',true);if(u){try{v=Object.assign(await decJSON(u),{id:x.id})}catch(e){}}}if(v)voci.push(v)}));
 voci.sort((a,b)=>b.at-a.at);const elab=Object.assign({},cache.elab),sett=Object.assign({},cache.sett);
 await Promise.all(voci.slice(0,40).map(async v=>{const e=elab[v.id];if(e&&e.ordinato&&(e.trascr||!v.audio))return;const u=await rawGet('diario/elab/'+v.id+'.json.enc',true);if(u){try{elab[v.id]=await decJSON(u)}catch(e){}}}));
 const ws=[...new Set(voci.map(v=>settimanaDi(v.at)))].slice(0,8);
 await Promise.all(ws.map(async w=>{const u=await rawGet('diario/settimane/'+w+'.json.enc',true);if(u){try{sett[w]=await decJSON(u)}catch(e){}}}));
 const giorni={},vecchi=cache.giorni||{};   // sempre dal repository: le giornate possono essere unite o corrette
 await Promise.all((idx.giorni||[]).slice(-60).map(async d=>{const u=await rawGet('diario/giorni/'+d+'.json.enc',true);if(u){try{giorni[d]=Object.assign(await decJSON(u),{d})}catch(e){if(vecchi[d])giorni[d]=vecchi[d]}}else if(vecchi[d])giorni[d]=vecchi[d]}));
 let compiti=cache.compiti||[];{const u=await rawGet('diario/compiti.json.enc',true);if(u){try{compiti=(await decJSON(u)).lista||[]}catch(e){}}}
 DIARIO={voci,elab,sett,giorni,compiti};LS.set('diario-cache',DIARIO);return DIARIO})().catch(e=>{diarioLoading=null;throw e})}
async function ghCommitDiario(tok,files,addIdx,msg,say,dels){const tree0=[];
 for(const f of files){say('Invio '+f.label+'…');const b=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:u2b(f.u8),encoding:'base64'})},tok);tree0.push({path:f.path,mode:'100644',type:'blob',sha:b.sha})}
 for(let i=0;i<4;i++){say('Salvo nel diario…');const head=(await gh('/git/ref/heads/main',{},tok)).object.sha,com=await gh('/git/commits/'+head,{},tok);
  let idx={voci:[]};const r=await fetch(GHR+'/contents/diario/indice.json?ref='+head,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw+json'}});if(r.ok)idx=await r.json();
  idx.voci=idx.voci||[];addIdx(idx);
  const cb=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:JSON.stringify(idx,null,1)+'\n',encoding:'utf-8'})},tok);
  let tree=tree0.concat([{path:'diario/indice.json',mode:'100644',type:'blob',sha:cb.sha}]);
  if(dels&&dels.length){const all=await gh('/git/trees/'+com.tree.sha+'?recursive=1',{},tok);const have=new Set(all.tree.map(t=>t.path));tree=tree.concat(dels.filter(p=>have.has(p)).map(p=>({path:p,mode:'100644',type:'blob',sha:null})))}
  const tr=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:com.tree.sha,tree})},tok);
  const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:msg,tree:tr.sha,parents:[head]})},tok);
  try{await gh('/git/refs/heads/main',{method:'PATCH',body:JSON.stringify({sha:nc.sha})},tok);return idx}catch(e){if(e.status!==422)throw e}}
 throw new Error('Il repository è stato aggiornato nello stesso momento: riprova.')}

const PROG='progresso/stato.json.enc';let progBusy=null,progT=0;
function devId(){let d=LS.get('dev',null);if(!d){d=Math.random().toString(36).slice(2,10);LS.set('dev',d)}return d}
function idb(){return new Promise((ok,ko)=>{try{const r=indexedDB.open('scuola',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}})}
async function idbSet(k,v){try{const db=await idb();await new Promise(ok=>{const t=db.transaction('kv','readwrite',{durability:'strict'});t.objectStore('kv').put(v,k);t.oncomplete=t.onerror=t.onabort=ok})}catch(e){}}
async function idbGet(k){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})}catch(e){}}
function mergeProg(A,Ad,B,Bd){const all={},dl={};[A,B].forEach(x=>{for(const k in x||{})all[k]=Math.max(all[k]||0,x[k]||1)});[Ad,Bd].forEach(x=>{for(const k in x||{})dl[k]=Math.max(dl[k]||0,x[k])});
 const done={},del={};for(const k in all)if(!(dl[k]>=all[k]))done[k]=all[k];for(const k in dl)if(dl[k]>=(all[k]||0))del[k]=dl[k];return {done,del}}
function saveProg(done,del){LS.set('done',done);LS.set('done-del',del);idbSet('prog',{done,del})}
/* all'avvio: riprende le spunte anche se la memoria rapida dell'app le ha perse */
async function progBoot(){const x=await idbGet('prog');if(x){const L=LS.get('done',{}),m=mergeProg(L,LS.get('done-del',{}),x.done,x.del);if(JSON.stringify(m.done)!==JSON.stringify(L)){saveProg(m.done,m.del);try{updStreak()}catch(e){}progRender()}else idbSet('prog',m)}else saveProg(LS.get('done',{}),LS.get('done-del',{}))}

  toast(st==='ok'||st==='same'?'✓ Salvata: la ritrovi anche su iPad e iPhone':st==='nokey'?'Salvata solo su questo dispositivo: collega la chiave GitHub nel Diario per ritrovarla ovunque':'Salvata sul dispositivo; la invio a GitHub appena c\'è connessione')}).catch(()=>{})}
function progShow(){const el=$('#progStat');if(!el)return;const t=ghTok(),at=LS.get('prog-ok',0);
 el.innerHTML=!t?'Le lezioni fatte restano solo su questo dispositivo. <a href="#diario">Collega la chiave GitHub</a> per ritrovarle su iPad e iPhone.':at?'✓ Lezioni fatte sincronizzate su tutti i dispositivi · '+new Date(at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'Sincronizzo le lezioni fatte…'}
function progRender(){if(!location.hash||DATA.courses.some(c=>'#'+c.id===location.hash)){const y=scrollY;render();scrollTo(0,y)}}
let progGet=0;function syncProg(push){if(progBusy)return push?progBusy.then(()=>syncProg(true)):progBusy;if(!push&&Date.now()-progGet<20000)return Promise.resolve('same');progGet=Date.now();return progBusy=(async()=>{const t=ghTok();if(!t)return 'nokey';if(navigator.onLine===false)return 'offline';
 for(let i=0;i<4;i++){
  let R={done:{},del:{},auto:{}},sha=null;
  const r=await fetch(GHR+'/contents/'+PROG+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
  if(r.ok){const j=await r.json();sha=j.sha;try{R=Object.assign(R,await decJSON(Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0))))}catch(e){return 'err'}}
  else if(r.status!==404)return 'err';
  const before=JSON.stringify(R),L=LS.get('done',{}),D=LS.get('done-del',{});
  for(const k in L)R.done[k]=Math.max(R.done[k]||0,L[k]||1);
  for(const k in D)R.del[k]=Math.max(R.del[k]||0,D[k]);
  const me=devId(),la={},old=R.auto[me]||{};R.auto={};
  const done={},del={};for(const k in R.done)if(!(R.del[k]>=R.done[k]))done[k]=R.done[k];for(const k in R.del)if(R.del[k]>=(R.done[k]||0))del[k]=R.del[k];
  const altri={};for(const d in R.auto)if(d!==me)for(const k in R.auto[d])altri[k]=(altri[k]||0)+R.auto[d][k];
  const ch=JSON.stringify(done)!==JSON.stringify(L)||JSON.stringify(altri)!==JSON.stringify(LS.get('auto-altri',{}));
  saveProg(done,del);LS.set('auto-altri',altri);if(ch){try{updStreak()}catch(e){}progRender()}
  const doneCh=JSON.stringify(R.done)!==JSON.stringify(JSON.parse(before).done)||JSON.stringify(R.del)!==JSON.stringify(JSON.parse(before).del);
  const autoCh=Object.keys(old).length>0||Object.keys(JSON.parse(before).auto||{}).length>0;  // una volta sola: cancella i vecchi minuti automatici dal repository
  if(!doneCh&&!(autoCh&&(push||Date.now()-LS.get('prog-at',0)>20*60e3))){LS.set('prog-ok',Date.now());progShow();return 'same'}

  const w=await fetch(GHR+'/contents/'+PROG,{method:'PUT',keepalive:true,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(w.ok){LS.set('prog-at',Date.now());LS.set('prog-ok',Date.now());progShow();return 'ok'}if(w.status!==409&&w.status!==422)return 'err'}return 'err'
 })().finally(()=>{progBusy=null})}

 if(aperte.length||nonApp.length>1){const l=aperte.concat(nonApp.length>1?Dg.voci.filter(v=>nonApp.some(g=>(g.voci||[]).includes(v.id))):[]),voc=l.filter(v=>v.audio).length,min=Math.round(l.reduce((a,v)=>a+(v.ms||0),0)/60000);
  h+=`<div class="gcard"><h3>Hai finito di esercitarti?</h3>${aperte.length?`Sessioni da chiudere: ${l.length}, ${min} min${voc?`, ${voc} ${voc===1?'vocale':'vocali'}`:''}. `:''}${nonApp.length>1?'Ci sono '+nonApp.length+' giornate divise a mezzanotte: le unisco in una sola. ':''}La giornata comprende tutte le sessioni non ancora chiuse, anche dopo mezzanotte. Faccio il riassunto solo con quello che hai detto e scritto tu, e aggiungo ai compiti le cose che hai detto di voler esercitare; i vocali si cancellano solo dopo che approvi.
  <div class="row"><button class="btn gold" id="gClose">🌙 Chiudi la giornata</button></div></div>`}
 const open=(Dg.compiti||[]).filter(c=>!c.fatto),done=(Dg.compiti||[]).filter(c=>c.fatto);
 h+=`<div class="gcard"><h3>📝 Compiti per il futuro</h3>${open.map(c=>`<label class="ctask"><input type="checkbox" data-ct="${c.id}"><span>${esc(c.t)}<small>dal ${dTxt(c.d)}</small></span><button class="x" type="button" data-cdel="${c.id}" aria-label="Elimina">✕</button></label>`).join('')||'<p class="small muted" style="margin:4px 0">Nessun compito aperto.</p>'}
  ${done.length?`<details><summary class="small muted">Fatti (${done.length})</summary>${done.map(c=>`<label class="ctask done"><input type="checkbox" checked data-ct="${c.id}"><span>${esc(c.t)}<small>dal ${dTxt(c.d)}</small></span><button class="x" type="button" data-cdel="${c.id}" aria-label="Elimina">✕</button></label>`).join('')}</details>`:''}
  <div class="cmp" style="display:flex;gap:8px;margin-top:8px"><input type="text" id="cNew" placeholder="Aggiungi un compito" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:500 15px var(--font)"><button class="btn sm" id="cAdd">＋</button></div></div>`;
 return h}
function gBind(){const A=$('#app');
 const c=A.querySelector('#gClose');if(c)c.onclick=()=>chiudiGiornata(c);
 A.querySelectorAll('[data-grel]').forEach(b=>b.onclick=async()=>{b.textContent='…';await loadDiario(true).catch(()=>{});renderDiario()});
 A.querySelectorAll('[data-gredo]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await gRifai(b.dataset.gredo)}catch(e){toast(e.message)}renderDiario()});
 A.querySelectorAll('[data-gd]').forEach(card=>{const d=card.dataset.gd,cl=card.querySelector('[data-gcl]');
  const bindX=()=>cl.querySelectorAll('[data-gcx]').forEach(x=>x.onclick=()=>x.parentNode.remove());bindX();
  card.querySelector('[data-gca]').onclick=()=>{const n=cl.querySelector('[data-gnone]');if(n)n.remove();cl.insertAdjacentHTML('beforeend','<div class="cmp"><input type="text" placeholder="Cosa vuoi esercitare"><button class="x" type="button" data-gcx aria-label="Togli">✕</button></div>');bindX();cl.lastElementChild.querySelector('input').focus()};
  card.querySelector('[data-gok]').onclick=async e=>{const b=e.target;if(!confirm(card.querySelector('[data-gn]').value.trim()?'Approvi il riassunto con le tue aggiunte? I vocali di questa giornata verranno cancellati.':'Approvi il riassunto? I vocali di questa giornata verranno cancellati.'))return;b.disabled=true;b.textContent='Salvo…';
   const agg=card.querySelector('[data-gn]').value.trim(),rs=card.querySelector('[data-gr]').value.trim();
   try{await gApprova(d,agg?(rs?rs+'\n\n':'')+'Aggiunte: '+agg:rs,[...cl.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean))}catch(err){toast(ghErr?ghErr(err):err.message)}renderDiario()};
  const gn=card.querySelector('[data-gn]'),gok=card.querySelector('[data-gok]');gn.oninput=()=>{gok.textContent=gn.value.trim()?'✓ Approva con le aggiunte':'✓ Approva e cancella i vocali'}});
 A.querySelectorAll('[data-ct]').forEach(i=>i.onchange=()=>{const l=(DIARIO.compiti||[]).map(c=>c.id===i.dataset.ct?Object.assign({},c,{fatto:i.checked,fattoIl:i.checked?Date.now():undefined}):c);cSalva(l,'Diario: compito '+(i.checked?'fatto':'riaperto'));setTimeout(renderDiario,300)});
 A.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=e=>{e.preventDefault();if(!confirm('Eliminare questo compito?'))return;cSalva((DIARIO.compiti||[]).filter(c=>c.id!==b.dataset.cdel),'Diario: compito eliminato');renderDiario()});
 const cn=A.querySelector('#cNew'),ca=A.querySelector('#cAdd');if(ca){const add=()=>{const t=cn.value.trim();if(!t)return;cSalva((DIARIO.compiti||[]).concat([{id:'c'+Date.now().toString(36),t,d:ymd(Date.now()),fatto:false}]),'Diario: nuovo compito');renderDiario()};ca.onclick=add;cn.onkeydown=e=>{if(e.key==='Enter')add()}}}

/* ---- pagina Diario ---- */
async function renderDiario(){theme('');$('#crumb').textContent='Diario di pratica';updStreak();
 const draw=()=>{const Dg=DIARIO||{voci:[],elab:{},sett:{}},loc=LS.get('log',[]),ids=new Set(Dg.voci.map(v=>v.id));
  const all=Dg.voci.concat(loc.filter(e=>!e.id||!ids.has(e.id)).map(e=>Object.assign({local:true},e))).sort((a,b)=>b.at-a.at);
  const weeks={};all.forEach(v=>{(weeks[settimanaDi(v.at)]=weeks[settimanaDi(v.at)]||[]).push(v)});
  const auto=autoMs(),pending=LS.get('dqueue',[]).length;
  const wtxt=w=>{const l=weeks[w],d0=new Date(Math.min(...l.map(v=>v.at)));const mon=new Date(d0);mon.setDate(d0.getDate()-((d0.getDay()+6)%7));const sun=new Date(mon);sun.setDate(mon.getDate()+6);
   return`${mon.toLocaleDateString('it-IT',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}`};
  const mech=l=>{const by={},mx={};l.forEach(v=>{const k=v.what||'Pratica';by[k]=(by[k]||0)+(v.ms||0);const b=v.bpm||tempiMax(v.tempi);if(b)mx[k]=Math.max(mx[k]||0,b)});
   return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,ms])=>`– ${k}: ${Math.round(ms/60000)} min${mx[k]?' · fino a '+mx[k]+' bpm':''}`).join('\n')};
  $('#app').innerHTML=`<section class="chero"><div class="wrap"><div class="eyebrow">Scuola</div><h1>Diario di pratica</h1><p>Le tue sessioni, le note e i messaggi vocali, settimana per settimana</p></div></section><div class="wrap">
  <div class="stats"><div class="stat"><b>${weekMin()}<small style="font-size:13px;font-weight:600"> min</small></b><span>questa settimana</span></div><div class="stat"><b>${streakDays()} 🔥</b><span>giorni di fila</span></div><div class="stat"><b>${todayMin()}<small style="font-size:13px;font-weight:600"> min</small></b><span>oggi</span></div></div>
  <div class="prac" id="homePrac"></div>
  ${gHTML()}
  ${pending||!ghTok()?`<div class="note">${pending?`<b>${pending} ${pending===1?'sessione salvata':'sessioni salvate'} solo su questo dispositivo.</b> `:''}${ghTok()?'':'Questo dispositivo non è ancora collegato a GitHub. '}<button class="btn sm" id="dSync" style="margin-top:8px">🔑 ${ghTok()?'Sincronizza adesso':'Collega GitHub e sincronizza'}</button></div>`:''}
  ${Object.keys(weeks).sort().reverse().map(w=>{const l=weeks[w],tot=Math.round(l.reduce((a,v)=>a+(v.ms||0),0)/60000),rc=Dg.sett[w];
   return`<div class="dweek">Settimana ${wtxt(w)}<small>${tot} min · ${l.length} ${l.length===1?'sessione':'sessioni'}</small></div>
   <div class="drecap"><div class="lbl">${rc?'Diario di viaggio della settimana':'Riepilogo'}</div>${esc(rc?rc.testo:mech(l))}</div>
   ${Object.values(Dg.giorni||{}).filter(g=>g.stato==='approvata'&&settimanaDi(new Date(g.d+'T12:00').getTime())===w).sort((a,b)=>a.d<b.d?1:-1).map(g=>`<div class="dent gday"><div class="dh"><b>🌙 Giornata chiusa</b><span>${dTxt(g.d)}</span></div><div class="dx">${esc(g.riassunto||'')}</div>${(g.compiti||[]).length?`<div class="dw">📝 Compiti aggiunti: ${g.compiti.map(esc).join(' · ')}</div>`:''}</div>`).join('')}
   ${l.map(v=>{const e=Dg.elab[v.id]||{};if(v.giorno)return`<div class="dent"><div class="dh"><b>${esc(v.what||'Pratica')}</b><span>${new Date(v.at).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} · ${Math.round((v.ms||0)/60000)} min${v.bpm?' · '+v.bpm+' bpm':''}</span></div>${v.tempi&&v.tempi.length?`<div class="dw">♩ ${esc(tempiTxt(v.tempi))}</div>`:''}${v.note?`<details class="dt"><summary>Le tue note</summary>${esc(v.note)}</details>`:''}</div>`;return`<div class="dent"><div class="dh"><b>${esc(v.what||'Pratica')}</b><span>${new Date(v.at).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} · ${Math.round((v.ms||0)/60000)} min${v.bpm?' · '+v.bpm+' bpm':''}${v.local?' · solo su questo dispositivo':''}</span></div>${v.tempi&&v.tempi.length?`<div class="dw">♩ ${esc(tempiTxt(v.tempi))}</div>`:''}
    ${e.ordinato?`<div class="dx">${esc(e.ordinato)}</div>`:v.note?`<div class="dx">${esc(v.note)}</div>`:''}
    ${v.audio?(e.trascr?`<details class="dt"><summary>🎙 Messaggio vocale · trascrizione</summary>${esc(e.trascr)}</details>`:e.err?`<div class="dw">⚠️ ${esc(e.err)}</div>`:'<div class="dw">🎙 Messaggio vocale: trascrizione in arrivo (qualche minuto)</div>'):''}
    ${e.ordinato&&v.note?`<details class="dt"><summary>Le tue note originali</summary>${esc(v.note)}</details>`:''}</div>`}).join('')}`}).join('')||'<div class="empty">Ancora nessuna sessione. Avvia la pratica qui sopra, oppure aggiungi a mano quella che hai già fatto oggi.</div>'}

  <div class="row"><button class="btn sm" id="dRel">↻ Aggiorna</button><button class="btn sm" data-go="home">‹ Home</button></div><div class="foot"></div></div>`;
  drawPrac();gBind();if($('#dSync'))$('#dSync').onclick=syncModal;$('#dRel').onclick=async()=>{$('#dRel').textContent='…';await loadDiario(true).catch(()=>{});if(location.hash==='#diario')draw()}};
 draw();window.scrollTo(0,0);try{await loadDiario();if(location.hash==='#diario')draw();gPoll()}catch(e){}}

/* ================= tools sheet ================= */
/* pannello flottante: grande per regolare, ridotto (▁) a una finestrella in basso a destra; ✕ o trascina giù per chiudere.
   Non copre il sito: si continua a leggere la lezione e a navigare. */
let curTab=null,miniOn=false,miniInt=null;
function openTools(t,mini){try{loadDrums()}catch(e){}curTab=t||curTab||'metro';lastTab=curTab;$('#sheet').classList.add('show');document.body.classList.add('p-tools');showTab();setMini(!!mini);live()}
function closeTools(){$('#sheet').classList.remove('show');document.body.classList.remove('p-tools');if(curTab)lastTab=curTab;curTab=null;setMini(false);live()}
function setMini(on){miniOn=on;$('#sheet').classList.toggle('mini',on);document.body.classList.toggle('p-mini',on);clearInterval(miniInt);if(on){drawMini();if(curTab==='diary')miniInt=setInterval(()=>{const e=$('#miniT');if(e)e.textContent=hms(tNow())},500)}}
function showTab(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));({metro:paneMetro,rhythm:paneRhythm,diary:paneDiary})[curTab]()}
function drawMini(){if(!miniOn||!curTab)return;const m=$('#mini');
 const pm=(bpm)=>`<button class="m5" data-mm="-5" aria-label="Meno 5 bpm">−5</button><button data-mm="-1" aria-label="Meno 1 bpm">−</button><em>${bpm}<small> bpm</small></em><button data-mm="1" aria-label="Più 1 bpm">+</button><button class="m5" data-mm="5" aria-label="Più 5 bpm">+5</button>`;
 /* la finestrella mostra sempre lo strumento che suona (metronomo o ritmo) e, se c'è, il timer di pratica: si usano insieme */
 const rh=curTab==='rhythm'||(curTab==='diary'&&R.playing);
 const t=rh?RHY[R.id].name:`Metronomo · ${M.beats}/4${M.sub===2&&M.swing?' · swing':''}`,play=rh?R.playing:M.playing,ctl=rh?pm(R.bpm):pm(M.bpm)+`<button data-mm="tap">Tap</button>`;
 const showT=curTab==='diary'||tNow()>0;
 m.innerHTML=`<div class="mrow"><span class="mt">${esc(t)}</span><button class="sx" data-mm="max" title="Apri tutto" aria-label="Apri tutto">⤢</button><button class="sx" data-mm="x" title="Chiudi" aria-label="Chiudi">✕</button></div>
 <div class="mrow"><button class="mp ${play?'on':''}" data-mm="play" aria-label="${play?'Stop':'Avvia'}">${play?'■':'▶'}</button><div class="mc">${ctl}</div></div>
 ${showT?`<div class="mrow mtim"><span class="mt">⏱ <span id="miniT">${hms(tNow())}</span> <small>${D.start?'pratica in corso':tNow()>0?'in pausa':'pratica'}</small></span><button data-mm="tplay">${D.start?'❚❚ Pausa':tNow()>0?'▶ Riprendi':'▶ Avvia pratica'}</button>${tNow()>0?'<button data-mm="fine">■ Fine</button>':''}</div>`:''}`;
 requestAnimationFrame(()=>document.body.style.setProperty('--minih',$('#sheet').offsetHeight+'px'))}
$('#mini').addEventListener('click',e=>{const b=e.target.closest('[data-mm]');if(!b)return;const k=b.dataset.mm;
 if(k==='x')return closeTools();if(k==='fine'){timerFinish();return}if(k==='max'){setMini(false);return showTab()}
 if(k==='play'){if(curTab==='rhythm'||(curTab==='diary'&&R.playing))R.playing?stopRhythm():startRhythm();else M.playing?stopMetro():startMetro()}
 else if(k==='tplay'){if(D.start)timerPause();else timerStart({what:lessonWhat(),lez:LESSON&&LESSON.l.n})}
 else if(k==='tap'){const n=performance.now();taps=taps.filter(x=>n-x<2500);taps.push(n);if(taps.length>1){M.bpm=Math.max(30,Math.min(260,Math.round(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))));mSave()}}
 else if(curTab==='rhythm'||(curTab==='diary'&&R.playing)){R.bpm=Math.max(40,Math.min(240,R.bpm+ +k));rSave()}else{M.bpm=Math.max(30,Math.min(260,M.bpm+ +k));mSave()}
 drawMini();live()});
/* trascina giù per chiudere (dall'intestazione o dalla finestrella ridotta) */
function swipeClose(el,close){let y0=null,dy=0;const box=el.closest('.sheet,.lib');
 el.addEventListener('touchstart',e=>{if(e.target.closest('button,input,select'))return;y0=e.touches[0].clientY;dy=0;box.style.transition='none'},{passive:true});
 el.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);box.style.transform=dy?`translateY(${dy}px)`:''},{passive:true});
 el.addEventListener('touchend',()=>{if(y0==null)return;box.style.transition='';box.style.transform='';if(dy>60)close();y0=null})}
swipeClose($('#sHead'),closeTools);swipeClose($('#mini'),closeTools);
let lastTab='metro';
$('#openTools').onclick=()=>openTools(lastTab);
$('#tClose').onclick=closeTools;$('#tMin').onclick=()=>setMini(true);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;lastTab=curTab;showTab()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('.leg,.modal')){if($('#lib').classList.contains('show'))closeLib();else if(curTab)closeTools()}});
function live(){const snd=M.playing||R.playing,on=(snd||D.start)&&!curTab,l=$('#live');l.classList.toggle('show',!!on);$('#liveTxt').textContent=M.playing?M.bpm+' bpm · Stop':R.playing?RHY[R.id].name.split(' ')[0]+' '+R.bpm+' · Stop':D.start?'⏱ '+hms(tNow()):'';drawMini()}
$('#live').onclick=()=>{if(M.playing||R.playing){stopMetro();stopRhythm()}else if(D.start)openTools('diary',true)};
$('#live').oncontextmenu=e=>{e.preventDefault();openTools(M.playing?'metro':'rhythm',true)};

/* start */
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font:600 14px/1.3 system-ui,sans-serif;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
/* app offline (PWA) */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
 const ask=()=>navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage('status');
 navigator.serviceWorker.addEventListener('message',e=>{const s=e.data&&e.data.offline;if(s&&s.ok===s.total&&!LS.get('offok-'+s.total,false)){LS.set('offok-'+s.total,true);toast('✓ La Scuola ora funziona anche offline')}});
 navigator.serviceWorker.addEventListener('controllerchange',ask);setTimeout(ask,4000);setTimeout(ask,30000)}
const saved=LS.get('pw',null);
if($('#enc').textContent.trim()==='__ENC__')unlock('');else if(saved)unlock(saved,true);
