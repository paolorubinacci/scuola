<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b2440">
<title>Scuola · Paolo Rubinacci</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Tinos:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"NolaMardiGras";src:url("fonts/NolaMardiGras.woff2") format("woff2"),url("fonts/NolaMardiGras.ttf") format("truetype");font-display:swap}
:root{--paper:#fffdf8;--cream:#faf6ec;--cream2:#f3ead6;--ink:#24211c;--muted:#7c7466;--line:#e6dcc6;--navy:#1b2440;--gold:#b8893a;--gold2:#d9b36a;--wine:#6b2737;--green:#2f7a5b;--red:#a8382c;
--disp:"NolaMardiGras","Rye",Georgia,serif;--serif:"Tinos","Liberation Serif","Times New Roman",serif;--play:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;
--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--wine)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:10px 16px;font:600 14px var(--sans);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--cream);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:700 16px var(--sans)}
.muted{color:var(--muted)}.small{font-size:14px}
.eyebrow{font:700 11px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
body:not(.nola-on) .nt{text-transform:uppercase}
.nola{font-family:var(--disp);font-weight:400;letter-spacing:.02em}
/* top */
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);padding-top:var(--safe-t);border-bottom:3px solid var(--gold)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:54px}
.brand{font-family:var(--disp);font-size:22px;cursor:pointer;color:var(--cream)}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 13px var(--sans);color:rgba(250,246,236,.7)}
/* hero */
.hero{padding:40px 0 14px}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(36px,9vw,58px);line-height:1.05;margin:6px 0 10px;color:var(--navy)}
.hero p{color:var(--muted);margin:0;font-style:italic}
.grid{display:grid;gap:14px;margin:24px 0 40px}
.course{position:relative;overflow:hidden;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--cream)}
.course .band{background:var(--navy);color:var(--cream);padding:20px 20px 16px;border-bottom:3px solid var(--gold)}
.course .band h2{font-family:var(--disp);font-weight:400;font-size:32px;line-height:1.1;margin:6px 0 2px}
.course .band .eyebrow{color:var(--gold2)}
.course .body{padding:14px 20px 18px}
.course .meta{font-size:15px;color:var(--muted);font-style:italic}
.course .bar{height:5px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}
.course .bar i{display:block;height:100%;background:var(--gold)}
.course.soon{cursor:default;background:transparent;border-style:dashed;padding:18px 20px}
.course.soon h2{font-family:var(--play);font-size:22px;color:var(--muted);margin:6px 0 2px}
/* lesson list */
.lessons{list-style:none;margin:20px 0 40px;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.lessons li{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer}
.lessons .num{font-family:var(--disp);font-size:28px;color:var(--gold);width:34px;text-align:center}
.lessons .t{font:700 18px/1.3 var(--play);color:var(--navy)}.lessons .d{font:500 12px var(--sans);color:var(--muted)}
.lessons .chk{margin-left:auto;font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.lessons .chk.done{color:var(--green)}
/* lesson */
.lhead{background:var(--navy);color:var(--cream);border-bottom:3px solid var(--gold);margin:0 -18px;padding:28px 18px 22px}
.lhead h1{font-family:var(--disp);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.1;margin:6px 0 4px;color:var(--cream)}
.lhead .eyebrow{color:var(--gold2)}
.lhead p{margin:0;font-family:var(--play);font-style:italic;color:rgba(250,246,236,.8)}
.brief{background:var(--cream);border:1px solid var(--line);border-left:3px solid var(--gold);padding:16px 18px 6px;margin:22px 0 26px}
.brief h3{font-family:var(--disp);font-weight:400;color:var(--navy);margin:0 0 8px;font-size:21px}
.flow h2{font-family:var(--disp);font-weight:400;font-size:24px;color:var(--navy);margin:34px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.flow p{margin:0 0 14px}
.ts{display:inline-block;white-space:nowrap;font:700 11px/1 var(--sans);color:var(--gold);border:1px solid var(--gold2);border-radius:3px;padding:3px 5px;margin-right:7px;vertical-align:2px;background:var(--paper)}
.quote{border-left:3px solid var(--gold);background:var(--cream);color:var(--ink);padding:14px 16px;margin:16px 0;font-size:16px}
.quote .src{display:block;font:700 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
figure{margin:18px 0}figure img{width:100%;background:#fff;border:1px solid var(--line)}figcaption{font:500 12px var(--sans);color:var(--muted);margin-top:6px}
.pending{border:1px dashed var(--gold2);background:var(--cream);padding:16px;color:var(--muted);font-style:italic;margin:16px 0}
/* clip */
.clip{background:var(--cream);border:1px solid var(--line);border-left:3px solid var(--wine);margin:16px 0 20px}
.clip .vh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.clip .vh b{font:700 15px var(--play);color:var(--wine)}.clip .vh .ts{margin-left:auto}
.clip video{display:block;width:100%;background:#000;max-height:60vh}
.clip .ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.clip .noclip{padding:12px 14px;font-size:14px;color:var(--muted);font-style:italic;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* practice button */
.pbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--sans);cursor:pointer;font-style:normal}
/* fab + sheet */
.fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:40;display:flex;gap:8px}
.fab button{height:50px;border-radius:999px;border:0;padding:0 18px;font:700 15px var(--sans);cursor:pointer;box-shadow:0 8px 24px rgba(27,36,64,.3)}
.fab .tools{background:var(--navy);color:var(--cream);border:2px solid var(--gold)}
.fab .live{background:var(--green);color:#fff;display:none}
.fab .live.show{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(27,36,64,.45);display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;border-top:3px solid var(--gold);
 transform:translateY(105%);transition:transform .28s ease;padding:10px 0 calc(24px + var(--safe-b));font-family:var(--sans)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 14px;border-radius:999px;font:600 14px var(--sans);background:var(--cream);border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.pane{padding:6px 18px}
.big{font-family:var(--disp);font-size:68px;line-height:1;text-align:center;margin:8px 0 4px;color:var(--navy)}
.big small{font:600 14px var(--sans);color:var(--muted);margin-left:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
input[type=range]{width:100%;accent-color:var(--gold)}
.lbl{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
.beats{display:flex;justify-content:center;gap:8px;margin:14px 0}
.beats i{width:18px;height:18px;border-radius:50%;background:var(--cream2);border:2px solid transparent;cursor:pointer}
.beats i.acc{border-color:var(--wine)}
.beats i.mute{opacity:.25}
.beats i.hit{background:var(--gold)}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font:600 13px var(--sans)}
.seg button.on{background:var(--navy);color:var(--cream)}
.go{display:block;width:100%;height:54px;border-radius:12px;border:0;font:800 17px var(--sans);cursor:pointer;background:var(--navy);color:var(--cream);margin-top:14px}
.go.stop{background:var(--wine)}
.rlist{display:grid;gap:8px}
.rlist button{all:unset;cursor:pointer;display:block;background:var(--cream);border:1px solid var(--line);border-left:3px solid var(--line);padding:11px 14px}
.rlist button.on{border-left-color:var(--gold);background:var(--cream2)}
.rlist b{display:block;font-family:var(--play);color:var(--navy)}.rlist span{font-size:12px;color:var(--muted)}
.grid16{display:grid;gap:3px;margin:12px 0}
.grid16 .r{display:grid;grid-template-columns:64px repeat(16,1fr);gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.grid16 .c{height:16px;border-radius:2px;background:var(--cream2)}
.grid16 .c.x{background:var(--navy)}.grid16 .c.o{background:var(--gold2)}
.grid16 .c.now{outline:2px solid var(--wine)}
.timer{font-family:var(--disp);font-size:54px;text-align:center;color:var(--navy)}
.log{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.log li{background:var(--cream);border:1px solid var(--line);padding:10px 12px;font-size:14px}
.log li .d{font-size:12px;color:var(--muted)}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:12px;font:15px var(--sans)}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy);color:var(--cream)}
#gate .box{width:100%;max-width:360px;text-align:center;border-top:3px solid var(--gold);padding-top:24px}
#gate h1{font-family:var(--disp);font-weight:400;font-size:56px;margin:4px 0 0}
#gate .muted{color:rgba(250,246,236,.7)}
#gate form{display:flex;gap:8px;margin-top:22px}
#gate .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
#gate .err{color:#f0a89c;font-size:13px;min-height:20px;margin-top:10px}
.foot{padding:30px 0 120px;font:500 12px var(--sans);color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <div class="eyebrow">Paolo Rubinacci</div>
  <h1>Scuola</h1>
  <p class="muted small">Area personale di studio</p>
  <form id="gf"><input id="gp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn gold" type="submit">Entra</button></form>
  <div class="err" id="ge"></div>
</div></div>

<header class="top"><div class="wrap"><div class="brand" data-go="home">Scuola<span>.</span></div><div class="crumb" id="crumb"></div></div></header>
<main id="app"></main>

<div class="fab"><button class="live" id="live"><span class="dot"></span><span id="liveTxt">Metronomo</span></button><button class="tools" id="openTools">♩ Strumenti</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div>
  <div class="tabs" id="tabs"><button data-t="metro">Metronomo</button><button data-t="rhythm">Ritmi New Orleans</button><button data-t="diary">Diario</button></div>
  <div id="pane"></div>
</div>

/* encrypted media: fetch .enc, decrypt with same password, make blob URL */
const blobCache={};
async function mediaURL(src,type){
 if(!/\.enc$/.test(src))return src;
 if(blobCache[src])return blobCache[src];
 const r=await fetch(src);const raw=new Uint8Array(await r.arrayBuffer());
 const {pt}=await decBytes(raw,PW);return blobCache[src]=URL.createObjectURL(new Blob([pt],{type}))}

/* clip player with A-B loop & slow-down (pitch preserved) */
function initClip(el){
 const v=el.querySelector('video');let A=null,B=null,loop=false,loaded=false;
 async function load(){if(loaded)return;loaded=true;v.src=await mediaURL(el.dataset.src,'video/mp4');v.preservesPitch=true;v.webkitPreservesPitch=true}
 v.addEventListener('play',load,{once:true});el.querySelector('.vh').addEventListener('click',async()=>{await load();v.play()});
 v.addEventListener('timeupdate',()=>{if(loop&&A!=null&&B!=null&&v.currentTime>=B){v.currentTime=A}});
 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await load();v.playbackRate=+b.dataset.r;el.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
 el.querySelectorAll('[data-ab]').forEach(b=>b.onclick=async()=>{await load();const k=b.dataset.ab;
  if(k==='a'){A=v.currentTime;b.textContent='A '+fmt(A)}else if(k==='b'){B=v.currentTime;b.textContent='B '+fmt(B)}
  else{loop=!loop;b.classList.toggle('on',loop);if(loop){if(A==null)A=0;if(B==null)B=v.duration||1e9;v.currentTime=A;v.play()}}})}
function fmt(t){t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}

/* ================= audio engine ================= */
let AC=null,MASTER=null,NOISE=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);
 const n=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=n}
 if(AC.state==='suspended')AC.resume();return AC}
function env(t,g,a,dur){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.002);g.gain.exponentialRampToValueAtTime(.0008,t+dur)}
const SND={
 click(t,acc){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=acc?1760:1100;o.connect(g);g.connect(MASTER);env(t,g,acc?.9:.55,.05);o.start(t);o.stop(t+.06)},
 sub(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(MASTER);env(t,g,.18,.03);o.start(t);o.stop(t+.04)},
 clave(t,v=1){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='square';o.frequency.value=2500;f.type='bandpass';f.frequency.value=2500;f.Q.value=8;o.connect(f);f.connect(g);g.connect(MASTER);env(t,g,.7*v,.05);o.start(t);o.stop(t+.06)},
 kick(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);o.connect(g);g.connect(MASTER);env(t,g,1*v,.22);o.start(t);o.stop(t+.25)},
 snare(t,v=1){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NOISE;f.type='highpass';f.frequency.value=1500;s.connect(f);f.connect(g);g.connect(MASTER);env(t,g,.55*v,.14);s.start(t);s.stop(t+.16);
  const o=AC.createOscillator(),g2=AC.createGain();o.frequency.value=190;o.connect(g2);g2.connect(MASTER);env(t,g2,.3*v,.08);o.start(t);o.stop(t+.1)},
 hat(t,v=1){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NOISE;f.type='highpass';f.frequency.value=7000;s.connect(f);f.connect(g);g.connect(MASTER);env(t,g,.28*v,.04);s.start(t);s.stop(t+.05)},
 bass(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=73.4;o.connect(g);g.connect(MASTER);env(t,g,.7*v,.18);o.start(t);o.stop(t+.2)},
 bell(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=1320;o.connect(g);g.connect(MASTER);env(t,g,.35*v,.12);o.start(t);o.stop(t+.14)}};

function stopMetro(){M.playing=false;clearInterval(mTimer);live();if(curTab==='metro')paneMetro()}
function mTick(){const spb=60/M.bpm,stepDur=spb/M.sub;
 while(mNext<AC.currentTime+.12){const beat=Math.floor(mStep/M.sub),s=mStep%M.sub;let t=mNext;
  if(M.sub===2&&s===1)t+=stepDur*(M.swing/100)*.667; /* swing: 0 = straight, 100 = full triplet */
  if(s===0){const a=M.acc[beat]||0;if(a!==-1)SND.click(t,a===2||a===1);flash(beat,t)}else SND.sub(t);
  mNext+=stepDur;mStep++;if(mStep>=M.beats*M.sub){mStep=0;mBar++;
   if(M.train&&mBar%M.trainBars===0&&M.bpm<M.trainMax){M.bpm=Math.min(M.trainMax,M.bpm+M.trainStep);const e=$('#mBpm');if(e)e.innerHTML=M.bpm+'<small>bpm</small>';const r=$('#mRange');if(r)r.value=M.bpm;live()}}}}

 <div class="big" id="rBpm">${R.bpm}<small>bpm</small></div><input type="range" id="rRange" min="50" max="180" value="${R.bpm}">
 <button class="go ${R.playing?'stop':''}" id="rGo">${R.playing?'■ Stop':'▶ Suona il ritmo'}</button></div>`;
 document.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>{R.id=b.dataset.rid;R.bpm=RHY[R.id].bpm;rStep=0;rSave();paneRhythm()});
 document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{R.mute[b.dataset.mute]=!R.mute[b.dataset.mute];rSave();paneRhythm()});
 $('#rRange').oninput=e=>{R.bpm=+e.target.value;$('#rBpm').innerHTML=R.bpm+'<small>bpm</small>';rSave();live()};
 $('#rGo').onclick=()=>R.playing?stopRhythm():startRhythm()}

/* ================= practice diary ================= */
const D=Object.assign({start:null,acc:0},LS.get('timer',{}));let dInt=null;
function tNow(){return D.acc+(D.start?Date.now()-D.start:0)}
function hms(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function paneDiary(){const log=LS.get('log',[]),week=log.filter(e=>Date.now()-e.at<7*864e5).reduce((a,e)=>a+e.ms,0);
 $('#pane').innerHTML=`<div class="pane">
 <div class="timer" id="tShow">${hms(tNow())}</div>
 <div class="row"><button class="btn ${D.start?'':'gold'}" id="tGo">${D.start?'❚❚ Pausa':'▶ Inizia la pratica'}</button><button class="btn sm" id="tReset">Azzera</button></div>
 <div class="lbl">Cosa hai esercitato</div>
 <input type="text" id="dWhat" placeholder="Es. Lezione 3 · rumba alla Longhair, mano sinistra">
 <div class="row" style="justify-content:flex-start"><span class="small">Tempo raggiunto</span><input type="number" id="dBpm" value="${M.playing?M.bpm:R.playing?R.bpm:''}" placeholder="bpm" style="width:90px;padding:8px"></div>
 <textarea id="dNote" rows="2" placeholder="Note: cosa migliorare la prossima volta"></textarea>
 <button class="go" id="dSave">Salva nel diario</button>
 <div class="lbl">Ultimi 7 giorni · ${hms(week)}</div>
 <ul class="log">${log.slice().reverse().slice(0,30).map(e=>`<li><b>${esc(e.what||'Pratica')}</b>${e.bpm?` · ${e.bpm} bpm`:''} · ${hms(e.ms)}<div class="d">${new Date(e.at).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}${e.note?' · '+esc(e.note):''}</div></li>`).join('')||'<li class="muted">Ancora nessuna sessione salvata.</li>'}</ul>
 <p class="small muted">Il diario resta salvato su questo telefono.</p></div>`;
 $('#tGo').onclick=()=>{if(D.start){D.acc=tNow();D.start=null}else D.start=Date.now();LS.set('timer',D);paneDiary()};
 $('#tReset').onclick=()=>{D.start=null;D.acc=0;LS.set('timer',D);paneDiary()};
 $('#dSave').onclick=()=>{const ms=tNow();const l=LS.get('log',[]);l.push({at:Date.now(),ms,what:$('#dWhat').value.trim(),bpm:+$('#dBpm').value||null,note:$('#dNote').value.trim()});LS.set('log',l);D.start=null;D.acc=0;LS.set('timer',D);paneDiary()};
 clearInterval(dInt);dInt=setInterval(()=>{const e=$('#tShow');if(e)e.textContent=hms(tNow());else clearInterval(dInt)},500)}

/* ================= tools sheet ================= */
let curTab=null;
function openTools(t){curTab=t||curTab||'metro';$('#sheet').classList.add('show');$('#scrim').classList.add('show');showTab()}
function closeTools(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');curTab=null}
function showTab(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));({metro:paneMetro,rhythm:paneRhythm,diary:paneDiary})[curTab]()}
let lastTab='metro';
$('#openTools').onclick=()=>openTools(lastTab);
$('#scrim').onclick=()=>{lastTab=curTab;closeTools()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;lastTab=curTab;showTab()});
function live(){const on=M.playing||R.playing,l=$('#live');l.classList.toggle('show',on);$('#liveTxt').textContent=M.playing?M.bpm+' bpm · Stop':R.playing?RHY[R.id].name.split(' ')[0]+' '+R.bpm+' · Stop':''}
$('#live').onclick=()=>{stopMetro();stopRhythm()};

/* start */
const saved=LS.get('pw',null);
if($('#enc').textContent.trim()==='__ENC__')unlock('');else if(saved)unlock(saved,true);
</script>
</body>
</html>
