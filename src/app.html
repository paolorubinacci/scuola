<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Scuola · Paolo Rubinacci</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scuola"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"NolaMardiGras";src:url("fonts/NolaMardiGras.ttf") format("truetype");font-display:swap}
:root{--bg:#ffffff;--surf:#f3f7fc;--surf2:#e8f0fb;--ink:#0f1b2d;--muted:#5d6b80;--line:#dfe7f2;
--blue:#2f7bf6;--blue2:#e7f0ff;--sky:#8cc2ff;--coral:#ff6a4d;--coral2:#fff0ec;--green:#17a673;--red:#e2483a;
--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:600 14px var(--font);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:700 15px var(--font)}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font:800 20px var(--font);letter-spacing:-.02em;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--sky));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.streak{font:700 13px var(--font);background:var(--coral2);color:var(--coral);border-radius:999px;padding:6px 10px;white-space:nowrap}
/* home */
.hero{padding:34px 0 8px}
.hero h1{font:800 clamp(32px,8vw,48px)/1.08 var(--font);letter-spacing:-.03em;margin:6px 0 8px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 6px}
.stat{background:var(--surf);border-radius:var(--r);padding:14px}
.stat b{display:block;font:800 24px/1.1 var(--font);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.goal{background:linear-gradient(135deg,var(--blue),#5aa8ff);color:#fff}.stat.goal span{color:rgba(255,255,255,.85)}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:#fff}
.sec-t{font:800 20px var(--font);letter-spacing:-.02em;margin:28px 0 12px}
.grid{display:grid;gap:14px;margin:0 0 40px}
/* course cards: each course keeps its own palette */
.course{border-radius:22px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:#fff;box-shadow:0 8px 24px rgba(15,27,45,.06);transition:transform .15s}
.course:active{transform:scale(.99)}
.course .band{padding:22px 20px 18px}
.course .body{padding:14px 20px 18px}
.course .meta{font-size:14px;color:var(--muted)}
.course .bar{height:8px;border-radius:9px;background:var(--surf2);margin-top:12px;overflow:hidden}
.course .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.course .next{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:600 13px var(--font)}
.course .next b{color:var(--blue)}
.course.soon{cursor:default;border-style:dashed;box-shadow:none;padding:18px 20px;background:var(--surf)}
.course.soon h2{font:700 18px var(--font);margin:6px 0 2px;color:var(--muted)}
.course.nola .band{background:#1b2440;color:#faf6ec;border-bottom:3px solid #b8893a}
.course.nola .band .eyebrow{color:#d9b36a}
.course.nola .band h2{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 0}
.course.nola .body{background:#faf6ec}.course.nola .bar{background:#e6dcc6}.course.nola .bar i{background:#b8893a}.course.nola .next b{color:#6b2737}
/* ===== New Orleans theme (course + lessons), like the PDF manual ===== */
.t-nola{--paper:#fffdf8;--cream:#faf6ec;--cream2:#f3ead6;--nink:#24211c;--nmuted:#7c7466;--nline:#e6dcc6;--navy:#1b2440;--gold:#b8893a;--gold2:#d9b36a;--wine:#6b2737;
 background:var(--paper);color:var(--nink);font-family:"Tinos","Liberation Serif","Times New Roman",serif;font-size:17px;min-height:100vh}
.t-nola .eyebrow{color:var(--gold);font-family:var(--font)}
.t-nola .nt{font-family:"NolaMardiGras",Georgia,serif;font-weight:400}
.t-nola .chero{background:var(--navy);color:var(--cream);border-bottom:3px solid var(--gold);padding:30px 0 22px}
.t-nola .chero h1{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:clamp(32px,9vw,52px);line-height:1.08;margin:6px 0 6px}
.t-nola .chero .eyebrow{color:var(--gold2)}
.t-nola .chero p{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;color:rgba(250,246,236,.82)}
.lessons{list-style:none;margin:18px 0 40px;padding:0;border-top:1px solid var(--nline)}
.lessons li{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--nline);padding:14px 4px;cursor:pointer}
.lessons .num{font-family:"NolaMardiGras",Georgia,serif;font-size:30px;color:var(--gold);width:34px;text-align:center}
.lessons .t{font:700 18px/1.3 "Playfair Display",Georgia,serif;color:var(--navy)}.lessons .d{font:500 12px var(--font);color:var(--nmuted)}
.lessons .chk{margin-left:auto;font:600 12px var(--font);color:var(--nmuted);white-space:nowrap}.lessons .chk.done{color:#2f7a5b}
.brief{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--gold);padding:16px 18px 6px;margin:22px 0 26px}
.brief h3{color:var(--navy);margin:0 0 8px;font-size:21px}
.flow h2{font-size:24px;color:var(--navy);margin:34px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--nline);padding-bottom:6px;font-weight:400}
.flow p{margin:0 0 14px}
.ts{display:inline-block;white-space:nowrap;font:700 11px/1 var(--font);color:var(--gold);border:1px solid var(--gold2);border-radius:3px;padding:3px 5px;margin-right:7px;vertical-align:2px;background:var(--paper)}
.quote{border-left:3px solid var(--gold);background:var(--cream);padding:14px 16px;margin:16px 0;font-size:16px}
.quote .src{display:block;font:700 10px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
figure{margin:18px 0}figure img{width:100%;background:#fff;border:1px solid var(--nline)}figcaption{font:500 12px var(--font);color:var(--nmuted);margin-top:6px}
.pending{border:1px dashed var(--gold2);background:var(--cream);padding:16px;color:var(--nmuted);font-style:italic;margin:16px 0}
.clip{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--wine);margin:16px 0 20px}
.clip .vh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.clip .vh b{font:700 15px "Playfair Display",Georgia,serif;color:var(--wine)}.clip .vh .ts{margin-left:auto}
.clip video{display:block;width:100%;background:#000;max-height:60vh}
.clip .ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--nline);font-family:var(--font)}
.clip .noclip{padding:12px 14px;font-size:14px;color:var(--nmuted);font-style:italic;border-top:1px solid var(--nline);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.t-nola .btn{background:var(--paper);border-color:var(--nline);color:var(--navy)}
.t-nola .btn.on{background:#2f7a5b;border-color:#2f7a5b;color:#fff}
.t-nola .seg{background:var(--paper);border-color:var(--nline)}.t-nola .seg button.on{background:var(--navy);color:var(--cream)}
.kb{background:#fff;border:1px solid var(--line);border-radius:16px;margin:16px 0 24px;overflow:hidden;font-family:var(--font);color:var(--ink)}
.t-nola .kb{border-color:var(--nline);border-left:3px solid var(--gold);border-radius:0}
.kb .kh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;flex-wrap:wrap}
.kb .kh b{font:700 14px var(--font)}.kb .kh .tag{font:700 10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.t-nola .kb .kh .tag{color:var(--gold)}
.kb canvas{display:block;width:100%;touch-action:none}
.kb .kc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.kb .play{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}
.t-nola .kb .play{background:var(--navy)}
.kb .play.on{background:var(--coral)}
.kb .tr{display:inline-flex;align-items:center;gap:4px;font:600 13px var(--font)}
.kb .tr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.kb .tr span{min-width:58px;text-align:center}
.kb .prog{height:4px;background:var(--surf2)}.kb .prog i{display:block;height:100%;width:0;background:var(--coral)}
.kb .legend{font:500 11px var(--font);color:var(--muted);padding:0 14px 8px}
.kb .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px -1px 8px}
.pbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--font);cursor:pointer;font-style:normal}
/* fab + tools (global style) */
.fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:40;display:flex;gap:8px}
.fab button{height:52px;border-radius:999px;border:0;padding:0 18px;font:700 15px var(--font);cursor:pointer;box-shadow:0 10px 28px rgba(47,123,246,.35)}
.fab .tools{background:var(--blue);color:#fff}
.fab .live{background:var(--coral);color:#fff;display:none;box-shadow:0 10px 28px rgba(255,106,77,.4)}
.fab .live.show{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.35);display:none}.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;
 transform:translateY(105%);transition:transform .28s ease;padding:10px 0 calc(24px + var(--safe-b));font-family:var(--font);color:var(--ink);box-shadow:0 -10px 40px rgba(15,27,45,.15)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 14px;border-radius:999px;font:600 14px var(--font);background:var(--surf)}
.tabs button.on{background:var(--ink);color:#fff}
.pane{padding:6px 18px}
.big{font:800 68px/1 var(--font);letter-spacing:-.04em;text-align:center;margin:8px 0 4px}
.big small{font:600 14px var(--font);color:var(--muted);margin-left:6px;letter-spacing:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
input[type=range]{width:100%;accent-color:var(--blue)}
.lbl{font:700 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.beats{display:flex;justify-content:center;gap:10px;margin:14px 0}
.beats i{width:20px;height:20px;border-radius:50%;background:var(--surf2);border:2px solid transparent;cursor:pointer;transition:transform .08s}
.beats i.acc{border-color:var(--blue)}.beats i.mute{opacity:.25}
.beats i.hit{background:var(--coral);transform:scale(1.25)}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font:600 13px var(--font)}
.seg button.on{background:var(--blue);color:#fff}
.go{display:block;width:100%;height:56px;border-radius:16px;border:0;font:800 17px var(--font);cursor:pointer;background:var(--blue);color:#fff;margin-top:14px;box-shadow:0 8px 20px rgba(47,123,246,.3)}
.go.stop{background:var(--coral);box-shadow:0 8px 20px rgba(255,106,77,.3)}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rlist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;background:var(--surf);border:2px solid transparent;border-radius:14px;padding:8px 12px;font:700 14px/1.2 var(--font);-webkit-tap-highlight-color:transparent}
.rlist button:active{transform:scale(.97)}
.rlist button.on{border-color:var(--blue);background:var(--blue2)}
.rlist button.on.pl{border-color:var(--coral);background:#fff1ed}
.rlist button i{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--font);font-style:normal;color:var(--blue)}
.rlist button.pl i{background:var(--coral);color:#fff}
.rplayer{background:var(--surf);border-radius:18px;padding:14px;margin-bottom:14px}
.rplayer h3{margin:0;font:800 18px var(--font)}.rplayer p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.rplayer .bpmrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.rplayer .bpmrow b{font:800 22px var(--font);min-width:86px;text-align:center}.rplayer .bpmrow b small{font:600 12px var(--font);color:var(--muted)}
.rplayer .go{margin-top:12px;height:52px}
.grid16{display:grid;gap:3px;margin:12px 0}
.grid16 .r{display:grid;grid-template-columns:64px repeat(16,1fr);gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.grid16 .c{height:16px;border-radius:4px;background:var(--surf2)}
.grid16 .c.x{background:var(--blue)}.grid16 .c.o{background:var(--sky)}
.grid16 .c.now{outline:2px solid var(--coral)}
.timer{font:800 54px var(--font);letter-spacing:-.03em;text-align:center}
.log{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.log li{background:var(--surf);border-radius:12px;padding:10px 12px;font-size:14px}.log li .d{font-size:12px;color:var(--muted)}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font:16px var(--font)}

/* ascolti consigliati */
.acard{display:flex;gap:14px;align-items:center;margin:22px 0 4px;padding:16px;background:var(--navy);color:var(--cream);border-bottom:3px solid var(--gold);cursor:pointer}
.acard .ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:20px}
.acard b{display:block;font:400 24px/1.1 "NolaMardiGras",Georgia,serif}.acard span{font:500 13px var(--font);color:rgba(250,246,236,.8)}
.asec{font:700 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:28px 0 8px}
.alist{display:grid;gap:10px}
.atr{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--gold);padding:12px 14px;cursor:pointer}
.atr.has{border-left-color:var(--wine)}
.atr .h{display:flex;align-items:center;gap:10px}
.atr .pl{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--nline);display:flex;align-items:center;justify-content:center;color:var(--nmuted);font:700 13px var(--font)}
.atr.has .pl{background:var(--wine);border-color:var(--wine);color:#fff}
.atr .tt{font:700 17px/1.25 "Playfair Display",Georgia,serif;color:var(--navy)}.atr .ar{font:500 13px var(--font);color:var(--nmuted)}
.atr .cx{font-size:15px;margin:8px 0 0;color:var(--nink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--nline);background:var(--paper);border-radius:999px;padding:5px 10px;font:600 12px/1 var(--font);color:var(--navy);cursor:pointer}
.chip.r{border-color:var(--gold2);color:var(--gold)}.chip.s{cursor:default;color:var(--nmuted)}
.adisc{margin:0 0 8px;font-size:16px}
.stp{background:var(--cream);border:1px solid var(--nline);border-top:3px solid var(--wine);padding:14px;margin:18px 0;font-family:var(--font)}
.stp .tr{display:flex;align-items:center;gap:10px}
.stp .pp{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--wine);color:#fff;font-size:22px;cursor:pointer}
.stp .time{font:700 13px var(--font);color:var(--nmuted);min-width:92px;text-align:right}
.stp input[type=range]{accent-color:var(--wine)}
.stp .ab{position:relative;height:6px;margin:-2px 0 6px}.stp .ab i{position:absolute;top:0;height:6px;background:rgba(184,137,58,.45);border-radius:3px}
.stp .modes{display:flex;gap:6px;margin:12px 0 4px}
.stp .modes button{all:unset;flex:1;text-align:center;cursor:pointer;padding:9px 6px;border:1px solid var(--nline);background:var(--paper);font:700 13px var(--font);color:var(--navy)}
.stp .modes button.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.stems{display:grid;gap:6px;margin:10px 0}
.stem{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--nline);padding:8px 10px}
.stem .nm{all:unset;cursor:pointer;font:700 14px var(--font);color:var(--navy);display:flex;align-items:center;gap:8px}
.stem .nm i{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none}
.stem.off .nm{color:var(--nmuted);text-decoration:line-through}.stem.off .nm i{background:var(--nline)}
.stem .so{all:unset;cursor:pointer;width:34px;height:30px;text-align:center;border:1px solid var(--nline);font:800 12px/30px var(--font);color:var(--nmuted)}
.stem .so.on{background:var(--gold);border-color:var(--gold);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.stp .row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.stp .note{font-size:12px;color:var(--nmuted);margin:8px 0 0}
.badge{flex:none;font:700 11px var(--font);padding:5px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--nline);color:var(--nmuted);white-space:nowrap}
.badge.p{background:#fff6e0;border-color:var(--gold2);color:var(--gold)}.badge.e{background:#fdecea;border-color:#e2a49c;color:#a3352a}
.addb{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;margin:20px 0 4px;padding:14px 16px;border:1.5px dashed var(--gold2);background:var(--paper);cursor:pointer;color:var(--navy)}

.addb strong{display:block;font:700 16px var(--font)}.addb small{display:block;font:500 13px var(--font);color:var(--nmuted)}
.atext p{margin:0 0 12px;font-size:16.5px;line-height:1.65;color:var(--nink)}
.aul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:16px;line-height:1.55;color:var(--nink)}.aul.src{font-size:14px}
.pdfv{background:#fff;border:1px solid var(--nline);display:grid;gap:8px;padding:8px;margin:10px 0;max-height:80vh;overflow:auto}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}

.thumbs img{width:100%;height:128px;object-fit:contain;display:block;background:#fff}

.thumbs .tb{display:flex;border-top:1px solid var(--nline)}.thumbs .tb button{flex:1;border:0;background:#f4f4f4;padding:6px 0;font-size:14px;cursor:pointer;color:var(--ink)}
.thumbs .tb button:disabled{opacity:.3}
.leg{position:fixed;inset:0;z-index:400;background:#1f1f1f;display:flex;flex-direction:column}

.leg.fw .lg-p{align-items:flex-start}.leg.fw .lg-p img{max-height:none;width:100%;height:auto}
.lg-a{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:60px;border:0;border-radius:10px;background:rgba(0,0,0,.16);color:#fff;font-size:28px;cursor:pointer}
.lg-a.l{left:6px}.lg-a.r{right:6px}.lg-a:disabled{display:none}
.pending code{display:block;margin-top:8px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.af{display:grid;gap:12px;margin:18px 0;font-family:var(--font)}
.af label{display:grid;gap:6px;font:600 14px var(--font);color:var(--navy)}
.af .two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.af .file input{font:14px var(--font);padding:10px;border:1px dashed var(--nline);background:var(--paper)}
.af .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.af .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--nline);background:var(--paper);padding:12px;cursor:pointer}
.af .opt input{margin-top:3px;accent-color:var(--wine);width:18px;height:18px;flex:none}
.af .opt b{display:block;font:700 14px var(--font)}.af .opt small{display:block;font:500 12.5px/1.4 var(--font);color:var(--nmuted)}
.af .ghk{border:1px solid var(--nline);background:var(--paper);padding:10px 12px}.af .ghk summary{cursor:pointer;font:700 14px var(--font);color:var(--navy)}
.af .ghk input{margin-top:8px}
.af .note{font-size:13px}
.btabs{position:sticky;top:0;z-index:20;background:var(--navy);border-bottom:3px solid var(--gold)}
.btabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:0;scrollbar-width:none}
.btabs button{all:unset;flex:none;cursor:pointer;padding:11px 14px 12px;font:700 14px var(--font);color:rgba(250,246,236,.72);border-bottom:3px solid transparent;margin-bottom:-3px}
.btabs button.on{color:#fff;border-bottom-color:var(--wine);background:rgba(255,255,255,.07)}
.btabs button i{font-style:normal;font-size:11px;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:9px;margin-left:3px}
.hint{font:500 14px/1.5 var(--font);color:var(--nmuted);margin:16px 0 10px}
.empty{border:1px dashed var(--gold2);background:var(--cream);padding:16px;margin:16px 0;font:500 15px/1.55 var(--font);color:var(--nmuted)}
.sub{font:700 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}.sub i{font-style:normal;color:var(--nmuted)}
.reclist{display:grid;gap:8px;margin-bottom:6px}
.res{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--gold);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.res.on{border-left-color:var(--wine);background:#fff}.res.open{background:#fff;cursor:default}
.rh{display:flex;align-items:center;gap:10px}.ri{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px}
.res.on .ri{background:var(--wine)}
.rt{flex:1;min-width:0}.rt b{display:block;font:700 15.5px/1.3 var(--font);color:var(--navy)}.rt small{display:block;font:500 12.5px var(--font);color:var(--nmuted)}
.ed{all:unset;cursor:pointer;flex:none;width:36px;height:36px;text-align:center;line-height:36px;border-radius:50%;color:var(--nmuted);font-size:16px}.ed:hover{background:var(--paper)}
.rst{font:500 13px/1.45 var(--font);color:var(--nmuted);margin:8px 0 0}.rst.p{color:var(--gold)}.rst.e{color:#a3352a}.rst code{display:block;font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.rv:empty{display:none}.rv{margin-top:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vc{background:var(--cream);border:1px solid var(--nline);cursor:pointer;padding:0 0 8px}.vc .rh{padding:8px 8px 0}.vc .ri{display:none}
.vt{position:relative;aspect-ratio:16/9;background:var(--navy);overflow:hidden}.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vt .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);font-size:40px}
.vt .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(122,30,50,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.vt em{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font:600 11px var(--font);font-style:normal;padding:2px 6px;border-radius:4px}
.vp{grid-column:1/-1;margin:2px 0 12px;background:var(--navy);border-bottom:3px solid var(--wine);scroll-margin-top:60px}
.vph{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;color:var(--cream)}
.vpt{flex:1;min-width:0}.vpt b{display:block;font:700 14px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vpt small{font:500 12px var(--font);color:rgba(250,246,236,.7)}
.vx{all:unset;flex:none;cursor:pointer;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font:700 13px var(--font)}.vx:hover{background:rgba(255,255,255,.24)}
.vp video{width:100%;max-height:70vh;background:#000;display:block}
.vpc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px;background:var(--cream)}.vpc .note{margin:0}
.vc.on{outline:3px solid var(--wine);outline-offset:-3px}.vc.on .pb{background:var(--gold)}
.yt{position:relative;aspect-ratio:16/9;background:#000}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.drop{display:grid!important;place-items:center;text-align:center;gap:4px!important;border:2px dashed var(--gold2);background:var(--paper);padding:26px 14px;cursor:pointer}
.drop input{position:absolute;opacity:0;width:1px;height:1px}.drop b{font:800 17px var(--font);color:var(--wine)}.drop small{font:500 13px var(--font);color:var(--nmuted)}
.two2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ui{border:1px solid var(--nline);border-left:3px solid var(--wine);background:#fff;padding:12px;display:grid;gap:10px}
.af select{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font:16px var(--font)}
.modal{position:fixed;inset:0;z-index:300;background:rgba(15,27,45,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .box{background:var(--cream,#faf6ec);width:100%;max-width:520px;padding:18px;margin:0;max-height:90vh;overflow:auto;border-top:3px solid var(--gold)}
.btn.del{color:#a3352a;border-color:#e2a49c}
.t-nola .af .go{background:var(--wine);box-shadow:none;border-radius:0}
@media(max-width:520px){.af .opts{grid-template-columns:1fr}}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(90% 60% at 100% 0%,#dbe9ff,transparent 60%),radial-gradient(70% 50% at 0% 100%,#ffe3dc,transparent 60%),#fff}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate h1{font:800 54px var(--font);letter-spacing:-.04em;margin:4px 0 0}
#gate form{display:flex;gap:8px;margin-top:22px}
#gate .err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
.foot{padding:30px 0 120px;font:500 12px var(--font);color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <div class="eyebrow">Paolo Rubinacci</div>
  <h1>Scuola</h1>
  <p class="muted small">Area personale di studio</p>
  <form id="gf"><input id="gp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn gold" type="submit">Entra</button></form>
  <div class="err" id="ge"></div>
</div></div>

<header class="top"><div class="wrap"><div class="brand" data-go="home"><i>♪</i>Scuola</div><div class="crumb" id="crumb"></div><span class="streak" id="streak" hidden></span></div></header>
<main id="app"></main>

<div class="fab"><button class="live" id="live"><span class="dot"></span><span id="liveTxt">Metronomo</span></button><button class="tools" id="openTools">♩ Strumenti</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div>
  <div class="tabs" id="tabs"><button data-t="metro">Metronomo</button><button data-t="rhythm">Ritmi New Orleans</button><button data-t="diary">Diario</button></div>
  <div id="pane"></div>
</div>

<script type="text/plain" id="enc">__ENC__</script>
<script>
"use strict";
/* ================= data (filled after decrypt) ================= */
let DATA={courses:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('scuola-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('scuola-'+k,JSON.stringify(v))}catch(e){}}};

/* ================= crypto gate ================= */
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function kdf(pw,salt){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt'])}
const keyCache={};
async function decBytes(raw,pw){const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),h=salt.join(',');const key=await (keyCache[h]=keyCache[h]||kdf(pw,salt));
 return {pt:new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)),key}}
let PW=null;
async function unlock(pw,silent){
 const enc=$('#enc').textContent.trim();
 if(!enc||enc==='__ENC__'){DATA=window.DEMO_DATA||DATA;return boot()}
 try{const {pt}=await decBytes(b2u(enc),pw);DATA=JSON.parse(new TextDecoder().decode(pt));PW=pw;LS.set('pw',pw);boot()}
 catch(e){if(!silent)$('#ge').textContent='Password non corretta.';LS.set('pw',null)}}
/* encrypted media: fetch .enc, decrypt with same password, make blob URL */
const blobCache={};
function mediaURL(src,type){
 if(!/\.enc$/.test(src))return Promise.resolve(src);
 return blobCache[src]=blobCache[src]||(async()=>{const r=await fetch(src);const raw=new Uint8Array(await r.arrayBuffer());
  const {pt}=await decBytes(raw,PW);return URL.createObjectURL(new Blob([pt],{type}))})().catch(e=>{delete blobCache[src];throw e})}
/* background prefetch: clips of the open lesson load one after another, so a tap plays at once */
let pfToken=0;
async function prefetch(list){const tok=++pfToken;for(const [src,type] of list){if(tok!==pfToken)return;try{await mediaURL(src,type)}catch(e){}}}
$('#gf').addEventListener('submit',e=>{e.preventDefault();unlock($('#gp').value)});

/* ================= router ================= */
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go==='home'?'':g.dataset.go)}});
const MG=new Set('EFHJLNOQSTWZ');
function nolaText(s){let out='',st=true;for(const ch of s.toUpperCase()){out+=(st&&MG.has(ch))?ch.toLowerCase():ch;st=!/\p{L}/u.test(ch)}return out}
let NOLA=false;
function applyNola(root){root.querySelectorAll('.t-nola .nt, .course.nola .nt').forEach(e=>{if(!e.dataset.o)e.dataset.o=e.textContent;e.textContent=NOLA?nolaText(e.dataset.o):e.dataset.o})}
if(document.fonts){document.fonts.load('20px NolaMardiGras').then(f=>{NOLA=f.length>0&&document.fonts.check('20px NolaMardiGras');document.body.classList.toggle('nola-on',NOLA);applyNola(document)}).catch(()=>{})}
new MutationObserver(()=>applyNola(document)).observe(document.getElementById('app'),{childList:true});
function boot(){$('#gate').remove();render()}
function progress(){return LS.get('done',{})}
function render(){
 ascStop();
 const h=location.hash.slice(1),am=h.match(/^(.+?)-ascolti(?:-([a-z0-9]+)(?:-(modifica|carica))?)?$/);
 if(am){const ac_=DATA.courses.find(x=>x.id===am[1]);if(ac_)return renderAscolti(ac_,am[2],am[3])}
 const [cid,lid]=h.split('-l');const c=DATA.courses.find(x=>x.id===cid);
 if(c&&lid)return renderLesson(c,c.lessons.find(l=>String(l.n)===lid));
 if(c)return renderCourse(c);
 renderHome()}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streakDays(){const days=new Set(LS.get('log',[]).map(e=>dayKey(e.at)));let n=0,d=new Date();if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekMin(){return Math.round(LS.get('log',[]).filter(e=>Date.now()-e.at<7*864e5).reduce((a,e)=>a+e.ms,0)/60000)}
function updStreak(){const s=streakDays(),el=$('#streak');el.hidden=!s;el.textContent='🔥 '+s+(s===1?' giorno':' giorni')}
function theme(n){$('#app').className=n||''}
function nextLesson(c){const done=progress();return c.lessons.find(l=>!done[c.id+'-'+l.n])}
function renderHome(){
 pfToken++;theme('');$('#crumb').textContent='';updStreak();
 const done=progress(),goal=LS.get('goal',150),wm=weekMin(),tot=DATA.courses.reduce((a,c)=>a+c.lessons.filter(l=>done[c.id+'-'+l.n]).length,0);
 $('#app').innerHTML=`<div class="wrap"><section class="hero"><div class="eyebrow">Ciao Paolo</div><h1>La tua <em>scuola</em> di musica</h1><p>Videocorsi, esercizi e strumenti per fare pratica ogni giorno.</p></section>
 <div class="stats"><div class="stat goal" id="goalStat"><b>${wm}<small style="font-size:13px;font-weight:600"> / ${goal} min</small></b><span>pratica questa settimana</span><div class="meter"><i style="width:${Math.min(100,wm/goal*100)}%"></i></div></div>
 <div class="stat"><b>${streakDays()} 🔥</b><span>giorni di fila</span></div><div class="stat"><b>${tot}</b><span>lezioni completate</span></div></div>
 <div class="sec-t">I miei corsi</div>
 <div class="grid">${DATA.courses.map(c=>{const n=c.lessons.length,d=c.lessons.filter(l=>done[c.id+'-'+l.n]).length,nx=nextLesson(c);
  return`<div class="course ${esc(c.theme||'')}" data-go="${c.id}"><div class="band"><div class="eyebrow">${esc(c.kind||'Videocorso')}</div><h2 class="nt">${esc(c.title)}</h2></div><div class="body"><div class="meta">${esc(c.sub)}</div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><div class="next"><span>${d} / ${n} lezioni</span>${nx?`<b>Continua · Lezione ${nx.n} ›</b>`:'<b>Completato ✓</b>'}</div></div></div>`}).join('')}
  <div class="course soon"><div class="eyebrow">Prossimamente</div><h2>Altri corsi in arrivo</h2><div class="meta">Qui aggiungeremo i prossimi videocorsi.</div></div></div>
 <div class="foot">Scuola · Paolo Rubinacci · area privata</div></div>`;window.scrollTo(0,0);
}
function renderCourse(c){
 theme(c.theme?'t-'+c.theme.replace(/^.*\s/,''):'');$('#crumb').textContent=c.title;updStreak();const done=progress();
 $('#app').innerHTML=`<section class="chero"><div class="wrap"><div class="eyebrow">${esc(c.kind||'Videocorso')}</div><h1 class="nt">${esc(c.title)}</h1><p>${esc(c.sub)}</p></div></section><div class="wrap">
 <ul class="lessons">${c.lessons.map(l=>`<li data-go="${c.id}-l${l.n}"><span class="num">${l.n}</span><div><div class="t">${esc(l.title)}</div><div class="d">${esc(l.dur||'')}${l.clips?` · ${l.clips} passaggi suonati`:''}${l.ready?'':' · in preparazione'}</div></div><span class="chk ${done[c.id+'-'+l.n]?'done':''}">${done[c.id+'-'+l.n]?'✓ fatta':'›'}</span></li>`).join('')}</ul>
 ${isNola(c)?`<div class="acard" data-go="${c.id}-ascolti"><span class="ic">♫</span><div><b>Ascolti consigliati</b><span>Dal PDF della lezione 1 · ascolto e tracce separate</span></div></div>`:''}
 <div class="foot"></div></div>`;window.scrollTo(0,0)}
function renderLesson(c,l){
 if(!l)return go(c.id);
 theme(c.theme?'t-'+c.theme.replace(/^.*\s/,''):'');updStreak();
 $('#crumb').textContent=c.title+' · Lezione '+l.n;const key=c.id+'-'+l.n,done=progress()[key];
 let h=`<section class="chero"><div class="wrap"><div class="eyebrow">Lezione ${l.n} · ${esc(l.dur||'')}</div><h1 class="nt">${esc(l.title)}</h1><p>${esc(c.title)} · ${esc(c.sub.split('·')[0])}</p></div></section><div class="wrap">`;
 if(l.brief)h+=`<div class="brief"><h3 class="nt">In breve</h3>${l.brief}</div>`;
 h+=`<div class="flow">`+(l.blocks||[]).map(blockHTML).join('')+`</div>`;
 if(!l.ready)h+=`<div class="pending">Questa lezione è in preparazione: trascrizione, citazioni dal PDF del corso e partiture arrivano qui, con i passaggi suonati integrati nel testo.</div>`;
 const i=c.lessons.indexOf(l),prev=c.lessons[i-1],next=c.lessons[i+1];
 h+=`<div class="row" style="justify-content:space-between;margin:30px 0">${prev?`<button class="btn sm" data-go="${c.id}-l${prev.n}">‹ Lezione ${prev.n}</button>`:'<span></span>'}
  <button class="btn sm ${done?'on':''}" id="doneBtn">${done?'✓ Completata':'Segna come fatta'}</button>
  ${next?`<button class="btn sm" data-go="${c.id}-l${next.n}">Lezione ${next.n} ›</button>`:'<span></span>'}</div><div class="foot"></div></div>`;
 $('#app').innerHTML=h;window.scrollTo(0,0);
 $('#doneBtn').onclick=()=>{const p=progress();p[key]=!p[key];LS.set('done',p);renderLesson(c,l)};
 document.querySelectorAll('.clip[data-src]').forEach(initClip);
 document.querySelectorAll('.kb[data-k]').forEach(initKb);

/* ================= New Orleans rhythms (16 steps per bar; x = strong, o = soft) ================= */
const RHY={
 habanera:{name:'Habanera / tango',desc:'La base dello "Spanish tinge": croma puntata, semicroma, due crome.',bpm:90,
  parts:{bass:'x..xx.x.x..xx.x.',hat:'o.o.o.o.o.o.o.o.'}},
 tresillo:{name:'Tresillo',desc:'3-3-2: la cellula che sta sotto tutto, dal second line al R&B.',bpm:100,
  parts:{clave:'x.....x.....x...',kick:'x.....x.....x...',hat:'o.o.o.o.o.o.o.o.'}},
 clave32:{name:'Clave 3-2 (son)',desc:'Lato "3" poi lato "2".',bpm:95,bars:2,
  parts:{clave:'x.....x.....x.......x...x.......',hat:'o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.'}},
 clave23:{name:'Clave 2-3',desc:'Stessa clave, partendo dal lato "2".',bpm:95,bars:2,
  parts:{clave:'....x...x.......x.....x.....x...',hat:'o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.'}},
 rumba:{name:'Rumba alla Longhair',desc:'Rumba-boogie (semplificata): tresillo nel basso, clave 3-2 sopra.',bpm:100,bars:2,
  parts:{bass:'x.....x.....x...x.....x.....x...',clave:'x.....x.....x.......x...x.......',snare:'....x.......x.......x.......x...',hat:'o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.o.'}},
 secondline:{name:'Second line',desc:'Groove di strada delle brass band (semplificato): cassa sincopata, rullante con ghost notes.',bpm:96,
  parts:{kick:'x.....x.x.......',snare:'..o.x.o...o.x..o',hat:'x.x.x.x.x.x.x.x.'}},
 shuffle:{name:'Shuffle / boogie',desc:'Terzine con la croma di mezzo muta: base di boogie e New Orleans blues.',bpm:110,triplet:true,
  parts:{kick:'x.....x.....',snare:'...x.....x..',hat:'x.xx.xx.xx.x'}},
 funk:{name:'Street beat / funk',desc:'Groove sincopato alla Meters (semplificato): rullante sul 2 e 4.',bpm:96,
  parts:{kick:'x..x..x...x..x..',snare:'....x..o.o..x...',hat:'x.xxx.xxx.xxx.xx'}}};
const R=Object.assign({id:'rumba',bpm:100,playing:false,mute:{}},LS.get('rhythm',{}),{playing:false});
let rTimer=null,rNext=0,rStep=0;
function rSave(){const {playing,...s}=R;LS.set('rhythm',s)}
let rTok=0;
async function startRhythm(){if(kbActive)kbActive();stopMetro();ac();const tok=++rTok;R.playing=true;clearInterval(rTimer);live();if(curTab==='rhythm')paneRhythm();
 await loadDrums();if(tok!==rTok||!R.playing)return;if(AC.state!=='running'){try{await AC.resume()}catch(e){}}
 rStep=0;rNext=AC.currentTime+.08;clearInterval(rTimer);rTimer=setInterval(rTick,25)}
function stopRhythm(){rTok++;R.playing=false;clearInterval(rTimer);live();if(curTab==='rhythm')paneRhythm()}
function rTick(){const r=RHY[R.id],per=r.triplet?3:4,len=(r.triplet?12:16)*(r.bars||1),step=60/R.bpm/per;
 while(rNext<AC.currentTime+.12){const t=rNext;
  for(const [p,pat] of Object.entries(r.parts)){if(R.mute[p])continue;const c=pat[rStep%pat.length];if(c==='x')SND[p](t,1);else if(c==='o')SND[p](t,.45)}
  const s=rStep;setTimeout(()=>document.querySelectorAll('.grid16 .c').forEach(x=>x.classList.toggle('now',+x.dataset.i===s)),Math.max(0,(t-AC.currentTime)*1000));
  rNext+=step;rStep=(rStep+1)%len}}
const PNAME={clave:'Clave',kick:'Cassa',snare:'Rullante',hat:'Charleston',bass:'Basso',bell:'Campana'};
function paneRhythm(){const r=RHY[R.id];
 $('#pane').innerHTML=`<div class="pane">
 <div class="rplayer"><h3>${r.name}</h3><p>${r.desc}</p>
 <div class="grid16">${Object.entries(r.parts).map(([p,pat])=>`<div class="r" style="grid-template-columns:64px repeat(${pat.length},1fr)"><span data-mute="${p}" style="cursor:pointer;${R.mute[p]?'text-decoration:line-through;opacity:.5':''}">${PNAME[p]}</span>${[...pat].map((c,i)=>`<i class="c ${c==='x'?'x':c==='o'?'o':''}" data-i="${i}"></i>`).join('')}</div>`).join('')}</div>
 <div class="bpmrow"><button class="ib" data-rd="-5">−</button><input type="range" id="rRange" min="50" max="180" value="${R.bpm}"><b id="rBpm">${R.bpm}<small> bpm</small></b><button class="ib" data-rd="5">+</button></div>
 <button class="go ${R.playing?'stop':''}" id="rGo">${R.playing?'■ Stop':'▶ Suona il ritmo'}</button></div>
 <div class="lbl" style="margin-top:4px">Tocca un ritmo per suonarlo</div>
 <div class="rlist">${Object.entries(RHY).map(([k,x])=>`<button data-rid="${k}" class="${k===R.id?'on':''} ${k===R.id&&R.playing?'pl':''}"><i>${k===R.id&&R.playing?'■':'▶'}</i>${x.name}</button>`).join('')}</div>
 <p class="small muted">Tocca il nome di uno strumento nella griglia per toglierlo e suonarlo tu.</p><p class="small muted" style="font-size:11px">Suoni: acoustic kit (web-audio-samples, C. Wilson); clave e basso: OLPC Berklee Sound Library (CC BY 3.0).</p></div>`;
 document.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>{const k=b.dataset.rid;
  if(k===R.id&&R.playing){stopRhythm();return}
  if(k!==R.id){R.id=k;R.bpm=RHY[k].bpm;rStep=0;rSave()}startRhythm()});
 document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{R.mute[b.dataset.mute]=!R.mute[b.dataset.mute];rSave();paneRhythm()});
 const setRB=v=>{R.bpm=Math.max(50,Math.min(180,Math.round(v)));$('#rBpm').innerHTML=R.bpm+'<small> bpm</small>';$('#rRange').value=R.bpm;rSave();live()};
 $('#rRange').oninput=e=>setRB(+e.target.value);
 document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>setRB(R.bpm+ +b.dataset.rd));
 $('#rGo').onclick=()=>R.playing?stopRhythm():startRhythm()}

/* Artisti e album: SOLO quelli indicati dal corso (PDF lezione 1). Niente aggiunte didattiche non richieste.
   Ogni brano di ascolti/catalog.json e' una «casella» con piu' risorse (x.r): registrazioni, partiture, MIDI, video, link.
   Paolo carica i file dal sito (pagina «Carica»): il sito riconosce tipo, brano, titolo e categoria; GitHub Actions
   prepara audio e video (tools/elabora.py). Tutti i file sono cifrati con la password della Scuola. */
const ASC={disco:[{a:'Dr. John',n:'tutto; per iniziare:',al:['Gumbo','Dr. John Plays Mac Rebennack (vol. 1 e 2)','Desitively Bonnaroo','In the Right Place']},
 {a:'James Booker',n:'tutto;',al:['Junco Partner','New Orleans Piano Wizard: Live','Piano Prince of New Orleans','Blues & Ragtime from New Orleans','Classified','Lost Paramount Tapes']},
 {a:'Professor Longhair',n:'tutto;',al:['Crawfish Fiesta','New Orleans Piano',"Rock 'n' Roll Gumbo",'Tipitina (raccolta dei primi singoli)']},
 {a:'Henry Butler',al:['PiaNOLA Live']},{a:'Jon Cleary',al:['Mo Hippa Live','GoGo Juice']},
 {a:'Huey «Piano» Smith'},{a:'Champion Jack Dupree'},{a:'Fats Domino'},{a:'Tuts Washington'},
 {a:'Jelly Roll Morton',n:'tutto, comprese le interviste delle registrazioni Library of Congress'}]};
const GHR='https://api.github.com/repos/PaoloRubinacci/scuola';
const ghTok=()=>LS.get('gh',null);
let CAT=null;
/* catalogo: con la chiave GitHub lo legge dal repository (subito aggiornato), altrimenti dal sito */
function ascCat(force){if(force)CAT=null;return CAT=CAT||(async()=>{const t=ghTok();let c=null;
 if(t&&navigator.onLine!==false){try{const r=await fetch(GHR+'/contents/ascolti/catalog.json?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github.raw+json'}});if(r.ok)c=await r.json()}catch(e){}}
 if(!c){try{const r=await fetch('ascolti/catalog.json',{cache:'no-store'});c=r.ok?await r.json():{}}catch(e){c={}}}
 Object.values(c).forEach(x=>{x.r=x.r||[]});return c})()}
const STN={drums:'Batteria',bass:'Basso',piano:'Piano',vocals:'Voce',other:'Altro'};
const normA=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const words=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
/* le quattro sezioni di un brano */
const SEZ=[['ascolto','Ascolto',r=>r.k==='audio'],['spartiti','Spartiti e MIDI',r=>r.k==='pdf'||r.k==='midi'||r.k==='img'],['video','Video',r=>r.k==='video'||r.k==='yt'],['scheda','Scheda',()=>false]];

 Lezione:'Lezioni e masterclass sul brano o sullo stile.',Intervista:'Il musicista racconta il brano.',Video:''};

function count(x,k){return x.r.filter(SEZ.find(s=>s[0]===k)[2]).length}
function busy(x){return x.r.some(r=>r.st==='elaborazione'||r.omr==='attesa')}
function cardHTML(c,id,x){const n=[['ascolto','registrazion','e','i'],['spartiti','spartit','o','i'],['video','video','','']].map(([k,w,s1,sn])=>{const m=count(x,k);return m?`${m} ${w}${m===1?s1:sn}`:''}).filter(Boolean);
 const err=x.r.some(r=>r.st==='errore'),has=count(x,'ascolto')>0;
 return`<div class="atr ${has?'has':''}" data-go="${c.id}-ascolti-${id}"><div class="h"><span class="pl">${has?'▶':'♪'}</span><div style="flex:1;min-width:0"><div class="tt">${esc(x.t)}</div><div class="ar">${esc(x.a||'')}${x.al?' · '+esc(x.al):''}${x.anno?' · '+esc(x.anno):''}</div></div>
 ${busy(x)?'<span class="badge p">In preparazione</span>':err?'<span class="badge e">Errore</span>':''}</div>
 <div class="chips">${(n.length?n:['Ancora nessun file']).map(t=>`<span class="chip s">${t}</span>`).join('')}${x.storia?'<span class="chip s">Storia</span>':''}</div></div>`}
async function renderAscolti(c,tid,mode){
 theme(c.theme?'t-'+c.theme.replace(/^.*\s/,''):'');updStreak();$('#crumb').textContent=c.title+' · Ascolti';
 const cat=await ascCat();
 if(tid==='nuovo')return ascUpload(c,null,cat);
 if(tid==='scheda')return ascForm(c,null,{},cat);
 if(tid&&cat[tid])return mode==='modifica'?ascForm(c,tid,cat[tid],cat):mode==='carica'?ascUpload(c,tid,cat):ascTrack(c,tid,cat[tid]);
 const ids=Object.keys(cat),used=new Set();
 const sec=ASC.disco.map(d=>{const tr=ids.filter(k=>normA(cat[k].a)===normA(d.a));tr.forEach(k=>used.add(k));
  return`<div class="asec">${esc(d.a)}</div>${d.n||d.al?`<p class="adisc">${d.n?esc(d.n)+' ':''}${(d.al||[]).map(a=>`<i>${esc(a)}</i>`).join(', ')}</p>`:''}${tr.length?`<div class="alist">${tr.map(k=>cardHTML(c,k,cat[k])).join('')}</div>`:''}`}).join('');
 const altri=ids.filter(k=>!used.has(k));
 $('#app').innerHTML=`<section class="chero"><div class="wrap"><div class="eyebrow">${esc(c.title)} · dal PDF della lezione 1</div><h1 class="nt">Ascolti consigliati</h1><p>Ogni brano è una casella: registrazioni, spartiti, video</p></div></section><div class="wrap">
 <button class="addb" data-go="${c.id}-ascolti-nuovo"><b>＋</b><span><strong>Carica file</strong><small>Audio, video, PDF, MIDI o un link: li metto io nel brano giusto</small></span></button>
 ${sec}${altri.length?`<div class="asec">Altri brani</div><div class="alist">${altri.map(k=>cardHTML(c,k,cat[k])).join('')}</div>`:''}
 <div class="row"><button class="btn sm" data-go="${c.id}-ascolti-scheda">＋ Nuovo brano senza file</button><button class="btn sm" data-go="${c.id}">‹ ${esc(c.title)}</button></div><div class="foot"></div></div>`;window.scrollTo(0,0)}

const TONI={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};

 const show=k=>{tab=ASCTAB[id]=k;ascStop();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));const el=$('#tabc'),list=tabs.find(t=>t[0]===k)[2];
  ({ascolto:tabAscolto,spartiti:tabSpartiti,video:tabVideo,scheda:tabScheda})[k](el,c,id,x,list,base)};

function tabAscolto(el,c,id,x,list,base){

 <div class="reclist">${list.map(r=>`<div class="res sel ${r.id===cur?'on':''}" data-pick="${r.id}">${resHead(c,id,r,(r.stems||[]).length?' · tracce separate':'')}${stato(r)}${(r.avvisi||[]).map(a=>`<div class="rst">${esc(a)}</div>`).join('')}</div>`).join('')}</div><div id="stp"></div>`;

/* ---- MIDI -> tastiera (tracce 1 e 2 = mano destra e sinistra; se c'e' una traccia sola si divide al Do centrale) ---- */
function midiToKb(buf,title){const d=new DataView(buf);let p=0;
 const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p+i));p+=n;return s};
 const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=v*128+(b&127)}while(b&128);return v};

 for(let t=0;t<nt&&p<d.byteLength-8;t++){const id=str(4),len=d.getUint32(p);p+=4;const end=p+len;if(id!=='MTrk'){p=end;continue}
  let tick=0,run=0;const on={},notes=[];
  while(p<end){tick+=vlq();let st=d.getUint8(p);if(st&128){p++;if(st<0xf0)run=st}else st=run;const ty=st&0xf0;
   if(st===0xff){const mt=d.getUint8(p++),l=vlq();if(mt===0x51&&!tempo)tempo=(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2);if(mt===0x58&&!tsig)tsig=d.getUint8(p);p+=l}
   else if(st===0xf0||st===0xf7){p+=vlq()}
   else if(ty===0x90||ty===0x80){const n=d.getUint8(p),v=d.getUint8(p+1);p+=2;const k=(st&15)*128+n;
    if(ty===0x90&&v>0)(on[k]=on[k]||[]).push([tick,v]);else{const s=(on[k]||[]).shift();if(s)notes.push([s[0],tick-s[0],n,s[1]])}}
   else if(ty===0xc0||ty===0xd0)p+=1;else p+=2}
  p=end;if(notes.length)tracks.push(notes)}

 tracks.forEach((ns,i)=>ns.forEach(([s,l,m,v])=>out.push([s/div,Math.max(.05,l/div),m,two?(i===0?'R':'L'):(m>=60?'R':'L'),Math.max(.25,v/127)])));

/* ---- leggio: pagine a tutto schermo, scorri col dito o con le frecce; doppio tocco = adatta alla larghezza ---- */
function leggio(urls,title){const L=document.createElement('div');L.className='leg';let n=0,wl=null;
 L.innerHTML=`<header><b>${esc(title)}</b><span class="lg-c"></span><button data-fw title="Adatta alla larghezza">↔︎</button><button data-x>✕</button></header>

 L.querySelector('[data-fw]').onclick=fw;sc.addEventListener('dblclick',fw);
 const key=e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();to(n+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();to(n-1)}else if(e.key==='Escape')close()};

  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}L.remove()}

 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{})}catch(e){}  // lo schermo non si spegne mentre leggi

/* ---- spartiti in immagini: ritaglio automatico della pagina (toglie barre e cornici degli screenshot) e JPEG leggero ---- */
function loadImg(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('Immagine non leggibile: '+file.name))};im.src=u})}

function pageBox(im){const W0=im.naturalWidth,H0=im.naturalHeight,k=Math.min(1,1000/Math.max(W0,H0)),W=Math.round(W0*k),H=Math.round(H0*k);
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=false;x.drawImage(im,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0;i<W*H;i++)g[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000|0;

 for(let y=ya;y<yb;y++)for(let i=0;i<ew;i++){hist[g[y*W+i]]++;hist[g[y*W+W-1-i]]++;tot+=2}
 let bg=0;for(let v=1;v<256;v++)if(hist[v]>hist[bg])bg=v;
 if(bg>253||bg<200||hist[bg]<tot*.5)return null;   // nessuno sfondo grigio uniforme attorno alla pagina: non ritaglio
 const isBg=i=>Math.abs(g[i]-bg)<=1,col=new Array(W).fill(false);
 for(let xx=0;xx<W;xx++){let c=0;for(let y=ya;y<yb;y++)if(isBg(y*W+xx))c++;col[xx]=c/(yb-ya)<.9}

 const row=new Array(H).fill(false);for(let y=0;y<H;y++){let c=0;for(let xx=x0;xx<x1;xx++)if(isBg(y*W+xx))c++;row[y]=c/(x1-x0)<.9}
 const rr=runsOf(row,H*.2|0).sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]))[0];if(!rr)return null;const [y0,y1]=rr;
 const m=Math.max(3,W/250|0);let ix0=1e9,iy0=1e9,ix1=-1,iy1=-1;   // dentro la pagina: solo la parte scritta, senza i margini bianchi
 for(let y=y0+m;y<y1-m;y++)for(let xx=x0+m;xx<x1-m;xx++)if(g[y*W+xx]<190){if(xx<ix0)ix0=xx;if(xx>ix1)ix1=xx;if(y<iy0)iy0=y;if(y>iy1)iy1=y}

 return {x:bx0/k,y:by0/k,w:(bx1-bx0)/k,h:(by1-by0)/k}}
async function prepPage(file,auto){const im=await loadImg(file);let b=auto?pageBox(im):null;const cropped=!!b;b=b||{x:0,y:0,w:im.naturalWidth,h:im.naturalHeight};
 const s=Math.min(1,2400/Math.max(b.w,b.h)),cv=document.createElement('canvas');cv.width=Math.round(b.w*s);cv.height=Math.round(b.h*s);
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.imageSmoothingQuality='high';x.drawImage(im,b.x,b.y,b.w,b.h,0,0,cv.width,cv.height);

function u2b(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

  ENCK={salt,key:await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['encrypt'])}}

 for(let i=0;i<4;i++){say('Pubblico…');const head=(await gh('/git/ref/heads/main',{},tok)).object.sha,com=await gh('/git/commits/'+head,{},tok);
  let cat={};const r=await fetch(GHR+'/contents/ascolti/catalog.json?ref='+head,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw+json'}});if(r.ok)cat=await r.json();
  Object.values(cat).forEach(x=>{x.r=x.r||[]});const gone=change(cat)||[];
  const cb=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:JSON.stringify(cat,null,1)+'\n',encoding:'utf-8'})},tok);

function kindOf(f){const n=f.name.toLowerCase(),t=f.type||'';
 if(/\.(mid|midi)$/.test(n)||/midi/.test(t))return'midi';if(/\.pdf$/.test(n)||t==='application/pdf')return'pdf';
 if(/^image\//.test(t)||/\.(png|jpe?g|webp|heic|heif|gif)$/.test(n))return'img';
 if(/^video\//.test(t)||/\.(mp4|mov|m4v|webm|mkv)$/.test(n))return'video';if(/^audio\//.test(t)||/\.(mp3|m4a|wav|aac|flac|ogg|aif|aiff)$/.test(n))return'audio';return null}
function cleanName(s){return String(s).replace(/\.[a-z0-9]{2,4}$/i,'').replace(/^(y2mate\.com|ytmp3\.cc|savefrom\.net|ssyoutube\.com)\s*-\s*/i,'')
 .replace(/[_]+/g,' ').replace(/\[[^\]]*\]/g,'').replace(/\((official[^)]*|audio|video|hd|hq|lyrics?|remaster(ed)?[^)]*)\)/ig,'').replace(/\b(1080p|720p|480p|360p|4k|hd)\b/ig,'').replace(/\s{2,}/g,' ').replace(/^[\s\-–·]+|[\s\-–·]+$/g,'').trim()}
function guessCat(k,txt){const s=' '+words(txt).join(' ')+' ';
 if(k==='pdf')return'Partitura';if(k==='midi')return'MIDI';
 if(k==='audio')return/ (live|concert|concerto|festival) /.test(s)?'Registrazione live':'Registrazione';
 if(/ (tutorial|tuto|lesson|lezione|lezioni|how to|learn|cours|masterclass|breakdown|analysis|analisi|play like|come suonare|tutoriel|lecon) /.test(s))return/ (masterclass|lesson|lezione|cours|lecon) /.test(s)&&!/ tutorial /.test(s)?'Lezione':'Tutorial';
 if(/ (interview|intervista|entretien|talks|talking) /.test(s))return'Intervista';
 if(/ (live|concert|concerto|festival|fest|tiny desk|session|sessions|performance|performs|tv|show|jazzfest) /.test(s))return'Live';return'Video'}
function guessBrano(cat,txt){const w=' '+words(txt).join(' ')+' ';let best=null,bl=0;
 for(const id in cat){const tw=words(cat[id].t).join(' ');if(tw&&w.includes(' '+tw+' ')&&tw.length>bl){best=id;bl=tw.length}}return best}

async function id3(file){try{const b=new Uint8Array(await file.slice(0,262144).arrayBuffer());if(String.fromCharCode(b[0],b[1],b[2])!=='ID3')return{};
 const v=b[3],sz=(b[6]<<21)|(b[7]<<14)|(b[8]<<7)|b[9];let p=10;const out={};
 const txt=(a)=>{const e=a[0],d=a.subarray(1);try{return(e===1||e===2?new TextDecoder('utf-16'+(e===2?'be':'')):e===3?new TextDecoder('utf-8'):new TextDecoder('latin1')).decode(d).replace(/\0/g,'').trim()}catch(e){return''}};
 while(p+10<Math.min(b.length,sz+10)){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=v===4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:(b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7];const fr=b.subarray(p+10,p+10+fs);
  if(id==='TIT2')out.t=txt(fr);if(id==='TPE1')out.a=txt(fr);if(id==='TALB')out.al=txt(fr);if(id==='TYER'||id==='TDRC')out.y=txt(fr).slice(0,4);p+=10+fs}return out}catch(e){return{}}}

 $('#af').onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('.go'),say=m=>$('#afm').textContent=m,v=n=>f.elements[n].value.trim();btn.disabled=true;
  try{const t=await needTok(f,say);if(!t){btn.disabled=false;return}

   const ch={t:v('t'),a:v('a'),al:v('al'),anno:v('anno'),storia:f.elements.storia.value.trim(),studio:f.elements.studio.value.split('\n').map(s=>s.trim()).filter(Boolean),tag:v('tag').split(',').map(s=>s.trim()).filter(Boolean)};
   CAT=Promise.resolve(await ghCommit(t,[],cat=>{cat[tid]=Object.assign(cat[tid]||{r:[]},ch)},(isNew?'Ascolti: nuovo brano «':'Ascolti: scheda «')+ch.t+'» (dal sito)',say));
   ASCTAB[tid]='scheda';toast('✓ Pubblicato');go(c.id+'-ascolti-'+tid)}

/* ---- stem player: un <audio> per traccia (streaming, poca memoria; velocita' senza cambiare intonazione), volumi via Web Audio ---- */
let ASCP=null;
function ascStop(){if(ASCP){ASCP.destroy();ASCP=null}}
function fmt(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
async function stemPlayer(el,id,info){
 const st={mode:'mix',on:{},solo:null,vol:{},rate:1,A:null,B:null,loop:false,ready:false,els:{},gains:{},timer:null,dead:false};
 const prev=LS.get('asc-'+id,{});info.stems.forEach(k=>{st.on[k]=prev.on?prev.on[k]!==false:true;st.vol[k]=prev.vol?.[k]??1});
 const save=()=>LS.set('asc-'+id,{on:st.on,vol:st.vol});
 const keys=['mix',...info.stems];
 el.innerHTML=`<div class="stp"><div class="tr"><button class="pp" data-pp>▶</button><input type="range" data-seek min="0" max="${info.dur}" step="0.1" value="0"><span class="time" data-time>0:00 / ${fmt(info.dur)}</span></div>
 <div class="ab" data-ab></div>
 ${info.stems.length?'<div class="modes"><button data-mode="mix">Originale</button><button data-mode="stems">Tracce separate</button></div>':''}
 <div data-stems></div>
 <div class="row2"><button class="btn sm" data-back>⟲ 5 s</button><button class="btn sm" data-a>A</button><button class="btn sm" data-b>B</button><button class="btn sm" data-loop>Loop A-B</button>
 <span class="seg">${[.5,.7,.85,1].map(r=>`<button data-rate="${r}" class="${r===1?'on':''}">${r===1?'100%':Math.round(r*100)+'%'}</button>`).join('')}</span></div>
 <div class="note" data-msg></div></div>`;
 const q=s=>el.querySelector(s),msg=t=>q('[data-msg]').textContent=t;
 ASCP={destroy(){st.dead=true;clearInterval(st.timer);Object.values(st.els).forEach(a=>{try{a.pause();a.removeAttribute('src');a.load()}catch(e){}})}};
 const master=()=>st.mode==='mix'?st.els.mix:st.els[info.stems[0]];
 const active=()=>st.mode==='mix'?['mix']:info.stems;
 const audible=k=>st.solo?k===st.solo:st.on[k];
 function applyGains(){info.stems.forEach(k=>{const v=audible(k)?st.vol[k]:0;if(st.gains[k])st.gains[k].gain.value=v;else if(st.els[k])st.els[k].muted=v===0})}
 function drawStems(){
  el.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===st.mode));
  q('[data-stems]').innerHTML=!info.stems.length?'':st.mode==='mix'?'<div class="note">Il brano com\'è. Passa a «Tracce separate» per isolare gli strumenti.</div>':
  `<div class="presets">${[['Tutto','all'],...(info.stems.includes('piano')?[['Solo piano','p'],['Senza piano · suoni tu','np']]:[]),['Basso + batteria','bd'],['Senza voce','nv']].map(([n,k])=>`<button class="chip" data-pre="${k}">${n}</button>`).join('')}</div>
  <div class="stems">${info.stems.map(k=>`<div class="stem ${audible(k)?'':'off'}"><button class="nm" data-tog="${k}"><i></i>${STN[k]}</button><input type="range" data-vol="${k}" min="0" max="1.5" step="0.05" value="${st.vol[k]}"><button class="so ${st.solo===k?'on':''}" data-solo="${k}">S</button></div>`).join('')}</div>
  ${info.stems.includes('piano')?'':'<div class="note">In questo brano il piano non è separato: lo trovi dentro «Altro».</div>'}
  <div class="note">Separazione automatica (Demucs): nelle registrazioni vecchie gli strumenti si sentono un po\' anche nelle altre tracce.</div>`;
  el.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const k=b.dataset.tog;if(st.solo){st.solo=null}else st.on[k]=!st.on[k];save();applyGains();drawStems()});
  el.querySelectorAll('[data-solo]').forEach(b=>b.onclick=()=>{const k=b.dataset.solo;st.solo=st.solo===k?null:k;applyGains();drawStems()});
  el.querySelectorAll('[data-vol]').forEach(b=>b.oninput=()=>{st.vol[b.dataset.vol]=+b.value;save();applyGains()});
  el.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const p=b.dataset.pre;st.solo=null;
   info.stems.forEach(k=>st.on[k]=p==='all'?true:p==='p'?k==='piano':p==='np'?k!=='piano':p==='bd'?(k==='bass'||k==='drums'):k!=='vocals');save();applyGains();drawStems()})}
 async function load(){if(st.ready)return;ac();msg('Carico le tracce…');
  const urls=await Promise.all(keys.map(k=>mediaURL(id+'/'+k+'.mp3.enc','audio/mpeg')));if(st.dead)return;
  keys.forEach((k,i)=>{const a=new Audio();a.preload='auto';a.setAttribute('playsinline','');a.src=urls[i];a.preservesPitch=true;a.webkitPreservesPitch=true;a.mozPreservesPitch=true;
   try{const s=AC.createMediaElementSource(a),g=AC.createGain();s.connect(g);g.connect(MASTER);if(k!=='mix')st.gains[k]=g}catch(e){}st.els[k]=a});
  st.ready=true;applyGains();msg('')}
 function setRate(){Object.values(st.els).forEach(a=>{a.playbackRate=st.rate})}
 function seek(t){t=Math.max(0,Math.min(info.dur-.05,t));Object.values(st.els).forEach(a=>{try{a.currentTime=t}catch(e){}})}
 function playing(){const m=master();return m&&!m.paused}
 function pauseAll(){Object.values(st.els).forEach(a=>a.pause());clearInterval(st.timer);q('[data-pp]').textContent='▶'}
 async function play(){if(kbActive)kbActive();await load();if(st.dead)return;if(AC.state!=='running'){try{await AC.resume()}catch(e){}}
  const t=master().currentTime;keys.forEach(k=>{if(!active().includes(k))st.els[k].pause()});seek(t);setRate();
  await Promise.all(active().map(k=>st.els[k].play().catch(()=>{})));q('[data-pp]').textContent='❚❚';
  clearInterval(st.timer);st.timer=setInterval(tick,200)}
 function tick(){const m=master();if(!m)return;let t=m.currentTime;
  if(st.loop&&st.A!=null&&st.B!=null&&t>=st.B){seek(st.A);t=st.A}
  if(st.mode==='stems')info.stems.slice(1).forEach(k=>{const a=st.els[k];if(Math.abs(a.currentTime-t)>.06)a.currentTime=t});
  if(m.ended){pauseAll();seek(0);t=0}
  q('[data-seek]').value=t;q('[data-time]').textContent=fmt(t)+' / '+fmt(info.dur)}
 function drawAB(){const ab=q('[data-ab]');ab.innerHTML=st.A!=null&&st.B!=null?`<i style="left:${st.A/info.dur*100}%;width:${(st.B-st.A)/info.dur*100}%"></i>`:'';
  q('[data-a]').classList.toggle('on',st.A!=null);q('[data-b]').classList.toggle('on',st.B!=null);q('[data-loop]').classList.toggle('on',st.loop)}
 const now=()=>st.ready?master().currentTime:+q('[data-seek]').value;
 q('[data-pp]').onclick=()=>playing()?pauseAll():play();
 q('[data-seek]').oninput=e=>{const v=+e.target.value;q('[data-time]').textContent=fmt(v)+' / '+fmt(info.dur);if(st.ready)seek(v)};
 q('[data-back]').onclick=()=>{if(st.ready)seek(now()-5)};
 q('[data-a]').onclick=()=>{st.A=now();if(st.B!=null&&st.B<=st.A)st.B=null;drawAB()};
 q('[data-b]').onclick=()=>{const t=now();if(st.A!=null&&t>st.A){st.B=t;st.loop=true}drawAB()};
 q('[data-loop]').onclick=()=>{if(st.A!=null&&st.B!=null)st.loop=!st.loop;else{st.A=null;st.B=null;st.loop=false}drawAB()};
 el.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{st.rate=+b.dataset.rate;setRate();el.querySelectorAll('[data-rate]').forEach(y=>y.classList.toggle('on',y===b))});
 el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{const was=playing(),t=now();st.mode=b.dataset.mode;drawStems();if(st.ready){pauseAll();seek(t);if(was)play()}});
 drawStems();drawAB()}

/* ================= practice diary ================= */
const D=Object.assign({start:null,acc:0},LS.get('timer',{}));let dInt=null;
function tNow(){return D.acc+(D.start?Date.now()-D.start:0)}
function hms(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function paneDiary(){const log=LS.get('log',[]),week=log.filter(e=>Date.now()-e.at<7*864e5).reduce((a,e)=>a+e.ms,0);
 $('#pane').innerHTML=`<div class="pane">
 <div class="timer" id="tShow">${hms(tNow())}</div>
 <div class="row"><button class="btn ${D.start?'':'gold'}" id="tGo">${D.start?'❚❚ Pausa':'▶ Inizia la pratica'}</button><button class="btn sm" id="tReset">Azzera</button></div>
 <div class="lbl">Cosa hai esercitato</div>
 <input type="text" id="dWhat" placeholder="Es. Lezione 3 · rumba alla Longhair, mano sinistra">
 <div class="row" style="justify-content:flex-start"><span class="small">Tempo raggiunto</span><input type="number" id="dBpm" value="${M.playing?M.bpm:R.playing?R.bpm:''}" placeholder="bpm" style="width:90px;padding:8px"></div>
 <textarea id="dNote" rows="2" placeholder="Note: cosa migliorare la prossima volta"></textarea>
 <button class="go" id="dSave">Salva nel diario</button>
 <div class="lbl">Ultimi 7 giorni · ${hms(week)}</div>
 <ul class="log">${log.slice().reverse().slice(0,30).map(e=>`<li><b>${esc(e.what||'Pratica')}</b>${e.bpm?` · ${e.bpm} bpm`:''} · ${hms(e.ms)}<div class="d">${new Date(e.at).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}${e.note?' · '+esc(e.note):''}</div></li>`).join('')||'<li class="muted">Ancora nessuna sessione salvata.</li>'}</ul>
 <p class="small muted">Il diario resta salvato su questo telefono.</p></div>`;
 $('#tGo').onclick=()=>{if(D.start){D.acc=tNow();D.start=null}else D.start=Date.now();LS.set('timer',D);paneDiary()};
 $('#tReset').onclick=()=>{D.start=null;D.acc=0;LS.set('timer',D);paneDiary()};
 $('#dSave').onclick=()=>{const ms=tNow();const l=LS.get('log',[]);l.push({at:Date.now(),ms,what:$('#dWhat').value.trim(),bpm:+$('#dBpm').value||null,note:$('#dNote').value.trim()});LS.set('log',l);D.start=null;D.acc=0;LS.set('timer',D);paneDiary();updStreak();if(!location.hash)renderHome()};
 clearInterval(dInt);dInt=setInterval(()=>{const e=$('#tShow');if(e)e.textContent=hms(tNow());else clearInterval(dInt)},500)}

/* ================= tools sheet ================= */
let curTab=null;
function openTools(t){try{loadDrums()}catch(e){}curTab=t||curTab||'metro';$('#sheet').classList.add('show');$('#scrim').classList.add('show');showTab()}
function closeTools(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');curTab=null}
function showTab(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));({metro:paneMetro,rhythm:paneRhythm,diary:paneDiary})[curTab]()}
let lastTab='metro';
$('#openTools').onclick=()=>openTools(lastTab);
$('#scrim').onclick=()=>{lastTab=curTab;closeTools()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;lastTab=curTab;showTab()});
function live(){const on=M.playing||R.playing,l=$('#live');l.classList.toggle('show',on);$('#liveTxt').textContent=M.playing?M.bpm+' bpm · Stop':R.playing?RHY[R.id].name.split(' ')[0]+' '+R.bpm+' · Stop':''}
$('#live').onclick=()=>{stopMetro();stopRhythm()};

/* start */
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font:600 14px/1.3 system-ui,sans-serif;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
/* app offline (PWA) */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
 const ask=()=>navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage('status');
 navigator.serviceWorker.addEventListener('message',e=>{const s=e.data&&e.data.offline;if(s&&s.ok===s.total&&!LS.get('offok-'+s.total,false)){LS.set('offok-'+s.total,true);toast('✓ La Scuola ora funziona anche offline')}});
 navigator.serviceWorker.addEventListener('controllerchange',ask);setTimeout(ask,4000);setTimeout(ask,30000)}
const saved=LS.get('pw',null);
if($('#enc').textContent.trim()==='__ENC__')unlock('');else if(saved)unlock(saved,true);
</script>
