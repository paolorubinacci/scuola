<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Scuola · Paolo Rubinacci</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scuola"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"NolaMardiGras";src:url("fonts/NolaMardiGras.ttf") format("truetype");font-display:swap}
:root{--bg:#ffffff;--surf:#f3f7fc;--surf2:#e8f0fb;--ink:#0f1b2d;--muted:#5d6b80;--line:#dfe7f2;
--blue:#2f7bf6;--blue2:#e7f0ff;--sky:#8cc2ff;--coral:#ff6a4d;--coral2:#fff0ec;--green:#17a673;--red:#e2483a;
--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:600 14px var(--font);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:700 15px var(--font)}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font:700 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font:800 20px var(--font);letter-spacing:-.02em;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--sky));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.streak{font:700 13px var(--font);background:var(--coral2);color:var(--coral);border-radius:999px;padding:6px 10px;white-space:nowrap}
/* home */
.hero{padding:34px 0 8px}
.hero h1{font:800 clamp(32px,8vw,48px)/1.08 var(--font);letter-spacing:-.03em;margin:6px 0 8px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 6px}
.stat{background:var(--surf);border-radius:var(--r);padding:14px}
.stat b{display:block;font:800 24px/1.1 var(--font);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.goal{background:linear-gradient(135deg,var(--blue),#5aa8ff);color:#fff}.stat.goal span{color:rgba(255,255,255,.85)}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:#fff}
.sec-t{font:800 20px var(--font);letter-spacing:-.02em;margin:28px 0 12px}
.grid{display:grid;gap:14px;margin:0 0 40px}
/* course cards: each course keeps its own palette */
.course{border-radius:22px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:#fff;box-shadow:0 8px 24px rgba(15,27,45,.06);transition:transform .15s}
.course:active{transform:scale(.99)}
.course .band{padding:22px 20px 18px}
.course .body{padding:14px 20px 18px}
.course .meta{font-size:14px;color:var(--muted)}
.course .bar{height:8px;border-radius:9px;background:var(--surf2);margin-top:12px;overflow:hidden}
.course .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.course .next{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:600 13px var(--font)}
.course .next b{color:var(--blue)}
.course.soon{cursor:default;border-style:dashed;box-shadow:none;padding:18px 20px;background:var(--surf)}
.course.soon h2{font:700 18px var(--font);margin:6px 0 2px;color:var(--muted)}
.course.nola .band{background:#1b2440;color:#faf6ec;border-bottom:3px solid #b8893a}
.course.nola .band .eyebrow{color:#d9b36a}
.course.nola .band h2{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 0}
.course.nola .body{background:#faf6ec}.course.nola .bar{background:#e6dcc6}.course.nola .bar i{background:#b8893a}.course.nola .next b{color:#6b2737}
/* ===== New Orleans theme (course + lessons), like the PDF manual ===== */
.t-nola{--paper:#fffdf8;--cream:#faf6ec;--cream2:#f3ead6;--nink:#24211c;--nmuted:#7c7466;--nline:#e6dcc6;--navy:#1b2440;--gold:#b8893a;--gold2:#d9b36a;--wine:#6b2737;
 background:var(--paper);color:var(--nink);font-family:"Tinos","Liberation Serif","Times New Roman",serif;font-size:17px;min-height:100vh}
.t-nola .eyebrow{color:var(--gold);font-family:var(--font)}
.t-nola .nt{font-family:"NolaMardiGras",Georgia,serif;font-weight:400}
.t-nola .chero{background:var(--navy);color:var(--cream);border-bottom:3px solid var(--gold);padding:30px 0 22px}
.t-nola .chero h1{font-family:"NolaMardiGras",Georgia,serif;font-weight:400;font-size:clamp(32px,9vw,52px);line-height:1.08;margin:6px 0 6px}
.t-nola .chero .eyebrow{color:var(--gold2)}
.t-nola .chero p{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;color:rgba(250,246,236,.82)}
.lessons{list-style:none;margin:18px 0 40px;padding:0;border-top:1px solid var(--nline)}
.lessons li{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--nline);padding:14px 4px;cursor:pointer}
.lessons .num{font-family:"NolaMardiGras",Georgia,serif;font-size:30px;color:var(--gold);width:34px;text-align:center}
.lessons .t{font:700 18px/1.3 "Playfair Display",Georgia,serif;color:var(--navy)}.lessons .d{font:500 12px var(--font);color:var(--nmuted)}
.lessons .chk{margin-left:auto;font:600 12px var(--font);color:var(--nmuted);white-space:nowrap}.lessons .chk.done{color:#2f7a5b}
.brief{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--gold);padding:16px 18px 6px;margin:22px 0 26px}
.brief h3{color:var(--navy);margin:0 0 8px;font-size:21px}
.flow h2{font-size:24px;color:var(--navy);margin:34px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--nline);padding-bottom:6px;font-weight:400}
.flow p{margin:0 0 14px}
.ts{display:inline-block;white-space:nowrap;font:700 11px/1 var(--font);color:var(--gold);border:1px solid var(--gold2);border-radius:3px;padding:3px 5px;margin-right:7px;vertical-align:2px;background:var(--paper)}
.quote{border-left:3px solid var(--gold);background:var(--cream);padding:14px 16px;margin:16px 0;font-size:16px}
.quote .src{display:block;font:700 10px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
figure{margin:18px 0}figure img{width:100%;background:#fff;border:1px solid var(--nline)}figcaption{font:500 12px var(--font);color:var(--nmuted);margin-top:6px}
.pending{border:1px dashed var(--gold2);background:var(--cream);padding:16px;color:var(--nmuted);font-style:italic;margin:16px 0}
.clip{background:var(--cream);border:1px solid var(--nline);border-left:3px solid var(--wine);margin:16px 0 20px}
.clip .vh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.clip .vh b{font:700 15px "Playfair Display",Georgia,serif;color:var(--wine)}.clip .vh .ts{margin-left:auto}
.clip video{display:block;width:100%;background:#000;max-height:60vh}
.clip .ctl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--nline);font-family:var(--font)}
.clip .noclip{padding:12px 14px;font-size:14px;color:var(--nmuted);font-style:italic;border-top:1px solid var(--nline);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.t-nola .btn{background:var(--paper);border-color:var(--nline);color:var(--navy)}
.t-nola .btn.on{background:#2f7a5b;border-color:#2f7a5b;color:#fff}
.t-nola .seg{background:var(--paper);border-color:var(--nline)}.t-nola .seg button.on{background:var(--navy);color:var(--cream)}
.kb{background:#fff;border:1px solid var(--line);border-radius:16px;margin:16px 0 24px;overflow:hidden;font-family:var(--font);color:var(--ink)}
.t-nola .kb{border-color:var(--nline);border-left:3px solid var(--gold);border-radius:0}
.kb .kh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;flex-wrap:wrap}
.kb .kh b{font:700 14px var(--font)}.kb .kh .tag{font:700 10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.t-nola .kb .kh .tag{color:var(--gold)}
.kb canvas{display:block;width:100%;touch-action:none}
.kb .kc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.kb .play{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}
.t-nola .kb .play{background:var(--navy)}
.kb .play.on{background:var(--coral)}
.kb .tr{display:inline-flex;align-items:center;gap:4px;font:600 13px var(--font)}
.kb .tr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.kb .tr span{min-width:58px;text-align:center}
.kb .prog{height:4px;background:var(--surf2)}.kb .prog i{display:block;height:100%;width:0;background:var(--coral)}
.kb .legend{font:500 11px var(--font);color:var(--muted);padding:0 14px 8px}
.kb .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px -1px 8px}
.pbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--font);cursor:pointer;font-style:normal}
/* fab + tools (global style) */
.fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:40;display:flex;gap:8px}
.fab button{height:52px;border-radius:999px;border:0;padding:0 18px;font:700 15px var(--font);cursor:pointer;box-shadow:0 10px 28px rgba(47,123,246,.35)}
.fab .tools{background:var(--blue);color:#fff}
.fab .live{background:var(--coral);color:#fff;display:none;box-shadow:0 10px 28px rgba(255,106,77,.4)}
.fab .live.show{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
/* pannelli flottanti (Strumenti a destra, Libreria a sinistra): non coprono il sito, si continua a navigare */
.fab.fl{right:auto;left:16px}
@media (max-width:430px){.fab:not(.fl){flex-direction:column-reverse;align-items:flex-end}}
@media (max-width:699px){body.p-tools:not(.p-mini) .fab.fl{display:none}body.p-mini .lib{bottom:var(--minih,140px);max-height:calc(86vh - var(--minih,140px));padding-bottom:0;box-shadow:0 -6px 24px rgba(15,27,45,.18)}
 body.p-mini .fab.fl{bottom:calc(var(--minih,140px) + 12px)}body.p-mini #app{padding-bottom:calc(var(--minih,140px) + 70px)}}
.fab .libb{background:#fff;color:var(--ink);box-shadow:0 10px 28px rgba(15,27,45,.18);border:1px solid var(--line)}
body.p-tools .fab:not(.fl),body.p-lib .fab.fl{display:none}
.sheet,.lib{position:fixed;z-index:51;background:#fff;font-family:var(--font);color:var(--ink);box-shadow:0 12px 44px rgba(15,27,45,.22);display:flex;flex-direction:column;
 left:0;right:0;bottom:0;border-radius:22px 22px 0 0;max-height:62vh;transform:translateY(110%);transition:transform .26s ease;padding-bottom:var(--safe-b)}
.lib{max-height:86vh;z-index:52}
.sheet:not(.show),.lib:not(.show){visibility:hidden;pointer-events:none;transition:transform .26s ease,visibility 0s .26s}
.sheet.show,.lib.show{transform:none;visibility:visible}
@media (min-width:700px){
 .sheet,.lib{left:auto;right:16px;bottom:calc(16px + var(--safe-b));width:min(400px,calc(50vw - 22px));max-height:min(70vh,640px);border-radius:20px;padding-bottom:0;transform:translateY(calc(100% + 40px))}
 .lib{right:auto;left:16px;width:min(420px,calc(100vw - 44px - min(400px,50vw - 22px)));max-height:min(84vh,820px)}}
.chero .lchip{margin-top:12px}
.shead{flex:none;padding:6px 0 0;touch-action:none;cursor:grab}
.shrow{display:flex;align-items:center;gap:6px;padding:0 10px 8px 0}
.shead .tabs{padding:0 14px 10px}
.shrow .lt{flex:1;font:800 17px var(--font);padding-left:18px}
.sx{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);font:700 15px var(--font);cursor:pointer;display:grid;place-items:center}
#pane,.lbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 8px}
#mini{display:none;flex-direction:column;gap:10px;padding:12px 12px 14px;touch-action:none}
.sheet.mini .shead,.sheet.mini #pane{display:none}.sheet.mini #mini{display:flex}
.mrow{display:flex;align-items:center;gap:8px;min-width:0}
.mt{flex:1;min-width:0;font:700 15px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.mrow .sx{width:42px;height:42px;font-size:18px}
.mp{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:20px;cursor:pointer}.mp.on{background:var(--coral)}
.mc{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc button{flex:none;min-width:42px;height:42px;padding:0 8px;border:1px solid var(--line);background:#fff;border-radius:999px;font:700 16px var(--font);cursor:pointer;color:var(--ink)}
.mc em{flex:1;min-width:0;font:800 21px var(--font);font-style:normal;text-align:center;white-space:nowrap}
.mc em small{font:600 12px var(--font);color:var(--muted)}
.mtim{border-top:1px solid var(--line);padding-top:10px}.mtim .mt small{font:600 12px var(--font);color:var(--muted)}
.mtim button{flex:none;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:700 15px var(--font);color:var(--ink);cursor:pointer}
.mtim button[data-mm="tplay"]{background:var(--blue);border-color:var(--blue);color:#fff}
@media (max-width:420px){.mc .m5{display:none}}
/* libreria */
.lnew{display:flex;align-items:center;gap:12px;margin:4px 14px 10px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--blue);background:#f4f8ff;cursor:pointer;width:calc(100% - 28px);text-align:left;font-family:var(--font);color:var(--ink)}
.lnew b{font-size:24px;color:var(--blue)}.lnew small{display:block;color:var(--muted);font-size:12px}
.lhint{font:500 13px/1.45 var(--font);color:var(--muted);margin:6px 18px 10px}
.litem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.litem .lp{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);font-size:15px;cursor:pointer;color:var(--ink)}
.litem .lp.ok{background:var(--blue);color:#fff}.litem .lp.on{background:var(--coral);color:#fff}
.litem .lt2{flex:1;min-width:0;cursor:pointer}.litem .lt2 b{display:block;font:700 14px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .lt2 small{display:block;font:500 12px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lchip{display:inline-flex;gap:4px;margin-top:5px;flex-wrap:wrap}.lchip button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font:600 11px var(--font);color:var(--ink);cursor:pointer}
.lchip button.s{border-style:dashed;color:var(--muted)}.lchip button.pin{border-color:var(--blue);color:var(--blue)}
.litem .go2{flex:none;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:6px}
.lplay{flex:none;border-top:1px solid var(--line);padding:8px 12px;background:var(--surf)}
.lplay .r1{display:flex;align-items:center;gap:8px;font:700 13px var(--font)}.lplay .r1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lplay audio{width:100%;height:36px;margin-top:6px}
.lbody .af{padding:0 14px}.lbody .lup-h{font:800 18px var(--font);margin:2px 18px 6px}.lbody .lup-h small{display:block;font:500 12px var(--font);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 14px;border-radius:999px;font:600 14px var(--font);background:var(--surf)}
.tabs button.on{background:var(--ink);color:#fff}
.pane{padding:6px 18px}
.big{font:800 68px/1 var(--font);letter-spacing:-.04em;text-align:center;margin:8px 0 4px}
.big small{font:600 14px var(--font);color:var(--muted);margin-left:6px;letter-spacing:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
input[type=range]{width:100%;accent-color:var(--blue)}
.lbl{font:700 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.beats{display:flex;justify-content:center;gap:10px;margin:14px 0}
.beats i{width:20px;height:20px;border-radius:50%;background:var(--surf2);border:2px solid transparent;cursor:pointer;transition:transform .08s}
.beats i.acc{border-color:var(--blue)}.beats i.mute{opacity:.25}
.beats i.hit{background:var(--coral);transform:scale(1.25)}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font:600 13px var(--font)}
.seg button.on{background:var(--blue);color:#fff}
.go{display:block;width:100%;height:56px;border-radius:16px;border:0;font:800 17px var(--font);cursor:pointer;background:var(--blue);color:#fff;margin-top:14px;box-shadow:0 8px 20px rgba(47,123,246,.3)}
.go.stop{background:var(--coral);box-shadow:0 8px 20px rgba(255,106,77,.3)}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rlist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;background:var(--surf);border:2px solid transparent;border-radius:14px;padding:8px 12px;font:700 14px/1.2 var(--font);-webkit-tap-highlight-color:transparent}
.rlist button:active{transform:scale(.97)}
.rlist button.on{border-color:var(--blue);background:var(--blue2)}
.rlist button.on.pl{border-color:var(--coral);background:#fff1ed}
.rlist button i{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--font);font-style:normal;color:var(--blue)}
.rlist button.pl i{background:var(--coral);color:#fff}
.rplayer{background:var(--surf);border-radius:18px;padding:14px;margin-bottom:14px}
.rplayer h3{margin:0;font:800 18px var(--font)}.rplayer p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.rplayer .bpmrow{display:flex;align-items:center;gap:10px;margin-top:6px}

<body>
<div id="gate"><div class="box">
  <div class="eyebrow">Paolo Rubinacci</div>
  <h1>Scuola</h1>
  <p class="muted small">Area personale di studio</p>
  <form id="gf"><input id="gp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn gold" type="submit">Entra</button></form>

</div></div>

<header class="top"><div class="wrap"><div class="brand" data-go="home"><i>♪</i>Scuola</div><div class="crumb" id="crumb"></div><span class="streak" id="streak" hidden></span></div></header>
<main id="app"></main>

  <div class="tabs" id="libTabs"></div></div><div class="lbody" id="libBody"></div><div class="lplay" id="libPlay" hidden></div></div>

<script type="text/plain" id="enc">__ENC__</script>
<script>
"use strict";
/* ================= data (filled after decrypt) ================= */
let DATA={courses:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('scuola-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('scuola-'+k,JSON.stringify(v))}catch(e){}}};

/* ================= crypto gate ================= */
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function kdf(pw,salt){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt'])}
const keyCache={};
async function decBytes(raw,pw){const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),h=salt.join(',');const key=await (keyCache[h]=keyCache[h]||kdf(pw,salt));
 return {pt:new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)),key}}
let PW=null;
async function unlock(pw,silent){
 const enc=$('#enc').textContent.trim();
 if(!enc||enc==='__ENC__'){DATA=window.DEMO_DATA||DATA;return boot()}
 try{const {pt}=await decBytes(b2u(enc),pw);DATA=JSON.parse(new TextDecoder().decode(pt));PW=pw;LS.set('pw',pw);boot()}
 catch(e){if(!silent)$('#ge').textContent='Password non corretta.';LS.set('pw',null)}}
/* encrypted media: fetch .enc, decrypt with same password, make blob URL */
const blobCache={};
function mediaURL(src,type){
 if(!/\.enc$/.test(src))return Promise.resolve(src);
 return blobCache[src]=blobCache[src]||(async()=>{const r=await fetch(src);const raw=new Uint8Array(await r.arrayBuffer());
  const {pt}=await decBytes(raw,PW);return URL.createObjectURL(new Blob([pt],{type}))})().catch(e=>{delete blobCache[src];throw e})}
/* background prefetch: clips of the open lesson load one after another, so a tap plays at once */
let pfToken=0;
async function prefetch(list){const tok=++pfToken;for(const [src,type] of list){if(tok!==pfToken)return;try{await mediaURL(src,type)}catch(e){}}}
$('#gf').addEventListener('submit',e=>{e.preventDefault();unlock($('#gp').value)});

/* ================= router ================= */
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go==='home'?'':g.dataset.go)}});
const MG=new Set('EFHJLNOQSTWZ');
function nolaText(s){let out='',st=true;for(const ch of s.toUpperCase()){out+=(st&&MG.has(ch))?ch.toLowerCase():ch;st=!/\p{L}/u.test(ch)}return out}
let NOLA=false;
function applyNola(root){root.querySelectorAll('.t-nola .nt, .course.nola .nt').forEach(e=>{if(!e.dataset.o)e.dataset.o=e.textContent;e.textContent=NOLA?nolaText(e.dataset.o):e.dataset.o})}
if(document.fonts){document.fonts.load('20px NolaMardiGras').then(f=>{NOLA=f.length>0&&document.fonts.check('20px NolaMardiGras');document.body.classList.toggle('nola-on',NOLA);applyNola(document)}).catch(()=>{})}
new MutationObserver(()=>applyNola(document)).observe(document.getElementById('app'),{childList:true});
function boot(){$('#gate').remove();render()}
function progress(){return LS.get('done',{})}
/* lezioni fatte: ora si salva il momento (conta nei giorni di fila); le vecchie spunte senza data valgono da oggi */
(()=>{const p=LS.get('done',{});let ch=false;for(const k in p)if(p[k]===true){p[k]=Date.now();ch=true}if(ch)LS.set('done',p)})();
function render(){
 ascStop();
 LESSON=null;if(location.hash==='#diario')return renderDiario();
 const h=location.hash.slice(1),am=h.match(/^(.+?)-ascolti(?:-([a-z0-9]+)(?:-(modifica|carica))?)?$/);
 if(am){const ac_=DATA.courses.find(x=>x.id===am[1]);if(ac_)return renderAscolti(ac_,am[2],am[3])}
 const [cid,lid]=h.split('-l');const c=DATA.courses.find(x=>x.id===cid);
 if(c&&lid)return renderLesson(c,c.lessons.find(l=>String(l.n)===lid));
 if(c)return renderCourse(c);
 renderHome()}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
/* attività: sessioni salvate (questo dispositivo + diario sincronizzato), minuti registrati in automatico, lezioni segnate come fatte */
function sessions(){const loc=LS.get('log',[]),ids=new Set(loc.map(e=>e.id).filter(Boolean));
 return loc.concat(((DIARIO&&DIARIO.voci)||[]).filter(v=>!ids.has(v.id)))}
function autoMs(){return LS.get('auto',{})}
function activeDays(){const days=new Set(sessions().filter(e=>e.ms>0).map(e=>dayKey(e.at)));
 Object.entries(autoMs()).forEach(([k,ms])=>{if(ms>=60000)days.add(k)});
 Object.values(progress()).forEach(v=>{if(typeof v==='number')days.add(dayKey(v))});return days}
function streakDays(){const days=activeDays();let n=0,d=new Date();if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekMin(){const w0=weekStart();let ms=sessions().filter(e=>e.at>=w0).reduce((a,e)=>a+(e.ms||0),0);
 Object.entries(autoMs()).forEach(([k,v])=>{const [y,m,d]=k.split('-').map(Number);if(new Date(y,m-1,d).getTime()>=w0)ms+=v});return Math.round(ms/60000)}
function todayMin(){const k=dayKey(Date.now());return Math.round((sessions().filter(e=>dayKey(e.at)===k).reduce((a,e)=>a+(e.ms||0),0)+(autoMs()[k]||0))/60000)}
function updStreak(){const s=streakDays(),el=$('#streak');el.hidden=!s;el.textContent='🔥 '+s+(s===1?' giorno':' giorni')}
function theme(n){$('#app').className=n||''}
function nextLesson(c){const done=progress();return c.lessons.find(l=>!done[c.id+'-'+l.n])}
function renderHome(){
 pfToken++;theme('');$('#crumb').textContent='';updStreak();
 const done=progress(),goal=LS.get('goal',150),wm=weekMin(),tot=DATA.courses.reduce((a,c)=>a+c.lessons.filter(l=>done[c.id+'-'+l.n]).length,0);
 $('#app').innerHTML=`<div class="wrap"><section class="hero"><div class="eyebrow">Ciao Paolo</div><h1>La tua <em>scuola</em> di musica</h1><p>Videocorsi, esercizi e strumenti per fare pratica ogni giorno.</p></section>
 <div class="stats"><div class="stat goal" id="goalStat"><b>${wm}<small style="font-size:13px;font-weight:600"> / ${goal} min</small></b><span>pratica questa settimana · da lunedì</span><div class="meter"><i style="width:${Math.min(100,wm/goal*100)}%"></i></div></div>
 <div class="stat"><b>${streakDays()} 🔥</b><span>giorni di fila</span></div><div class="stat"><b>${tot}</b><span>lezioni completate</span></div></div>
 <div class="prac" id="homePrac"></div>
 <div class="sec-t">I miei corsi</div>
 <div class="grid">${DATA.courses.map(c=>{const n=c.lessons.length,d=c.lessons.filter(l=>done[c.id+'-'+l.n]).length,nx=nextLesson(c);
  return`<div class="course ${esc(c.theme||'')}" data-go="${c.id}"><div class="band"><div class="eyebrow">${esc(c.kind||'Videocorso')}</div><h2 class="nt">${esc(c.title)}</h2></div><div class="body"><div class="meta">${esc(c.sub)}</div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><div class="next"><span>${d} / ${n} lezioni</span>${nx?`<b>Continua · Lezione ${nx.n} ›</b>`:'<b>Completato ✓</b>'}</div></div></div>`}).join('')}
  <div class="course soon"><div class="eyebrow">Prossimamente</div><h2>Altri corsi in arrivo</h2><div class="meta">Qui aggiungeremo i prossimi videocorsi.</div></div></div>
 <div class="foot">Scuola · Paolo Rubinacci · area privata</div></div>`;window.scrollTo(0,0);
 drawPrac();$('#goalStat').style.cursor='pointer';$('#goalStat').onclick=()=>go('diario');
 if(!DIARIO&&!diarioLoading)loadDiario().then(()=>{if(!location.hash)renderHome()}).catch(()=>{});
}
function renderCourse(c){
 theme(c.theme?'t-'+c.theme.replace(/^.*\s/,''):'');$('#crumb').textContent=c.title;updStreak();const done=progress();
 $('#app').innerHTML=`<section class="chero"><div class="wrap"><div class="eyebrow">${esc(c.kind||'Videocorso')}</div><h1 class="nt">${esc(c.title)}</h1><p>${esc(c.sub)}</p></div></section><div class="wrap">
 <ul class="lessons">${c.lessons.map(l=>`<li data-go="${c.id}-l${l.n}"><span class="num">${l.n}</span><div><div class="t">${esc(l.title)}</div><div class="d">${esc(l.dur||'')}${l.clips?` · ${l.clips} passaggi suonati`:''}${l.ready?'':' · in preparazione'}</div></div><span class="chk ${done[c.id+'-'+l.n]?'done':''}">${done[c.id+'-'+l.n]?'✓ fatta':'›'}</span></li>`).join('')}</ul>
 ${isNola(c)?`<div class="acard" data-go="${c.id}-ascolti"><span class="ic">♫</span><div><b>Ascolti consigliati</b><span>Dal PDF della lezione 1 · ascolto e tracce separate</span></div></div>`:''}
 <div class="foot"></div></div>`;window.scrollTo(0,0)}
function renderLesson(c,l){
 if(!l)return go(c.id);
 theme(c.theme?'t-'+c.theme.replace(/^.*\s/,''):'');updStreak();
 $('#crumb').textContent=c.title+' · Lezione '+l.n;const key=c.id+'-'+l.n,done=progress()[key];
 let h=`<section class="chero"><div class="wrap"><div class="eyebrow">Lezione ${l.n} · ${esc(l.dur||'')}</div><h1 class="nt">${esc(l.title)}</h1><p>${esc(c.title)} · ${esc(c.sub.split('·')[0])}</p></div></section><div class="wrap">`;
 h+=`<div class="lbar" id="lesPrac"></div>`;
 if(l.brief)h+=`<div class="brief"><h3 class="nt">In breve</h3>${l.brief}</div>`;
 h+=`<div class="flow">`+(l.blocks||[]).map(blockHTML).join('')+`</div>`;
 if(!l.ready)h+=`<div class="pending">Questa lezione è in preparazione: trascrizione, citazioni dal PDF del corso e partiture arrivano qui, con i passaggi suonati integrati nel testo.</div>`;
 const i=c.lessons.indexOf(l),prev=c.lessons[i-1],next=c.lessons[i+1];
 h+=`<div class="row" style="justify-content:space-between;margin:30px 0">${prev?`<button class="btn sm" data-go="${c.id}-l${prev.n}">‹ Lezione ${prev.n}</button>`:'<span></span>'}
  <button class="btn sm ${done?'on':''}" id="doneBtn">${done?'✓ Completata':'Segna come fatta'}</button>
  ${next?`<button class="btn sm" data-go="${c.id}-l${next.n}">Lezione ${next.n} ›</button>`:'<span></span>'}</div><div class="foot"></div></div>`;
 $('#app').innerHTML=h;window.scrollTo(0,0);
 LESSON={c,l};drawPrac();
 $('#doneBtn').onclick=()=>{const p=progress();if(p[key])delete p[key];else{p[key]=Date.now();toast('✓ Lezione fatta: oggi conta nei giorni di fila')}LS.set('done',p);updStreak();renderLesson(c,l)};
 document.querySelectorAll('.clip[data-src]').forEach(initClip);
 document.querySelectorAll('.kb[data-k]').forEach(initKb);
 document.querySelectorAll('img[data-enc]').forEach(async i=>{i.src=await mediaURL(i.dataset.enc,'image/png')});
 const clips=[...document.querySelectorAll('.clip[data-src]')];(async()=>{const tok=++pfToken;for(const c of clips){if(tok!==pfToken)return;try{await c._load()}catch(e){}}})();
}
function blockHTML(b){
 const pr=b.practice?practiceBtn(b.practice):'';
 switch(b.t){
  case'h':return`<h2><span class="nt">${esc(b.text)}</span>${pr}</h2>`;
  case'p':return`<p>${b.time?`<span class="ts">${esc(b.time)}</span>`:''}${b.html}</p>`;
  case'quote':return`<div class="quote"><span class="src">Dal PDF del corso</span>${b.html}</div>`;
  case'img':return`<figure><img ${/\.enc$/.test(b.src)?'data-enc':'src'}="${esc(b.src)}" alt="${esc(b.cap||'')}" loading="lazy"><figcaption>${esc(b.cap||'')}</figcaption></figure>`;
  case'clip':return`<div class="clip"${b.src?` data-src="${esc(b.src)}"`:''}><div class="vh"><b>▶ ${esc(b.label)}</b><span class="ts">${esc(b.from)}–${esc(b.to)}</span></div>
   ${b.src?`<video playsinline controls preload="none"></video><div class="ctl"><span class="seg sp"><button data-r=".5">50%</button><button data-r=".75">75%</button><button data-r="1" class="on">100%</button></span>
   <button class="btn sm" data-ab="a">A</button><button class="btn sm" data-ab="b">B</button><button class="btn sm" data-ab="loop">⟲ Loop</button>${pr}</div>`
   :`<div class="noclip">Ritaglio video in arrivo.${pr?' '+pr:''}</div>`}</div>`;
  case'practice':return`<p>${pr}</p>`;
  case'kb':return kbHTML(b);
  default:return''}}
function practiceBtn(p){return` <button class="pbtn" data-practice='${esc(JSON.stringify(p))}'>♩ ${esc(p.rhythm?(RHY[p.rhythm]?.name||p.label):(p.label||'Metronomo'))} · ${p.bpm} bpm</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-practice]');if(!b)return;const p=JSON.parse(b.dataset.practice);
 if(p.rhythm&&RHY[p.rhythm]){R.id=p.rhythm;R.bpm=p.bpm;openTools('rhythm',true);startRhythm()}else{M.bpm=p.bpm;if(p.swing!=null)M.swing=p.swing;openTools('metro',true);startMetro()}});
/* clip player with A-B loop & slow-down (pitch preserved) */
function initClip(el){
 const v=el.querySelector('video');let A=null,B=null,loop=false,ready=null;
 v.preservesPitch=true;v.webkitPreservesPitch=true;v.removeAttribute('controls');v.setAttribute('preload','auto');
 const vh=el.querySelector('.vh b'),label=vh.textContent;
 function load(){return ready=ready||mediaURL(el.dataset.src,'video/mp4').then(u=>{v.src=u;v.setAttribute('controls','');el.classList.add('ok');return u})}
 el._load=load;
 v.addEventListener('click',async()=>{if(!el.classList.contains('ok')){await load();v.play()}});
 el.querySelector('.vh').addEventListener('click',async()=>{if(!el.classList.contains('ok'))vh.textContent='⏳ '+label.replace(/^▶ /,'');await load();vh.textContent=label;v.play()});
 v.addEventListener('timeupdate',()=>{if(loop&&A!=null&&B!=null&&v.currentTime>=B){v.currentTime=A}});
 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await load();v.playbackRate=+b.dataset.r;el.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
 el.querySelectorAll('[data-ab]').forEach(b=>b.onclick=async()=>{await load();const k=b.dataset.ab;
  if(k==='a'){A=v.currentTime;b.textContent='A '+fmt(A)}else if(k==='b'){B=v.currentTime;b.textContent='B '+fmt(B)}
  else{loop=!loop;b.classList.toggle('on',loop);if(loop){if(A==null)A=0;if(B==null)B=v.duration||1e9;v.currentTime=A;v.play()}}})}
function fmt(t){t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}

/* ================= keyboard player (MIDI-like note lists) ================= */
const KB={},NN=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'],KEYI={C:0,'C#':1,Db:1,D:2,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11};
let kbN=0,kbActive=null;
function kbHTML(b){const id='kb'+(kbN++);KB[id]=b;
 return`<div class="kb" data-k="${id}"><div class="kh"><span class="tag">Tastiera</span><b>${esc(b.title||'')}</b></div>
 <div class="legend">Mano destra<i style="background:var(--blue)"></i> · Mano sinistra<i style="background:var(--coral)"></i></div>
 <canvas></canvas><div class="prog"><i></i></div>
 <div class="kc"><button class="play" aria-label="Play">▶</button>
 <span class="seg">${[['0','Straight'],['1','Swing']].map(([v,l])=>`<button data-sw="${v}" class="${(+v===(b.swing?1:0))?'on':''}">${l}</button>`).join('')}</span>
 <span class="seg sp">${[[.5,'50%'],[.75,'75%'],[1,'100%']].map(([r,l])=>`<button data-sp="${r}" class="${r===1?'on':''}">${l}</button>`).join('')}</span>
 <span class="tr"><button data-tr="-1">−</button><span class="kn"></span><button data-tr="1">+</button></span>
 <span class="seg"><button data-hand="R">Destra</button><button data-hand="L">Sinistra</button><button data-hand="" class="on">Entrambe</button></span>
 <span class="tr"><button data-bpm="-1">−</button><span class="kbpm"></span><button data-bpm="1">+</button></span><button class="btn sm" data-ktap>Tap</button><button class="btn sm" data-kloop>⟲ Loop</button><button class="btn sm" data-kclick>♩ Click</button></div><div class="legend" style="padding-top:0">Pianoforte: Salamander Grand Piano, A. Holm (CC-BY 3.0)</div></div>`}
function isBlack(m){return [1,3,6,8,10].includes(m%12)}
function initKb(el){
 const b=KB[el.dataset.k],cv=el.querySelector('canvas'),ctx=cv.getContext('2d');
 const st={sw:!!b.swing,tr:0,sp:1,hand:'',loop:false,click:false,playing:false,t0:0,raf:0,timer:0,next:0,on:new Map()};
 const bkey='kbbpm-'+(b.title||''),saved=LS.get(bkey,null);let base=saved||b.bpm||90;const len0=0,len=b.length||Math.max(...b.notes.map(n=>n[0]+n[1]));
 let lo=Math.min(...b.notes.map(n=>n[2]))-2,hi=Math.max(...b.notes.map(n=>n[2]))+2;
 function range(){let a=lo+Math.min(0,st.tr),z=hi+Math.max(0,st.tr);while(isBlack(a))a--;while(isBlack(z))z++;return [a,z]}
 function keyName(){return (NN[((KEYI[b.key]??0)+st.tr+120)%12])+(b.minor?'m':'')}
 function draw(){const dpr=window.devicePixelRatio||1,W=cv.clientWidth;
  const [a,z]=range();const whites=[];for(let m=a;m<=z;m++)if(!isBlack(m))whites.push(m);const ww=W/whites.length,pos={};
  /* real keyboard proportions: white key about 1 : 5.5, black key about 0.6 of the length */
  const H=Math.round(Math.max(52,Math.min(165,ww*5.5)));cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  whites.forEach((m,i)=>pos[m]=i*ww);
  ctx.clearRect(0,0,W,H);
  for(const m of whites){const on=st.on.get(m);ctx.fillStyle=on?(on==='R'?'#2f7bf6':'#ff6a4d'):'#fff';ctx.fillRect(pos[m]+.5,0,ww-1,H);ctx.strokeStyle='#cfd8e6';ctx.strokeRect(pos[m]+.5,0,ww-1,H);

/* ---- MIDI -> tastiera (tracce 1 e 2 = mano destra e sinistra; se c'e' una traccia sola si divide al Do centrale) ---- */
function midiToKb(buf,title){const d=new DataView(buf);let p=0;
 const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p+i));p+=n;return s};
 const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=v*128+(b&127)}while(b&128);return v};

 for(let t=0;t<nt&&p<d.byteLength-8;t++){const id=str(4),len=d.getUint32(p);p+=4;const end=p+len;if(id!=='MTrk'){p=end;continue}
  let tick=0,run=0;const on={},notes=[];
  while(p<end){tick+=vlq();let st=d.getUint8(p);if(st&128){p++;if(st<0xf0)run=st}else st=run;const ty=st&0xf0;
   if(st===0xff){const mt=d.getUint8(p++),l=vlq();if(mt===0x51&&!tempo)tempo=(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2);if(mt===0x58&&!tsig)tsig=d.getUint8(p);p+=l}
   else if(st===0xf0||st===0xf7){p+=vlq()}
   else if(ty===0x90||ty===0x80){const n=d.getUint8(p),v=d.getUint8(p+1);p+=2;const k=(st&15)*128+n;
    if(ty===0x90&&v>0)(on[k]=on[k]||[]).push([tick,v]);else{const s=(on[k]||[]).shift();if(s)notes.push([s[0],tick-s[0],n,s[1]])}}
   else if(ty===0xc0||ty===0xd0)p+=1;else p+=2}
  p=end;if(notes.length)tracks.push(notes)}
 const bpm=Math.round(60e6/(tempo||500000)),two=tracks.length===2,out=[];
 tracks.forEach((ns,i)=>ns.forEach(([s,l,m,v])=>out.push([s/div,Math.max(.05,l/div),m,two?(i===0?'R':'L'):(m>=60?'R':'L'),Math.max(.25,v/127)])));

 let bg=0;for(let v=1;v<256;v++)if(hist[v]>hist[bg])bg=v;
 if(bg>253||bg<200||hist[bg]<tot*.5)return null;   // nessuno sfondo grigio uniforme attorno alla pagina: non ritaglio

 for(let xx=0;xx<W;xx++){let c=0;for(let y=ya;y<yb;y++)if(isBg(y*W+xx))c++;col[xx]=c/(yb-ya)<.9}

     niente correzioni continue, niente salti; il loop A-B è quello nativo, senza stacchi. Accendere/spegnere una traccia è istantaneo.
   · «Tracce separate» rallentate: le tracce scelte vengono mixate in un WAV e suonate da un solo <audio> che rallenta senza cambiare l'intonazione;

let GRX=null,GMAP=null;
function glossBuild(cat){const items=GLOSS.slice();
 if(cat)Object.entries(cat).forEach(([id,x])=>{if(!x.t||x.t.length<4)return;const g=items.find(g=>g.a.some(a=>normA(a)===normA(x.t)));if(g){g.bid=id;return}
  const st=String(x.storia||'').split(/\n\s*\n/)[0];items.push({n:x.t,k:'Brano nella tua libreria',a:[x.t],d:(st||[x.a,x.al,x.anno].filter(Boolean).join(' · ')).slice(0,420),bid:id})});
 GMAP=new Map();items.forEach(g=>g.a.forEach(a=>GMAP.set(a.toLowerCase(),g)));
 const alts=[...GMAP.keys()].sort((a,b)=>b.length-a.length).map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 GRX=new RegExp('(^|[^\\p{L}\\p{N}])('+alts.join('|')+')(?![\\p{L}\\p{N}])','giu')}
const GSKIP='a,button,input,textarea,select,.gl,.res,.atr,.litem,.nt,.clip .vh,.kb,.pbtn,script,style,.gpop,.chips,.stems,.btabs,.lchip,.atr .h,code';
function linkify(root){if(!GRX||!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;
  return !n.nodeValue.trim()||!p||p.closest(GSKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
 const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
 for(const n of nodes){const t=n.nodeValue;GRX.lastIndex=0;if(!GRX.test(t))continue;GRX.lastIndex=0;const fr=document.createDocumentFragment();let last=0,m;
  while((m=GRX.exec(t))){const st=m.index+m[1].length;fr.append(t.slice(last,st));const sp=document.createElement('span');sp.className='gl';sp.tabIndex=0;sp.dataset.g=m[2].toLowerCase();sp.textContent=m[2];fr.append(sp);last=st+m[2].length}
  fr.append(t.slice(last));n.parentNode.replaceChild(fr,n)}}

/* ================= pratica e diario =================
   · Timer di pratica (D): parte dalla home, dalla barra della lezione o da Strumenti › Diario. Alla fine si salva la sessione.
   · Minuti automatici: mentre suonano metronomo, ritmi, tastiera, lettore dei brani o video della lezione (e il timer è fermo).
   · «＋ Aggiungi a mano»: per la pratica fatta senza timer.
   · Ogni sessione salvata va nel diario sincronizzato su GitHub (cifrato): diario/voci/<id>.json.enc (+ messaggio vocale).
     GitHub Actions (tools/diario.py) trascrive i vocali e, con la chiave Anthropic, mette in ordine le note e scrive il
     «diario di viaggio» della settimana: solo riassunti di quello che Paolo ha scritto o detto, mai consigli. */
const D=Object.assign({start:null,acc:0,what:'',lez:null},LS.get('timer',{}));let dInt=null,LESSON=null;
function tNow(){return D.acc+(D.start?Date.now()-D.start:0)}
function hms(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function dStore(){LS.set('timer',D)}
function timerStart(o){if(!D.start){D.start=Date.now();if(o){if(o.what&&!D.what)D.what=o.what;if(o.lez)D.lez=o.lez}}dStore();pracChanged()}
function timerPause(){if(D.start){D.acc=tNow();D.start=null}dStore();pracChanged()}
function timerReset(){D.start=null;D.acc=0;D.what='';D.lez=null;D.tempi=[];dStore();pracChanged()}
/* col metronomo (o un ritmo) parte anche la pratica, se non è già in corso; si può spegnere dal metronomo */
function autoPrac(){if(D.start||!LS.get('autoPrac',true))return;timerStart({what:lessonWhat(),lez:LESSON&&LESSON.l.n});toast('⏱ Pratica avviata insieme al metronomo')}
/* percorso del tempo durante la sessione: [{s:'♩'|nome ritmo, bpm, sec}] */
function tempiTick(){if(!D.start||!(M.playing||R.playing))return;const k=M.playing?'Metronomo':RHY[R.id].name,b=M.playing?M.bpm:R.bpm;D.tempi=D.tempi||[];
 const l=D.tempi[D.tempi.length-1];if(l&&l.s===k&&l.bpm===b)l.sec++;else D.tempi.push({s:k,bpm:b,sec:1});if(Date.now()%5000<1000)dStore()}
function tempiCompact(t){const o=[];(t||[]).filter(x=>x.sec>=10).forEach(x=>{const l=o[o.length-1];if(l&&l.s===x.s&&l.bpm===x.bpm)l.sec+=x.sec;else o.push(Object.assign({},x))});return o}
function tempiTxt(t){const c=tempiCompact(t);if(!c.length)return'';const by={};c.forEach(x=>(by[x.s]=by[x.s]||[]).push(x));
 return Object.entries(by).map(([k,l])=>`${k}: ${l.map(x=>x.bpm+' bpm'+(x.sec>=60?' ('+Math.round(x.sec/60)+' min)':'')).join(' → ')}`).join(' · ')}
function tempiMax(t){return Math.max(0,...tempiCompact(t).map(x=>x.bpm))||null}
function timerFinish(){timerPause();dStore();const tp=tempiCompact(D.tempi);sessionModal({ms:tNow(),what:D.what||lessonWhat()||(tp.length?[...new Set(tp.map(x=>x.s))].join(' + '):''),lez:D.lez||(LESSON&&LESSON.l.n),tempi:tp,fromTimer:true})}

async function rawGet(path,bin){const t=ghTok();

 if(!idx){DIARIO=cache.voci.length?cache:{voci:[],elab:{},sett:{}};return DIARIO}
 const old=Object.fromEntries(cache.voci.map(v=>[v.id,v]));const voci=[];
 await Promise.all(idx.voci.map(async x=>{let v=old[x.id];if(!v||force){const u=await rawGet('diario/voci/'+x.id+'.json.enc',true);if(u){try{v=Object.assign(await decJSON(u),{id:x.id})}catch(e){}}}if(v)voci.push(v)}));

async function ghCommitDiario(tok,files,addIdx,msg,say,dels){const tree0=[];
 for(const f of files){say('Invio '+f.label+'…');const b=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:u2b(f.u8),encoding:'base64'})},tok);tree0.push({path:f.path,mode:'100644',type:'blob',sha:b.sha})}
 for(let i=0;i<4;i++){say('Salvo nel diario…');const head=(await gh('/git/ref/heads/main',{},tok)).object.sha,com=await gh('/git/commits/'+head,{},tok);
  let idx={voci:[]};const r=await fetch(GHR+'/contents/diario/indice.json?ref='+head,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw+json'}});if(r.ok)idx=await r.json();
  idx.voci=idx.voci||[];addIdx(idx);

  if(dels&&dels.length){const all=await gh('/git/trees/'+com.tree.sha+'?recursive=1',{},tok);const have=new Set(all.tree.map(t=>t.path));tree=tree.concat(dels.filter(p=>have.has(p)).map(p=>({path:p,mode:'100644',type:'blob',sha:null})))}
  const tr=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:com.tree.sha,tree})},tok);
  const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:msg,tree:tr.sha,parents:[head]})},tok);
  try{await gh('/git/refs/heads/main',{method:'PATCH',body:JSON.stringify({sha:nc.sha})},tok);return idx}catch(e){if(e.status!==422)throw e}}

   <div class="drecap"><div class="lbl">${rc?'Diario di viaggio della settimana':'Riepilogo'}</div>${esc(rc?rc.testo:mech(l))}</div>
   ${l.map(v=>{const e=Dg.elab[v.id]||{};return`<div class="dent"><div class="dh"><b>${esc(v.what||'Pratica')}</b><span>${new Date(v.at).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} · ${Math.round((v.ms||0)/60000)} min${v.bpm?' · '+v.bpm+' bpm':''}${v.local?' · solo su questo dispositivo':''}</span></div>${v.tempi&&v.tempi.length?`<div class="dw">♩ ${esc(tempiTxt(v.tempi))}</div>`:''}
    ${e.ordinato?`<div class="dx">${esc(e.ordinato)}</div>`:v.note?`<div class="dx">${esc(v.note)}</div>`:''}
    ${v.audio?(e.trascr?`<details class="dt"><summary>🎙 Messaggio vocale · trascrizione</summary>${esc(e.trascr)}</details>`:e.err?`<div class="dw">⚠️ ${esc(e.err)}</div>`:'<div class="dw">🎙 Messaggio vocale: trascrizione in arrivo (qualche minuto)</div>'):''}
    ${e.ordinato&&v.note?`<details class="dt"><summary>Le tue note originali</summary>${esc(v.note)}</details>`:''}</div>`}).join('')}`}).join('')||'<div class="empty">Ancora nessuna sessione. Avvia la pratica qui sopra, oppure aggiungi a mano quella che hai già fatto oggi.</div>'}
  <p class="small muted" style="margin-top:22px">Minuti registrati in automatico (metronomo, ritmi, tastiera, brani, video): oggi ${Math.round((auto[dayKey(Date.now())]||0)/60000)} min. Contano nei totali ma non compaiono come sessioni.</p>
  <div class="row"><button class="btn sm" id="dRel">↻ Aggiorna</button><button class="btn sm" data-go="home">‹ Home</button></div><div class="foot"></div></div>`;
  drawPrac();$('#dRel').onclick=async()=>{$('#dRel').textContent='…';await loadDiario(true).catch(()=>{});if(location.hash==='#diario')draw()}};
 draw();window.scrollTo(0,0);try{await loadDiario();if(location.hash==='#diario')draw()}catch(e){}}

/* ================= tools sheet ================= */
/* pannello flottante: grande per regolare, ridotto (▁) a una finestrella in basso a destra; ✕ o trascina giù per chiudere.
   Non copre il sito: si continua a leggere la lezione e a navigare. */
let curTab=null,miniOn=false,miniInt=null;
function openTools(t,mini){try{loadDrums()}catch(e){}curTab=t||curTab||'metro';lastTab=curTab;$('#sheet').classList.add('show');document.body.classList.add('p-tools');showTab();setMini(!!mini);live()}
function closeTools(){$('#sheet').classList.remove('show');document.body.classList.remove('p-tools');if(curTab)lastTab=curTab;curTab=null;setMini(false);live()}
function setMini(on){miniOn=on;$('#sheet').classList.toggle('mini',on);document.body.classList.toggle('p-mini',on);clearInterval(miniInt);if(on){drawMini();if(curTab==='diary')miniInt=setInterval(()=>{const e=$('#miniT');if(e)e.textContent=hms(tNow())},500)}}
function showTab(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===curTab));({metro:paneMetro,rhythm:paneRhythm,diary:paneDiary})[curTab]()}
function drawMini(){if(!miniOn||!curTab)return;const m=$('#mini');
 const pm=(bpm)=>`<button class="m5" data-mm="-5" aria-label="Meno 5 bpm">−5</button><button data-mm="-1" aria-label="Meno 1 bpm">−</button><em>${bpm}<small> bpm</small></em><button data-mm="1" aria-label="Più 1 bpm">+</button><button class="m5" data-mm="5" aria-label="Più 5 bpm">+5</button>`;
 /* la finestrella mostra sempre lo strumento che suona (metronomo o ritmo) e, se c'è, il timer di pratica: si usano insieme */
 const rh=curTab==='rhythm'||(curTab==='diary'&&R.playing);
 const t=rh?RHY[R.id].name:`Metronomo · ${M.beats}/4${M.sub===2&&M.swing?' · swing':''}`,play=rh?R.playing:M.playing,ctl=rh?pm(R.bpm):pm(M.bpm)+`<button data-mm="tap">Tap</button>`;
 const showT=curTab==='diary'||tNow()>0;
 m.innerHTML=`<div class="mrow"><span class="mt">${esc(t)}</span><button class="sx" data-mm="max" title="Apri tutto" aria-label="Apri tutto">⤢</button><button class="sx" data-mm="x" title="Chiudi" aria-label="Chiudi">✕</button></div>
 <div class="mrow"><button class="mp ${play?'on':''}" data-mm="play" aria-label="${play?'Stop':'Avvia'}">${play?'■':'▶'}</button><div class="mc">${ctl}</div></div>
 ${showT?`<div class="mrow mtim"><span class="mt">⏱ <span id="miniT">${hms(tNow())}</span> <small>${D.start?'pratica in corso':tNow()>0?'in pausa':'pratica'}</small></span><button data-mm="tplay">${D.start?'❚❚ Pausa':tNow()>0?'▶ Riprendi':'▶ Avvia pratica'}</button>${tNow()>0?'<button data-mm="fine">■ Fine</button>':''}</div>`:''}`;
 requestAnimationFrame(()=>document.body.style.setProperty('--minih',$('#sheet').offsetHeight+'px'))}
$('#mini').addEventListener('click',e=>{const b=e.target.closest('[data-mm]');if(!b)return;const k=b.dataset.mm;
 if(k==='x')return closeTools();if(k==='fine'){timerFinish();return}if(k==='max'){setMini(false);return showTab()}
 if(k==='play'){if(curTab==='rhythm'||(curTab==='diary'&&R.playing))R.playing?stopRhythm():startRhythm();else M.playing?stopMetro():startMetro()}
 else if(k==='tplay'){if(D.start)timerPause();else timerStart({what:lessonWhat(),lez:LESSON&&LESSON.l.n})}
 else if(k==='tap'){const n=performance.now();taps=taps.filter(x=>n-x<2500);taps.push(n);if(taps.length>1){M.bpm=Math.max(30,Math.min(260,Math.round(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))));mSave()}}
 else if(curTab==='rhythm'||(curTab==='diary'&&R.playing)){R.bpm=Math.max(40,Math.min(240,R.bpm+ +k));rSave()}else{M.bpm=Math.max(30,Math.min(260,M.bpm+ +k));mSave()}
 drawMini();live()});
/* trascina giù per chiudere (dall'intestazione o dalla finestrella ridotta) */
function swipeClose(el,close){let y0=null,dy=0;const box=el.closest('.sheet,.lib');
 el.addEventListener('touchstart',e=>{if(e.target.closest('button,input,select'))return;y0=e.touches[0].clientY;dy=0;box.style.transition='none'},{passive:true});
 el.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);box.style.transform=dy?`translateY(${dy}px)`:''},{passive:true});
 el.addEventListener('touchend',()=>{if(y0==null)return;box.style.transition='';box.style.transform='';if(dy>60)close();y0=null})}
swipeClose($('#sHead'),closeTools);swipeClose($('#mini'),closeTools);
let lastTab='metro';
$('#openTools').onclick=()=>openTools(lastTab);
$('#tClose').onclick=closeTools;$('#tMin').onclick=()=>setMini(true);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;lastTab=curTab;showTab()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('.leg,.modal')){if($('#lib').classList.contains('show'))closeLib();else if(curTab)closeTools()}});
function live(){const snd=M.playing||R.playing,on=(snd||D.start)&&!curTab,l=$('#live');l.classList.toggle('show',!!on);$('#liveTxt').textContent=M.playing?M.bpm+' bpm · Stop':R.playing?RHY[R.id].name.split(' ')[0]+' '+R.bpm+' · Stop':D.start?'⏱ '+hms(tNow()):'';drawMini()}
$('#live').onclick=()=>{if(M.playing||R.playing){stopMetro();stopRhythm()}else if(D.start)openTools('diary',true)};
$('#live').oncontextmenu=e=>{e.preventDefault();openTools(M.playing?'metro':'rhythm',true)};

/* start */
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font:600 14px/1.3 system-ui,sans-serif;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
/* app offline (PWA) */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
 const ask=()=>navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage('status');
 navigator.serviceWorker.addEventListener('message',e=>{const s=e.data&&e.data.offline;if(s&&s.ok===s.total&&!LS.get('offok-'+s.total,false)){LS.set('offok-'+s.total,true);toast('✓ La Scuola ora funziona anche offline')}});
 navigator.serviceWorker.addEventListener('controllerchange',ask);setTimeout(ask,4000);setTimeout(ask,30000)}
const saved=LS.get('pw',null);
if($('#enc').textContent.trim()==='__ENC__')unlock('');else if(saved)unlock(saved,true);
</script>
</body>
