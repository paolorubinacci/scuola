# Prova automatica del diario (solo sul ramo selftest-diario, con password di prova): un messaggio vocale sintetico viene trascritto.
name: Diario - prova
on:
  push:
    branches: [selftest-diario]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q cryptography faster-whisper
      - name: Prova
        env:
          SCUOLA_PW: prova
        run: |
          set -o pipefail
          mkdir -p prova; W=$(mktemp -d); mkdir -p $W/tools $W/diario/voci
          cp tools/salt.hex tools/diario.py $W/tools/
          espeak-ng -v it -s 140 -w /tmp/voce.wav "Oggi ho studiato la lezione due, il ritmo della habanera e lo street beat. Ho ascoltato Street Parade di Earl King e ho provato la clave tre due al metronomo a novanta."
          ffmpeg -loglevel error -y -i /tmp/voce.wav -c:a aac -b:a 64k /tmp/voce.m4a
          python - "$W" <<'PY'
          import sys, os, json, time
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          W = sys.argv[1]; s = bytes.fromhex(open(W + '/tools/salt.hex').read().strip())
          k = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=s, iterations=200000).derive(b'prova')
          def enc(b):
              iv = os.urandom(12); return s + iv + AESGCM(k).encrypt(iv, b, None)
          at = int(time.time() * 1000)
          open(W + '/diario/voci/v1.json.enc', 'wb').write(enc(json.dumps({'at': at, 'ms': 1500000, 'what': 'Lezione 2', 'note': 'clave 3-2', 'audio': 'm4a'}).encode()))
          open(W + '/diario/voci/v1.m4a.enc', 'wb').write(enc(open('/tmp/voce.m4a', 'rb').read()))
          json.dump({'voci': [{'id': 'v1', 'at': at}]}, open(W + '/diario/indice.json', 'w'))
          PY
          echo "controlla: $(python tools/diario.py $W --controlla) audio: $(python tools/diario.py $W --controlla-audio)" | tee prova/diario.log
          python tools/diario.py $W 2>&1 | tee -a prova/diario.log
          echo "dopo: $(python tools/diario.py $W --controlla)" | tee -a prova/diario.log
          python - "$W" <<'PY' 2>&1 | tee -a prova/diario.log
          import sys, json
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          b = open(sys.argv[1] + '/diario/elab/v1.json.enc', 'rb').read()
          k = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=b[:16], iterations=200000).derive(b'prova')
          print('ELAB:', json.loads(AESGCM(k).decrypt(b[16:28], b[28:], None)))
          PY
      - name: Rapporto
        if: always()
        run: |
          git config user.name "Scuola bot"; git config user.email "scuola-bot@users.noreply.github.com"
          mkdir -p prova; test -f prova/diario.log || echo "nessun log" > prova/diario.log
          git add prova && git commit -q -m "Rapporto prova diario" && git push -q || true
