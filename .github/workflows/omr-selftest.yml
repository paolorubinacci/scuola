# Prova automatica della lettura delle partiture (solo sul ramo selftest-omr, con password di prova).
name: Partiture - prova
on:
  push:
    branches: [selftest-omr]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musescore3 poppler-utils > /dev/null
          pip install -q cryptography music21 pillow mido
      - name: Audiveris
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/audiveris.sh
      - name: Prova
        env:
          SCUOLA_PW: prova
        run: |
          set -o pipefail
          mkdir -p prova; W=$(mktemp -d); mkdir -p $W/tools $W/ascolti/prova/rp $W/ascolti/prova/ri
          cp tools/salt.hex tools/omr.py $W/tools/
          # brano di prova scritto qui: 16 battute in 3/4 per pianoforte, melodia con accordi a destra, basso e accordi a sinistra
          python - <<'PY'
          from music21 import stream, note, chord, meter, key, clef, layout, metadata
          rh, lh = stream.PartStaff(), stream.PartStaff()
          mel = [('E5', 1), ('D5', .5), ('C5', .5), ('E5', 1), ('G5', 2), ('F5', 1), ('E5', 1), ('D5', 1), ('C5', 1), ('D5', 3),
                 ('E5', 1), ('F5', .5), ('E5', .5), ('D5', 1), ('C5', 2), ('A4', 1), ('B4', 1), ('C5', 1), ('D5', 1), ('C5', 3)]
          harm = ['C3', 'C3', 'F2', 'G2', 'C3', 'A2', 'G2', 'C3']
          for i in range(16):
              mr, ml = stream.Measure(number=i + 1), stream.Measure(number=i + 1)
              if i == 0:
                  mr.append([clef.TrebleClef(), key.KeySignature(0), meter.TimeSignature('3/4')]); ml.append([clef.BassClef(), key.KeySignature(0), meter.TimeSignature('3/4')])
              r = harm[i % 8]
              ml.append(note.Note(r, quarterLength=1))
              ml.append(chord.Chord([note.Note(r).transpose(16).nameWithOctave, note.Note(r).transpose(19).nameWithOctave], quarterLength=1))
              ml.append(chord.Chord([note.Note(r).transpose(16).nameWithOctave, note.Note(r).transpose(19).nameWithOctave], quarterLength=1))
              rh_n = []; tot = 0; j = 0
              rh.append(mr); lh.append(ml)
          seq = mel * 2; k = 0
          for m in rh.getElementsByClass(stream.Measure):
              t = 0
              while t < 3:
                  p, d = seq[k % len(seq)]; k += 1; d = min(d, 3 - t)
                  m.append(chord.Chord([p, note.Note(p).transpose(-4).nameWithOctave], quarterLength=d) if d >= 1 and k % 3 == 0 else note.Note(p, quarterLength=d)); t += d
          s = stream.Score([rh, lh]); s.insert(0, metadata.Metadata(title='Valzer di prova', composer='Scuola'))
          s.insert(0, layout.StaffGroup([rh, lh], symbol='brace'))
          s.write('musicxml', fp='/tmp/prova.musicxml')
          print('note sorgente:', sum(len(n.pitches) for n in s.recurse().notes))
          PY
          QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=$(mktemp -d) mscore3 -o /tmp/prova.pdf /tmp/prova.musicxml
          # come uno screenshot: pagina a bassa risoluzione con bordo grigio
          pdftoppm -png -r 120 -singlefile /tmp/prova.pdf /tmp/pagina
          python - "$W" <<'PY'
          import sys, os, json
          from PIL import Image
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          W = sys.argv[1]; s = bytes.fromhex(open(W + '/tools/salt.hex').read().strip())
          k = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=s, iterations=200000).derive(b'prova')
          def enc(src, dst):
              iv = os.urandom(12); open(dst, 'wb').write(s + iv + AESGCM(k).encrypt(iv, open(src, 'rb').read(), None))
          im = Image.open('/tmp/pagina.png').convert('RGB'); im.save('/tmp/p1.jpg', quality=90); im.save('prova/pagina.png')
          enc('/tmp/prova.pdf', W + '/ascolti/prova/rp/spartito.pdf.enc')
          enc('/tmp/p1.jpg', W + '/ascolti/prova/ri/p1.jpg.enc')
          json.dump({'prova': {'t': 'Prova', 'r': [
              {'id': 'rp', 'k': 'pdf', 'c': 'Partitura', 't': 'PDF', 'f': 'rp/spartito.pdf.enc', 'st': 'pronto', 'omr': 'attesa'},
              {'id': 'ri', 'k': 'img', 'c': 'Partitura', 't': 'Foto', 'f': ['ri/p1.jpg.enc'], 'st': 'pronto', 'omr': 'attesa'}]}}, open(W + '/ascolti/catalog.json', 'w'))
          PY
          echo "controlla: $(python tools/elabora.py $W --controlla) audio: $(python tools/elabora.py $W --controlla-audio) omr: $(python tools/elabora.py $W --controlla-omr)" | tee prova/prova.log
          python tools/elabora.py $W 2>&1 | tee -a prova/prova.log
          { echo "== catalogo"; cat $W/ascolti/catalog.json; echo; echo "== file"; find $W/ascolti -type f -printf "%p %s\n"; } >> prova/prova.log
          python - "$W" <<'PY' 2>&1 | tee -a prova/prova.log
          import sys, mido
          from music21 import converter
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          W = sys.argv[1]
          src = [p.nameWithOctave for n in converter.parse('/tmp/prova.musicxml').recurse().notes for p in n.pitches]
          for r in ('rp', 'ri'):
              try:
                  b = open(f'{W}/ascolti/prova/{r}/omr.mid.enc', 'rb').read()
                  k = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=b[:16], iterations=200000).derive(b'prova')
                  open(f'/tmp/{r}.mid', 'wb').write(AESGCM(k).decrypt(b[16:28], b[28:], None))
                  m = mido.MidiFile(f'/tmp/{r}.mid')
                  tr = [sum(1 for x in t if x.type == 'note_on' and x.velocity > 0) for t in m.tracks]
                  got = [p.nameWithOctave for n in converter.parse(f'/tmp/{r}.mid').recurse().notes for p in n.pitches]
                  ok = sum(min(src.count(p), got.count(p)) for p in set(src))
                  print(f'== {r}: tracce {tr}, note lette {len(got)} / sorgente {len(src)}, altezze in comune {ok}')
              except Exception as e:
                  print(f'== {r}: ERRORE {e}')
          PY
      - name: Rapporto
        if: always()
        run: |
          git config user.name "Scuola bot"; git config user.email "scuola-bot@users.noreply.github.com"
          mkdir -p prova; test -f prova/prova.log || echo "nessun log" > prova/prova.log
          git add prova && git commit -q -m "Rapporto prova partiture" && git push -q || true
