# Prova automatica della catena di elaborazione (solo sul ramo selftest-ascolti, con password di prova).
name: Ascolti - prova
on:
  push:
    branches: [selftest-ascolti]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg musescore3 > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
          key: ascolti-v1
      - name: Installazione
        run: |
          python -m venv ~/demucs && ~/demucs/bin/pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          ~/demucs/bin/pip install -q demucs==4.0.1 soundfile "numpy<2"
          python -m venv ~/bp && ~/bp/bin/pip install -q basic-pitch==0.4.0
          pip install -q cryptography
      - name: Prova
        env:
          SCUOLA_PW: prova
          DEMUCS_PY: /home/runner/demucs/bin/python
          BP_PY: /home/runner/bp/bin/python
          MSCORE: mscore3
        run: |
          set -o pipefail
          W=$(mktemp -d); mkdir -p $W/tools $W/ascolti/solo $W/ascolti/band
          cp tools/salt.hex $W/tools/
          # brano di prova: accordi di piano sintetici (solo) e lo stesso con batteria finta (band), 20 secondi
          ffmpeg -loglevel error -f lavfi -i "sine=f=261.63:d=20" -f lavfi -i "sine=f=329.63:d=20" -f lavfi -i "sine=f=392:d=20" -filter_complex "amix=inputs=3,volume=2,apulsator=hz=2" -ar 44100 -ac 2 $W/solo.mp3
          ffmpeg -loglevel error -i $W/solo.mp3 -f lavfi -i "anoisesrc=d=20:a=0.3,apulsator=hz=4:width=0.1" -filter_complex amix=inputs=2 -ar 44100 -ac 2 $W/band.mp3
          python - "$W" <<'PY'
          import sys, os, json
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          W = sys.argv[1]; s = bytes.fromhex(open(W + '/tools/salt.hex').read().strip())
          k = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=s, iterations=200000).derive(b'prova')
          for t in ('solo', 'band'):
              iv = os.urandom(12); open(f'{W}/ascolti/{t}/originale.mp3.enc', 'wb').write(s + iv + AESGCM(k).encrypt(iv, open(f'{W}/{t}.mp3', 'rb').read(), None))
          json.dump({'solo': {'t': 'Prova solo', 'tipo': 'solo', 'stato': 'elaborazione', 'trascrivi': True},
                     'band': {'t': 'Prova band', 'tipo': 'band', 'stato': 'elaborazione', 'trascrivi': True}}, open(W + '/ascolti/catalog.json', 'w'))
          PY
          python tools/elabora.py $W 2>&1 | tee prova.log
          { echo "== catalogo"; cat $W/ascolti/catalog.json; echo; echo "== file"; find $W/ascolti -type f -printf "%p %s\n"; } >> prova.log
      - name: Rapporto
        if: always()
        run: |
          git config user.name "Scuola bot"; git config user.email "scuola-bot@users.noreply.github.com"
          mkdir -p prova && mv prova.log prova/ 2>/dev/null || echo "nessun log" > prova/prova.log
          git add prova && git commit -q -m "Rapporto prova ascolti" && git push -q || true
